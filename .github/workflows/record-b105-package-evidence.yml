name: Record b105 Package Evidence

"on":
  push:
    branches:
      - dev/send-stream-20260829
    paths:
      - ".github/workflows/record-b105-package-evidence.yml"

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact b105 package lineage
        uses: actions/checkout@v4
        with:
          ref: dev/send-stream-20260829
          fetch-depth: 0

      - name: Guard canonical b105 package identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "13e4be41f8481e8c72c8668a072e0c4915dcb796"
          test "$(git rev-parse HEAD^^)" = "93ab92a9a4a7b8a020ac209f6a82088dc77acbce"
          test "$(grep -c 'CURRENT_PROJECT_VERSION = 105;' ChatGPTClient.xcodeproj/project.pbxproj)" = "2"
          test "$(grep -c 'DIAGNOSTICS_CANDIDATE = \"DEV-send-stream-0.1.0-b105\";' ChatGPTClient.xcodeproj/project.pbxproj)" = "2"
          grep -q 'Product source: 6ef4e874d7c2c5f144ab7e784f7a81755d1b2f59' .github/workflows/ios-foundation.yml
          grep -q 'Candidate: DEV-send-stream-0.1.0-b105' .github/workflows/ios-foundation.yml
          test -f scripts/staging/b105_record_package.py

      - name: Apply b105 package evidence docs only
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/staging/b105_record_package.py
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected=$'docs/project/BUILD_TEST_INDEX.md\ndocs/project/MODULE_STATUS.md\ndocs/project/PROJECT_SPECIFIC_RULES.md\ndocs/project/PROJECT_STATE.md\ndocs/project/WEB_SEND_ADAPTER.md\ndocs/project/current/dev/DEV-send-stream-round7-runtime-addendum.md'
          test "$changed" = "$expected"
          grep -q '9956018294' docs/project/BUILD_TEST_INDEX.md
          grep -q 'd162a7132ff830d3a2f6eb85a2b4a5b4ebc2d9f84531b01418912c99109e5095' docs/project/current/dev/DEV-send-stream-round7-runtime-addendum.md
          grep -q 'new_conversation_identity_missing' docs/project/PROJECT_SPECIFIC_RULES.md
          grep -q 'package-ready override 2026-09-05' docs/project/WEB_SEND_ADAPTER.md

      - name: Commit durable b105 package evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/project/BUILD_TEST_INDEX.md docs/project/MODULE_STATUS.md docs/project/PROJECT_SPECIFIC_RULES.md docs/project/PROJECT_STATE.md docs/project/WEB_SEND_ADAPTER.md docs/project/current/dev/DEV-send-stream-round7-runtime-addendum.md
          git diff --cached --check
          git commit -m "docs: record b105 new-chat package evidence"
          git push origin HEAD:dev/send-stream-20260829
