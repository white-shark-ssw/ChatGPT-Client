name: Update b85 durable project docs

on:
  push:
    branches:
      - dev/send-stream-20260829
    paths:
      - ".github/workflows/docs-b85-index.yml"

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update durable b85 records
        run: |
          python3 - <<'PY'
          from pathlib import Path
          index = Path('docs/project/BUILD_TEST_INDEX.md')
          lines = index.read_text().splitlines()
          b84_prefix = '| `DEV-send-stream-0.1.0-b84` |'
          b85_prefix = '| `DEV-send-stream-0.1.0-b85` |'
          b84_row = '| `DEV-send-stream-0.1.0-b84` | `DEV-send-stream` | `0.1.0 (84)` | exact product/config source `626c3ad4d4d592618d794c4cb8854324f719f4a4`; clean CI/package head `c7398eea6b20788f0e13a18f98e79d3c81ebfc21`; PR #29 | Push `33559649854/100028790782`; PR `33559655688/100028812048`; canonical Artifact `9820763662`; ZIP `sha256:65ff52ddc7b6c4ad1e85e0c084a4f55799da06baad602dff3693edd12a814e9f`; IPA `sha256:1a276fbfc46efeb75566989892d8811561563d6c43a664b1bb7b30799468be38`; package Release/source `c7398eea6b20`/iOS14/arm64 | Runtime Diagnostic Positive: active authoritative Detail exposed approved trailing presentational timeline growth `1 -> 4 -> 5 -> 6` while visible assistant was absent and page-owned live acquisition failed; proves current Native projection dropped usable reasoning/tool blocks | **Diagnostic Runtime Positive / product acquisition unstable; permanently reserved** |'
          b85_row = '| `DEV-send-stream-0.1.0-b85` | `DEV-send-stream` | `0.1.0 (85)` | exact product/config source `ec64dd170a6386612af8cb68b394045ce3c85313`; clean Push CI/package head `6be1e8a8bafa80ef09c6fcebff014006de264e0f`; PR #29 | Push `33564141168/100043319389`; PR `33564179303/100043444613`; canonical Artifact `9822441595`; ZIP `sha256:0e32a52f91cb8580b91451d97d37696073fb4ee57c5df3918897aab69700ba48`; IPA `sha256:f03f5d657cbf71772d197fcea969cafb73d249c2dcc3dd2feb72e139d6e9cf61`; package Release/source `6be1e8a8bafa`/iOS14/arm64 | Runtime Pending: manual Sync should immediately adopt approved trailing Detail reasoning/tool blocks into the existing external response owner; later page snapshots reuse the same generation; repeated explicit Sync may advance blocks | **Code/guarded staging/Push+PR CI/Artifact/package verified; Runtime Pending; permanently reserved** |'
          b84_indexes = [i for i, line in enumerate(lines) if line.startswith(b84_prefix)]
          if len(b84_indexes) != 1: raise SystemExit(f'b84 row count {len(b84_indexes)}')
          i = b84_indexes[0]
          lines[i] = b84_row
          if not any(line.startswith(b85_prefix) for line in lines): lines.insert(i, b85_row)
          index.write_text('\n'.join(lines) + '\n')

          module = Path('docs/project/MODULE_STATUS.md')
          text = module.read_text()
          old = '| Streaming / send | **Next planned phase, not Active** | Future `DEV-send-stream` | Must evidence current send/stream protocol and use per-conversation response ownership. No global stream owner. |'
          new = '| Streaming / send | **Active / b85 Runtime Pending** | `DEV-send-stream`; PR #29 | Client-owned Send keeps true SSE. b84 Runtime proved active authoritative Detail can contain approved trailing reasoning/tool blocks before a visible assistant row; b85 adopts them into the existing per-conversation response owner on explicit manual Sync. Push+PR CI/Artifact verified; real-device b85 Runtime pending. Stable/Frozen No. |'
          if old not in text and new not in text: raise SystemExit('streaming module row not found')
          module.write_text(text.replace(old, new, 1))

          decisions = Path('docs/project/TECHNICAL_DECISIONS.md')
          text = decisions.read_text()
          marker = '## Rule\n'
          td = '''### TD-023 — Explicit cross-platform Sync may adopt approved trailing Detail timeline into the existing response owner\n- **Status**: Confirmed architecture from b84 Runtime; b85 product Runtime pending\n- **Date**: 2026-09-02\n- **Evidence**: Exact b84 real-device samples on the previously problematic conversation showed authoritative Detail trailing presentational timeline growth `1 -> 4 -> 5 -> 6` while visible assistant count stayed fixed and covered Web never acquired a live response. The parser sources were already-authorized thinking preambles/reasoning recap/tools; raw `thoughts` and `inline_cot_expandable_content` remained skipped.\n- **Decision**: Explicit manual `同步最新消息` may project that already-approved trailing Detail timeline through the existing per-conversation `ConversationRepository` response runtime. If page-owned continuation later attaches it must update the same external response generation. Another explicit Sync may refresh a newer block while the external response remains active. Do not create a second response store or expose hidden thoughts.\n- **Rejected**: making covered-page re-arm the sole deterministic manual acquisition mechanism; polling/timer/retry/watchdog loops; duplicate Send/resend; WebSocket body authority; raw hidden-thought presentation.\n\n'''
          if '### TD-023 — Explicit cross-platform Sync may adopt approved trailing Detail timeline into the existing response owner' not in text:
              if marker not in text: raise SystemExit('TECHNICAL_DECISIONS Rule marker missing')
              text = text.replace(marker, td + marker, 1)
              decisions.write_text(text)
          PY
          git diff --check
      - name: Commit durable docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/project/BUILD_TEST_INDEX.md docs/project/MODULE_STATUS.md docs/project/TECHNICAL_DECISIONS.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs(send): index b84 diagnosis and b85 candidate"
          git push origin HEAD:dev/send-stream-20260829
