name: official iOS Probe v0.2 finalize

on:
  push:
    branches:
      - dev/send-stream-20260829
    paths:
      - ".github/workflows/official-ios-probe-v02-finalize.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/send-stream-20260829
          fetch-depth: 0

      - name: Guard packaged research identity
        run: |
          test "$(git rev-parse HEAD:scripts/research/official_ios_realtime_probe/ChatGPTRealtimeProbe.m)" = "$(git rev-parse 567e5faa52f0254a14760fe1ea88dc56c8021ee4:scripts/research/official_ios_realtime_probe/ChatGPTRealtimeProbe.m)"
          grep -q 'RPTProbeVersion = @"0.2"' scripts/research/official_ios_realtime_probe/ChatGPTRealtimeProbe.m
          grep -q 'Official iOS Probe v0.1 Runtime / v0.2 research gate' docs/project/current/dev/DEV-send-stream.md

      - name: Sync exact build and package evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path

          checkpoint = Path('docs/project/current/dev/DEV-send-stream.md')
          text = checkpoint.read_text()
          old = '**Next exact action:** build/package Probe v0.2, then run one clean cross-platform late-join test after pressing `清空` immediately before the remote turn. Analyze the earliest target-correlated HTTP/SSE/WebSocket acquisition event before any b96 decision.'
          new = '''Probe v0.2 research source commit is `567e5faa52f0254a14760fe1ea88dc56c8021ee4`; build-trigger/package-source head is `9e57aafb16a84598808c33db0d8c44d3edc82aa1`. Dedicated research CI `33789454087 / 100762208087` passed Toolchain / Build research dylib / Validate / Upload. Canonical Artifact `9906723606` digest and downloaded ZIP SHA are both `sha256:8fd10169843d76292203e534081536296a108af6f19dab2b106c9bbb9c9c71f6`. Exact dylib is 153,264 bytes, SHA `c409ba1e6038f398efd5de0635dba0aab97fec9c81e59ade774e16c0d442cc28`, matching sidecar. Repackaging against exact official source ZIP `bb11734434bee912355b1435930ee2a2e3b1078d42049a59649fd8d500938a80` produced `ChatGPT-Official-RealtimeProbe-v02-TrollStore-20260904.ipa`, SHA `c2cdd9e3e8bb59e2a6d69305cc61b744653d258e907124942b6784ce238374a4`. ZIP integrity passed; Bundle ID/version/build remain `com.openai.chat` / `1.2026.202` / `30140022279`; extracted diff versus the supplied official package is exactly three intentional files (replace loaded enhancer entry with Probe, preserve original enhancer as `.original.dylib`, add research marker). Binary string spot-check contains the required `probe.log_cleared`, `pathShape`, `http.observed.*`, and clear-control markers and no `Authorization`, `Cookie`, `prompt`, `reasoning`, `answer`, or `tool` logging strings. This is research Artifact/package proof only; v0.2 Human Runtime remains pending and b96 remains unallocated.

**Next exact action:** install exact Probe v0.2 research IPA, relaunch official ChatGPT, confirm both `Probe` and `清空`, press `清空` immediately before reproducing the known cross-platform late-join flow, then export the resulting JSONL. Analyze the earliest target-correlated HTTP/SSE/WebSocket acquisition event before any ChatGPTClient product change or b96 allocation.'''
          if text.count(old) != 1:
              raise SystemExit('checkpoint next action mismatch')
          checkpoint.write_text(text.replace(old, new, 1))

          state = Path('docs/project/PROJECT_STATE.md')
          text = state.read_text()
          old = '- Next gate: build/package v0.2 against the exact supplied official package and collect one clean late-join JSONL starting from `probe.log_cleared`.'
          new = '- Probe v0.2 source `567e5faa52f0...` is research-CI/package Positive: run/job `33789454087 / 100762208087`, Artifact `9906723606`, dylib SHA `c409ba1e6038f398efd5de0635dba0aab97fec9c81e59ade774e16c0d442cc28`, research IPA SHA `c2cdd9e3e8bb59e2a6d69305cc61b744653d258e907124942b6784ce238374a4`; exact official-package diff remains three intentional research files. Human Runtime of v0.2 is pending.\n- Next gate: install v0.2, press `清空` immediately before the known late-join flow, and collect one clean JSONL starting from `probe.log_cleared`; b96 remains unallocated.'
          if text.count(old) != 1:
              raise SystemExit('project state next gate mismatch')
          state.write_text(text.replace(old, new, 1))

          evidence = Path('docs/project/runtime-evidence/DEV-send-stream-official-ios-probe-v01-runtime-v02-plan-20260904.md')
          text = evidence.read_text()
          marker = '## Probe v0.2 build / package identity'
          if marker in text:
              raise SystemExit('build identity already present')
          block = '''## Probe v0.2 build / package identity

- Exact research source commit: `567e5faa52f0254a14760fe1ea88dc56c8021ee4`
- Build-trigger/package-source head: `9e57aafb16a84598808c33db0d8c44d3edc82aa1`
- Dedicated research CI: `33789454087 / 100762208087` — success
- Canonical Artifact: `9906723606`
- Artifact digest / downloaded ZIP SHA-256: `8fd10169843d76292203e534081536296a108af6f19dab2b106c9bbb9c9c71f6`
- Exact Probe dylib: 153,264 bytes; SHA-256 `c409ba1e6038f398efd5de0635dba0aab97fec9c81e59ade774e16c0d442cc28`; sidecar matched exactly
- Official source ZIP SHA-256: `bb11734434bee912355b1435930ee2a2e3b1078d42049a59649fd8d500938a80`
- Research IPA: `ChatGPT-Official-RealtimeProbe-v02-TrollStore-20260904.ipa`
- Research IPA SHA-256: `c2cdd9e3e8bb59e2a6d69305cc61b744653d258e907124942b6784ce238374a4`
- ZIP structural integrity: passed
- Bundle ID/version/build preserved: `com.openai.chat` / `1.2026.202` / `30140022279`
- Extracted package diff versus supplied official package: exactly three intended files — loaded enhancer entry replaced by Probe, original enhancer preserved at `.original.dylib`, research marker added
- Binary string spot-check contains `probe.log_cleared`, `pathShape`, `http.observed.request`, `http.observed.response`, `http.observed.complete`, and `ChatGPTRealtimeProbe.Clear`; no `Authorization`, `Cookie`, `prompt`, `reasoning`, `answer`, or `tool` logging strings were found.

Classification: Probe v0.2 Code written / deterministic scope audit passed / dedicated research CI passed / research Artifact produced / independent package identity verified. Probe v0.2 Human Runtime: Pending. ChatGPTClient b96: not allocated. Stable/Frozen Send: No.

'''
          evidence.write_text(text.replace('## Next decisive Runtime\n', block + '## Next decisive Runtime\n', 1))

          workflow = Path('.github/workflows/research-official-ios-realtime-probe.yml')
          text = workflow.read_text()
          anchor = '# Probe v0.2 source anchor: 567e5faa52f0254a14760fe1ea88dc56c8021ee4\n'
          if text.count(anchor) != 1:
              raise SystemExit('research workflow anchor mismatch')
          workflow.write_text(text.replace(anchor, '', 1))
          PY
          git diff --check

      - name: Remove temporary apply tooling
        run: |
          git rm .github/official-ios-probe-v02.patch
          git rm .github/official-ios-probe-v02-fixup.patch
          git rm .github/official-ios-probe-v02-docs.patch
          git rm .github/probe_v02_apply.py
          git rm .github/workflows/official-ios-probe-v02-apply.yml
          git rm .github/workflows/official-ios-probe-v02-finalize.yml

      - name: Audit final scope
        run: |
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/official-ios-probe-v02-docs.patch \
            .github/official-ios-probe-v02-fixup.patch \
            .github/official-ios-probe-v02.patch \
            .github/probe_v02_apply.py \
            .github/workflows/official-ios-probe-v02-apply.yml \
            .github/workflows/official-ios-probe-v02-finalize.yml \
            .github/workflows/research-official-ios-realtime-probe.yml \
            docs/project/PROJECT_STATE.md \
            docs/project/current/dev/DEV-send-stream.md \
            docs/project/runtime-evidence/DEV-send-stream-official-ios-probe-v01-runtime-v02-plan-20260904.md | sort)"
          test "$changed" = "$expected"
          test -z "$(git diff --name-only | grep -E '^(ChatGPTClient/|ChatGPTClient\.xcodeproj/|\.github/workflows/ios-foundation\.yml$)' || true)"

      - name: Commit final research evidence and cleanup
        run: |
          git config user.name "white-shark-ssw"
          git config user.email "houstools@gmail.com"
          git add -A
          git commit -m "research: finalize Probe v0.2 package evidence [skip ci]"
          git push origin HEAD:dev/send-stream-20260829
