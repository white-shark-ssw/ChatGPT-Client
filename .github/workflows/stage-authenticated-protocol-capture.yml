name: Stage Authenticated Protocol Capture Path Privacy Hardening

on:
  push:
    branches:
      - dev/authenticated-protocol-capture-20261009
    paths:
      - ".github/workflows/stage-authenticated-protocol-capture.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated capture branch
        uses: actions/checkout@v4
        with:
          ref: dev/authenticated-protocol-capture-20261009
          fetch-depth: 0

      - name: Guard parent and inherited Candidate identity
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 79107c64347e05e0dfd4f679a3c970dfa09a18b0 HEAD
          test "$(grep -c 'CURRENT_PROJECT_VERSION = 115;' ChatGPTClient.xcodeproj/project.pbxproj)" = "2"
          test "$(grep -c 'DIAGNOSTICS_CANDIDATE = \"DEV-send-stream-0.1.0-b115\";' ChatGPTClient.xcodeproj/project.pbxproj)" = "2"
          ! grep -q 'CURRENT_PROJECT_VERSION = 116;' ChatGPTClient.xcodeproj/project.pbxproj
          grep -Fq "if (/^[A-Za-z0-9_.:{}+-]{1,36}$/.test(s)) return s;" ChatGPTClient/Protocol/ProtocolReadProbe.swift
          grep -Fq "pathTemplate = '/backend-api/conversations/{conversation_id}';" ChatGPTClient/Protocol/ProtocolReadProbe.swift

      - name: Apply generic backend path privacy hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('ChatGPTClient/Protocol/ProtocolReadProbe.swift')
          text = path.read_text()
          old = "      const safePathSegment = value => {\n        const s = String(value || '');\n        if (/^[A-Za-z0-9_.:{}+-]{1,36}$/.test(s)) return s;\n        return '{opaque}';\n      };"
          new = "      const safePathSegment = value => {\n        const s = String(value || '');\n        if (!s) return '';\n        if (/^[A-Za-z][A-Za-z_-]{0,39}$/.test(s)) return s;\n        return '{opaque}';\n      };"
          if text.count(old) != 1:
              raise SystemExit(f'expected one generic safePathSegment block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Validate privacy hardening exact scope
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/protocol_capture/sanitize_capture.py --self-test
          git diff --check
          test "$(git diff --name-only)" = "ChatGPTClient/Protocol/ProtocolReadProbe.swift"
          grep -Fq "if (!s) return '';" ChatGPTClient/Protocol/ProtocolReadProbe.swift
          grep -Fq "if (/^[A-Za-z][A-Za-z_-]{0,39}$/.test(s)) return s;" ChatGPTClient/Protocol/ProtocolReadProbe.swift
          ! grep -Fq "if (/^[A-Za-z0-9_.:{}+-]{1,36}$/.test(s)) return s;" ChatGPTClient/Protocol/ProtocolReadProbe.swift
          grep -Fq "pathTemplate = '/backend-api/conversations/{conversation_id}';" ChatGPTClient/Protocol/ProtocolReadProbe.swift
          grep -Fq "pathParameters = { conversation_id: idRef(decodeURIComponent(pluralDetail[1])) };" ChatGPTClient/Protocol/ProtocolReadProbe.swift
          test "$(grep -c 'CURRENT_PROJECT_VERSION = 115;' ChatGPTClient.xcodeproj/project.pbxproj)" = "2"
          test "$(grep -c 'DIAGNOSTICS_CANDIDATE = \"DEV-send-stream-0.1.0-b115\";' ChatGPTClient.xcodeproj/project.pbxproj)" = "2"
          git diff --quiet -- ChatGPTClient/Conversation/ConversationFeature.swift ChatGPTClient/RootViewController.swift ChatGPTClient/Authentication ChatGPTClient.xcodeproj/project.pbxproj ChatGPTClient/Testing/SimulatorFixtureTransport.swift

      - name: Commit path privacy hardening only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ChatGPTClient/Protocol/ProtocolReadProbe.swift
          git commit -m "dev: harden captured backend path privacy"
          git push origin HEAD:dev/authenticated-protocol-capture-20261009
