name: Apply Probe v0.7 dispatch-data observer

on:
  push:
    branches: [dev/send-stream-20260829]
    paths: [.github/workflows/probe-v07-apply.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/send-stream-20260829
          fetch-depth: 2
      - name: Guard baseline
        run: |
          test "$(git rev-parse HEAD^)" = "af7b45f3bd62428afa49cd98ead99c7409bf3105"
          test "$(git hash-object scripts/research/official_ios_realtime_probe/ChatGPTRealtimeProbe.m)" = "9519309b52b1dde89391570542ca8f0fa65ed799"
      - name: Apply v0.7 research delta and runtime docs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/research/official_ios_realtime_probe/ChatGPTRealtimeProbe.m')
          s=p.read_text()
          s=s.replace('#import <Foundation/Foundation.h>\n', '#import <Foundation/Foundation.h>\n#import <dispatch/dispatch.h>\n', 1)
          s=s.replace('static NSString * const RPTProbeVersion = @"0.6";', 'static NSString * const RPTProbeVersion = @"0.7";', 1)
          anchor='static BOOL RPTCallbackSelectorRelevant(NSString *selectorName) {'
          insert=r'''static void RPTObserveConversationDetailDispatchData(NSURLSessionDataTask *task, id value) {
    if (!task || !value || objc_getAssociatedObject(task, &RPTDetailAsyncStatusLoggedKey)) return;
    NSString *className = NSStringFromClass(object_getClass(value)) ?: @"";
    if (![className.lowercaseString containsString:@"dispatch_data"]) return;
    dispatch_data_t dispatchData = (__bridge dispatch_data_t)value;
    dispatch_data_apply(dispatchData, ^bool(__unused dispatch_data_t region, __unused size_t offset, const void *buffer, size_t size) {
        if (!buffer || size == 0) return true;
        NSData *chunk = [NSData dataWithBytesNoCopy:(void *)buffer length:size freeWhenDone:NO];
        RPTObserveConversationDetailData(task, chunk);
        return objc_getAssociatedObject(task, &RPTDetailAsyncStatusLoggedKey) == nil;
    });
}

static void RPTTaskDidReceiveDispatchData(id self, SEL _cmd, id dispatchData, id completionHandler) {
    RPTObserveConversationDetailDispatchData((NSURLSessionDataTask *)self, dispatchData);
    IMP original = RPTOriginalIMP(self, _cmd);
    if (!original) return;
    void (*function)(id, SEL, id, id) = (void *)original;
    function(self, _cmd, dispatchData, completionHandler);
}

'''
          if anchor not in s: raise SystemExit('callback anchor missing')
          s=s.replace(anchor, insert+anchor, 1)
          old='    SEL completeSelector = NSSelectorFromString(@"URLSession:task:didCompleteWithError:");\n'
          new=old+'    SEL dispatchDataSelector = NSSelectorFromString(@"_task_onqueue_didReceiveDispatchData:completionHandler:");\n'
          if old not in s: raise SystemExit('selector anchor missing')
          s=s.replace(old,new,1)
          old2='        if (RPTIsSubclassOfClass(cls, taskClass) && RPTClassOwnsSelector(cls, @selector(resume))) RPTInstallHookOnClass(cls, @selector(resume), (IMP)RPTTaskResume);\n'
          new2=old2+'        if (RPTIsSubclassOfClass(cls, taskClass) && RPTClassOwnsSelector(cls, dispatchDataSelector)) RPTInstallHookOnClass(cls, dispatchDataSelector, (IMP)RPTTaskDidReceiveDispatchData);\n'
          if old2 not in s: raise SystemExit('hook anchor missing')
          s=s.replace(old2,new2,1)
          p.write_text(s)

          r=Path('scripts/research/official_ios_realtime_probe/README.md')
          t=r.read_text()
          t=t.replace('Current research revision: **Probe v0.6**.', 'Current research revision: **Probe v0.7**.', 1)
          t=t.replace('The decisive v0.6 question', 'The decisive v0.7 question', 1)
          if 'v0.7 hooks only the Runtime-evidenced private selector' not in t:
              t=t.replace('Research-only observer for the user-supplied TrollStore ChatGPT package. It is not linked into ChatGPTClient and is not a product Candidate.\n', 'Research-only observer for the user-supplied TrollStore ChatGPT package. It is not linked into ChatGPTClient and is not a product Candidate.\n\nv0.7 hooks only the Runtime-evidenced private selector `_task_onqueue_didReceiveDispatchData:completionHandler:` on NSURLSession task subclasses. It scans dispatch-data bytes only for authoritative Conversation Detail and emits only the safe `conversation_async_status` enum through the existing observer. It does not initiate requests, polling, timers, retries, resume calls, or content logging.\n', 1)
          r.write_text(t)

          evidence=Path('docs/project/runtime-evidence/DEV-send-stream-official-ios-probe-v06-runtime-v07-dispatch-data-20260904.md')
          evidence.write_text('''# DEV-send-stream — Probe v0.6 Runtime / v0.7 dispatch-data observer — 2026-09-04\n\n- Exact user JSONL `sha256:1cb6eb096c5748e7f781afbd761906bda39d55227a115a4e2dcea8c240de7a43`: 78,828 bytes / 207 valid events / zero parse errors / all `probeVersion=0.6`.\n- The file begins with `probe.log_cleared` at `06:00:45.972Z` and contains a later full process relaunch (`probe.loaded` `06:03:58.184Z`, hooks installed `06:03:58.849Z`). This is a valid two-process v0.6 sample, not mixed probe versions.\n- The decisive `probe.detail_task_callback_surface` fired once at `06:03:59.488Z` for `__NSCFLocalDataTask`. Runtime-evidenced private response surface includes `__NSCFLocalSessionTask connection:didReceiveData:completion:`, `_task_onqueue_didReceiveDispatchData:completionHandler:`, `_onqueue_didReceiveDispatchData:completion:`, and `_onqueue_didFinishWithError:`. Runtime-evidenced ivars include `_dataTaskData` (`OS_dispatch_data`), `_dataTaskCompletion` (block), and `_pendingResponseBytes` (`OS_dispatch_data`).\n- This proves the callback/data-buffer surface exists on the exact current iOS task class. The v0.6 method-table snapshot alone does **not** prove which private selector was invoked for each byte or the exact call order. Historical CFNetwork stacks independently place `_task_onqueue_didReceiveDispatchData:completionHandler:` between `connection:didReceiveData:completion:` and URLSession delegate delivery; current-device invocation still requires Runtime confirmation.\n- Target conversation hash `0df178903e95` continues authoritative Detail GET polling. After the relaunch it issued GETs at `06:04:06.114`, `06:04:18.145`, `06:04:28.179`, `06:04:39.841`, and `06:04:50.792Z`, intervals `12.031 / 10.034 / 11.662 / 10.951s`. Native Detail polling is Runtime Positive again.\n- There are zero `http.conversation_detail.async_status` events in v0.6, expected because v0.6 only enumerated the private callback surface and retained the already-negative public delegate scanner. Exact active/terminal enum semantics remain Unverified.\n- Probe v0.7 is research-only and hooks exactly one Runtime-evidenced selector: `_task_onqueue_didReceiveDispatchData:completionHandler:`. It inspects only dispatch-data chunks belonging to authoritative Conversation Detail tasks and passes them through the existing exact-field scanner. It does not log body bytes, auth, prompts, answers, reasoning or tool text; it does not initiate or alter network requests/poll cadence.\n- Product remains exact b95; b96 remains unallocated; Stable/Frozen Send No.\n\nEvidence ladder: **v0.6 callback surface Runtime Positive / exact private callback invocation Unverified / Native Detail polling Runtime Positive again / v0.7 research code written / CI pending / Artifact pending / Human Runtime pending / product unchanged.**\n\nNext exact action: build/package exact Probe v0.7, then Human Runtime one clean long cross-platform response. Decisive result is same-target `http.conversation_detail.async_status` from the dispatch-data path, ideally active `is_streaming` followed by terminal `complete` or another actually observed safe enum.\n''')

          cp=Path('docs/project/current/dev/DEV-send-stream.md')
          c=cp.read_text()
          section='''## Official iOS Probe v0.6 Runtime / v0.7 dispatch-data gate — 2026-09-04\n\nExact v0.6 JSONL `sha256:1cb6eb096c5748e7f781afbd761906bda39d55227a115a4e2dcea8c240de7a43` is valid Human Runtime: 78,828 bytes / 207 events / zero parse errors / all v0.6. The file spans `probe.log_cleared` and one later full process relaunch but contains no mixed Probe revision.\n\nThe decisive `probe.detail_task_callback_surface` fired for `__NSCFLocalDataTask`. Runtime-evidenced response/data surface includes `connection:didReceiveData:completion:`, `_task_onqueue_didReceiveDispatchData:completionHandler:`, `_onqueue_didReceiveDispatchData:completion:`, `_onqueue_didFinishWithError:`, plus `_dataTaskData` / `_pendingResponseBytes` as `OS_dispatch_data` and `_dataTaskCompletion` as a block. This proves the private callback/buffer surface exists on the exact current task class; the method-table snapshot alone does not prove invocation order.\n\nTarget `0df178903e95` again performs authoritative Conversation Detail GET polling; after relaunch intervals are `12.031 / 10.034 / 11.662 / 10.951s`. Native Detail polling remains Runtime Positive. `http.conversation_detail.async_status` remains absent because v0.6 did not yet hook the newly evidenced dispatch-data path; async-status semantics remain Unverified.\n\nProbe v0.7 changes research tooling only. It hooks exactly `_task_onqueue_didReceiveDispatchData:completionHandler:` on NSURLSession task subclasses, gates scanning to authoritative Conversation Detail, feeds dispatch-data regions into the existing exact `conversation_async_status` scanner, and passes the original callback arguments through unchanged. It initiates no request/poll/timer/retry/resume and logs no response content/auth. Product remains b95; b96 remains unallocated.\n\nEvidence ladder: **v0.6 Human Runtime analyzed / callback surface Runtime Positive / exact private callback invocation still Unverified / Native Detail polling Runtime Positive again / v0.7 research code written / dedicated CI pending / product b95 unchanged / b96 unallocated / Stable-Frozen Send No.**\n\n**Next exact action:** dedicated research CI/package exact v0.7, then Human Runtime. Decisive evidence is same-target `http.conversation_detail.async_status` from the dispatch-data observer, ideally `is_streaming -> complete` or another actually observed safe enum. Do not allocate b96 before that result.\n\n'''
          if not c.startswith('# DEV-send-stream\n'): raise SystemExit('checkpoint header mismatch')
          cp.write_text('# DEV-send-stream\n\n'+section+c[len('# DEV-send-stream\n\n'):])

          ps=Path('docs/project/PROJECT_STATE.md')
          q=ps.read_text()
          sec='''## 2026-09-04 — Probe v0.6 exposes Swift-async dispatch-data callback surface / v0.7 gate\n\n- Exact v0.6 Runtime `sha256:1cb6eb096c5748e7f781afbd761906bda39d55227a115a4e2dcea8c240de7a43`: 78,828 bytes / 207 events / zero parse errors / all v0.6.\n- `probe.detail_task_callback_surface` Runtime-proves `__NSCFLocalSessionTask` exposes `connection:didReceiveData:completion:`, `_task_onqueue_didReceiveDispatchData:completionHandler:`, `_onqueue_didReceiveDispatchData:completion:`, plus `OS_dispatch_data` buffering ivars `_dataTaskData` / `_pendingResponseBytes` and completion block `_dataTaskCompletion`. Exact invocation order remains Unverified until the next observer.\n- Same target Conversation Detail polling remains Runtime Positive after relaunch at ~10–12s intervals. Probe v0.7 is research-only and hooks only `_task_onqueue_didReceiveDispatchData:completionHandler:` to run the existing exact `conversation_async_status` scanner; no product network behavior changes. Product remains b95; b96 unallocated.\n\n'''
          if not q.startswith('# Project State\n'): raise SystemExit('state header mismatch')
          ps.write_text('# Project State\n\n'+sec+q[len('# Project State\n\n'):])
          PY
      - name: Scope and static checks
        run: |
          git diff --check
          test "$(grep -c 'RPTProbeVersion = @\"0.7\"' scripts/research/official_ios_realtime_probe/ChatGPTRealtimeProbe.m)" = "1"
          grep -F '_task_onqueue_didReceiveDispatchData:completionHandler:' scripts/research/official_ios_realtime_probe/ChatGPTRealtimeProbe.m
          if git diff --name-only | grep -E '^(ChatGPTClient/|ChatGPTClient.xcodeproj/)'; then exit 1; fi
      - name: Commit research delta and self-remove helper
        run: |
          git rm .github/workflows/probe-v07-apply.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/research/official_ios_realtime_probe/ChatGPTRealtimeProbe.m scripts/research/official_ios_realtime_probe/README.md docs/project/PROJECT_STATE.md docs/project/current/dev/DEV-send-stream.md docs/project/runtime-evidence/DEV-send-stream-official-ios-probe-v06-runtime-v07-dispatch-data-20260904.md
          git commit -m 'research: observe Detail dispatch-data path v0.7'
          git push origin HEAD:dev/send-stream-20260829
