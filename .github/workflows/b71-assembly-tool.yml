                      content.leadingAnchor.constraint(equalTo: rail.trailingAnchor, constant: 10), content.trailingAnchor.constraint(equalTo: trailingAnchor), content.topAnchor.constraint(equalTo: topAnchor), content.bottomAnchor.constraint(equalTo: bottomAnchor),
                      iconView.topAnchor.constraint(equalTo: rail.topAnchor, constant: 1), iconView.centerXAnchor.constraint(equalTo: rail.centerXAnchor), iconView.widthAnchor.constraint(equalToConstant: 18), iconView.heightAnchor.constraint(equalToConstant: 18),
                      completion.centerXAnchor.constraint(equalTo: rail.centerXAnchor), completion.bottomAnchor.constraint(equalTo: rail.bottomAnchor, constant: -1), completion.widthAnchor.constraint(equalToConstant: 16), completion.heightAnchor.constraint(equalToConstant: 16),
                      line.centerXAnchor.constraint(equalTo: rail.centerXAnchor), line.widthAnchor.constraint(equalToConstant: 1), line.topAnchor.constraint(equalTo: iconView.bottomAnchor, constant: 6), line.bottomAnchor.constraint(equalTo: completion.topAnchor, constant: -6)
                  ])
              }

              required init?(coder: NSCoder) { fatalError("init(coder:) has not been implemented") }
          }

          private final class ConversationReasoningDetailViewController: UIViewController {
              private let timeline: [ConversationResponseTimelineItem]
              private let durationSeconds: Int?
              private let scrollView = UIScrollView()
              private let contentStack = UIStackView()

              init(timeline: [ConversationResponseTimelineItem], durationSeconds: Int?) {
                  self.timeline = timeline
                  self.durationSeconds = durationSeconds
                  super.init(nibName: nil, bundle: nil)
              }

              required init?(coder: NSCoder) { fatalError("init(coder:) has not been implemented") }

              override func viewDidLoad() {
                  super.viewDidLoad()
                  view.backgroundColor = .systemBackground
                  scrollView.alwaysBounceVertical = true
                  scrollView.translatesAutoresizingMaskIntoConstraints = false
                  contentStack.axis = .vertical
                  contentStack.spacing = 18
                  contentStack.translatesAutoresizingMaskIntoConstraints = false
                  view.addSubview(scrollView)
                  scrollView.addSubview(contentStack)
                  NSLayoutConstraint.activate([
                      scrollView.leadingAnchor.constraint(equalTo: view.leadingAnchor), scrollView.trailingAnchor.constraint(equalTo: view.trailingAnchor), scrollView.topAnchor.constraint(equalTo: view.topAnchor), scrollView.bottomAnchor.constraint(equalTo: view.bottomAnchor),
                      contentStack.leadingAnchor.constraint(equalTo: scrollView.contentLayoutGuide.leadingAnchor, constant: 24), contentStack.trailingAnchor.constraint(equalTo: scrollView.contentLayoutGuide.trailingAnchor, constant: -24), contentStack.topAnchor.constraint(equalTo: scrollView.contentLayoutGuide.topAnchor, constant: 24), contentStack.bottomAnchor.constraint(equalTo: scrollView.contentLayoutGuide.bottomAnchor, constant: -32), contentStack.widthAnchor.constraint(equalTo: scrollView.frameLayoutGuide.widthAnchor, constant: -48)
                  ])
                  let title = UILabel()
                  title.font = .systemFont(ofSize: 22, weight: .semibold)
                  title.textColor = .label
                  title.text = "正在思考"
                  contentStack.addArrangedSubview(title)
                  for item in timeline {
                      switch item.kind {
                      case .reasoning:
                          let normalized = item.text.trimmingCharacters(in: .whitespacesAndNewlines)
                          guard !normalized.isEmpty else { continue }
                          let label = UILabel()
                          label.font = .systemFont(ofSize: 16, weight: .regular)
                          label.textColor = .secondaryLabel
                          label.numberOfLines = 0
                          let paragraph = NSMutableParagraphStyle(); paragraph.lineSpacing = 4
                          label.attributedText = NSAttributedString(string: normalized, attributes: [.font: label.font as Any, .foregroundColor: UIColor.secondaryLabel, .paragraphStyle: paragraph])
                          contentStack.addArrangedSubview(label)
                      case .tool:
                          guard ConversationReasoningPresentation.visibleToolItems([item]).isEmpty == false else { continue }
                          contentStack.addArrangedSubview(ConversationReasoningToolView(item: item))
                      }
                  }
                  let status = UIStackView()
                  status.axis = .vertical
                  status.spacing = 20
                  status.layoutMargins = UIEdgeInsets(top: 0, left: 30, bottom: 0, right: 0)
                  status.isLayoutMarginsRelativeArrangement = true
                  let duration = UILabel()
                  duration.font = .systemFont(ofSize: 16, weight: .regular)
                  duration.textColor = .secondaryLabel
                  duration.text = durationSeconds.map { "思考了 \($0)s" } ?? "思考过程"
                  let done = UILabel()
                  done.font = .systemFont(ofSize: 16, weight: .regular)
                  done.textColor = .secondaryLabel
                  done.text = "完成"
                  status.addArrangedSubview(duration); status.addArrangedSubview(done)
                  contentStack.addArrangedSubview(status)
              }
          }

          '''
          text = text.replace(helper_anchor, presentation_types + helper_anchor, 1)

          configure_start = '    func configure(with message: ConversationMessage, text: String, showTimestamp: Bool, showCopy: Bool, isFirstChunk: Bool, isLastChunk: Bool, isChunked: Bool, responseTimeline: [ConversationResponseTimelineItem], reasoningExpanded: Bool, toolDisclosureState: ConversationToolDisclosureState, showsReasoningDivider: Bool, metrics: Metrics, onCopy: (() -> Void)?, onToggleReasoning: (() -> Void)?, onToggleToolDetail: ((Int, ConversationToolDetailSection) -> Void)?) {'
          configure_end = '    static func metrics(for text: String, role: ConversationMessage.Role, tableWidth: CGFloat, showsTimestamp: Bool, showsCopy: Bool, isFirstChunk: Bool, isLastChunk: Bool, isChunked: Bool, responseTimeline: [ConversationResponseTimelineItem], reasoningExpanded: Bool, toolDisclosureState: ConversationToolDisclosureState, showsReasoningDivider: Bool) -> Metrics {'
          configure_body = '''    func configure(with message: ConversationMessage, text: String, showTimestamp: Bool, showCopy: Bool, isFirstChunk: Bool, isLastChunk: Bool, isChunked: Bool, responseTimeline: [ConversationResponseTimelineItem], reasoningExpanded: Bool, toolDisclosureState: ConversationToolDisclosureState, showsReasoningDivider: Bool, metrics: Metrics, onCopy: (() -> Void)?, onToggleReasoning: (() -> Void)?, onToggleToolDetail: ((Int, ConversationToolDetailSection) -> Void)?) {
              self.onCopy = onCopy
              self.onToggleReasoning = onToggleReasoning
              self.onToggleToolDetail = onToggleToolDetail
              layoutMetrics = metrics
              messageLabel.text = text
              let showsReasoning = message.role == .assistant && isFirstChunk && !responseTimeline.isEmpty
              reasoningButton.isHidden = !showsReasoning
              reasoningButton.isUserInteractionEnabled = showsReasoning && onToggleReasoning != nil
              reasoningButton.setTitle(showsReasoning ? ConversationReasoningPresentation.summaryTitle(durationSeconds: message.reasoningDurationSeconds) : nil, for: .normal)
              reasoningButton.setImage(nil, for: .normal)
              let compact = showsReasoning ? ConversationReasoningPresentation.compactAttributedText(responseTimeline) : NSAttributedString()
              reasoningTextView.attributedText = compact.length > 0 ? compact : nil
              reasoningTextView.isHidden = compact.length == 0
              reasoningTextView.isScrollEnabled = false
              reasoningTextView.isUserInteractionEnabled = compact.length > 0 && onToggleReasoning != nil
              reasoningDividerView.isHidden = !(showsReasoning && showsReasoningDivider && !metrics.reasoningDividerFrame.isEmpty)
              timestampLabel.text = showTimestamp ? Self.timestampText(for: message.createTime) : nil
              timestampLabel.isHidden = timestampLabel.text == nil
              copyButton.isHidden = !showCopy
              switch message.role {
              case .user:
                  bubbleView.backgroundColor = .secondarySystemBackground
                  bubbleView.layer.cornerRadius = 18
                  if isFirstChunk && isLastChunk { bubbleView.layer.maskedCorners = [.layerMinXMinYCorner, .layerMaxXMinYCorner, .layerMinXMaxYCorner, .layerMaxXMaxYCorner] }
                  else if isFirstChunk { bubbleView.layer.maskedCorners = [.layerMinXMinYCorner, .layerMaxXMinYCorner] }
                  else if isLastChunk { bubbleView.layer.maskedCorners = [.layerMinXMaxYCorner, .layerMaxXMaxYCorner] }
                  else { bubbleView.layer.maskedCorners = [] }
                  timestampLabel.textAlignment = .right
              case .assistant:
                  bubbleView.backgroundColor = .clear
                  bubbleView.layer.cornerRadius = 0
                  bubbleView.layer.maskedCorners = []
                  timestampLabel.textAlignment = .left
              }
              setNeedsLayout()
          }

          '''
          text = replace_between(text, configure_start, configure_end, configure_body, "cell configure")

          metrics_start = configure_end
          metrics_end = '    private static func responseTimelineAttributedText(_ timeline: [ConversationResponseTimelineItem], disclosureState: ConversationToolDisclosureState) -> NSAttributedString {'
          metrics_body = '''    static func metrics(for text: String, role: ConversationMessage.Role, tableWidth: CGFloat, showsTimestamp: Bool, showsCopy: Bool, isFirstChunk: Bool, isLastChunk: Bool, isChunked: Bool, responseTimeline: [ConversationResponseTimelineItem], reasoningExpanded: Bool, toolDisclosureState: ConversationToolDisclosureState, showsReasoningDivider: Bool) -> Metrics {
              let width = max(1, tableWidth)
              var y = isFirstChunk ? outerVerticalPadding : 0
              var timestampFrame = CGRect.zero
              if showsTimestamp {
                  let timestampHeight = ceil(timestampFont.lineHeight)
                  timestampFrame = CGRect(x: horizontalMargin, y: y, width: max(1, width - horizontalMargin * 2), height: timestampHeight)
                  y += timestampHeight + timestampGap
              }
              let maxBubbleWidth: CGFloat
              let maxTextWidth: CGFloat
              let contentInset: CGFloat
              switch role {
              case .user:
                  maxBubbleWidth = max(36, min(width * userMaxWidthRatio, width - horizontalMargin * 2 - userLeadingGap))
                  contentInset = bubbleHorizontalPadding
                  maxTextWidth = max(1, maxBubbleWidth - contentInset * 2)
              case .assistant:
                  maxBubbleWidth = max(1, width - horizontalMargin * 2)
                  contentInset = 0
                  maxTextWidth = maxBubbleWidth
              }
              let textSize = measuredTextSize(text, maxWidth: maxTextWidth)
              let bubbleWidth: CGFloat
              switch role {
              case .user: bubbleWidth = isChunked ? maxBubbleWidth : min(maxBubbleWidth, max(36, ceil(textSize.width) + contentInset * 2))
              case .assistant: bubbleWidth = maxBubbleWidth
              }
              let bubbleX = role == .user ? width - horizontalMargin - bubbleWidth : horizontalMargin
              var bubbleY: CGFloat = isFirstChunk ? bubbleVerticalPadding : 0
              var reasoningButtonFrame = CGRect.zero
              var reasoningBodyFrame = CGRect.zero
              var reasoningDividerFrame = CGRect.zero
              if role == .assistant, isFirstChunk, !responseTimeline.isEmpty {
                  reasoningButtonFrame = CGRect(x: contentInset, y: bubbleY, width: maxTextWidth, height: 24)
                  bubbleY = reasoningButtonFrame.maxY
                  let compactSize = ConversationReasoningPresentation.measuredCompactSize(responseTimeline, maxWidth: maxTextWidth)
                  if compactSize.height > 0 {
                      bubbleY += 6
                      reasoningBodyFrame = CGRect(x: contentInset, y: bubbleY, width: maxTextWidth, height: compactSize.height)
                      bubbleY = reasoningBodyFrame.maxY
                  }
                  if showsReasoningDivider {
                      bubbleY += 12
                      reasoningDividerFrame = CGRect(x: contentInset, y: bubbleY, width: maxTextWidth, height: 1 / UIScreen.main.scale)
                      bubbleY = reasoningDividerFrame.maxY + 12
                  } else {
                      bubbleY += 8
                  }
              }
              let messageFrame = CGRect(x: contentInset, y: bubbleY, width: maxTextWidth, height: textSize.height)
              let bubbleHeight = messageFrame.maxY + (isLastChunk ? bubbleVerticalPadding : 0)
              let bubbleFrame = CGRect(x: bubbleX, y: y, width: bubbleWidth, height: bubbleHeight)
              y = bubbleFrame.maxY
              var copyFrame = CGRect.zero
              if showsCopy {
                  y += copyGap
                  copyFrame = CGRect(x: role == .user ? bubbleFrame.maxX - copySize : bubbleFrame.minX, y: y, width: copySize, height: copySize)
                  y = copyFrame.maxY
              }
              if isLastChunk { y += outerVerticalPadding }
              return Metrics(rowHeight: max(1, ceil(y)), timestampFrame: timestampFrame, bubbleFrame: bubbleFrame, reasoningButtonFrame: reasoningButtonFrame, reasoningBodyFrame: reasoningBodyFrame, reasoningDividerFrame: reasoningDividerFrame, messageFrame: messageFrame, copyFrame: copyFrame)
          }

          '''
          text = replace_between(text, metrics_start, metrics_end, metrics_body, "cell metrics")

          text = replace_once(text,
          '''        reasoningButton.titleLabel?.font = .preferredFont(forTextStyle: .subheadline)
                  reasoningButton.contentHorizontalAlignment = .left
          ''',
          '''        reasoningButton.titleLabel?.font = ConversationReasoningPresentation.summaryFont
                  reasoningButton.contentHorizontalAlignment = .left
                  reasoningButton.contentEdgeInsets = .zero
          ''', "summary button typography")

          text = replace_once(text,
          '''        reasoningTextView.delegate = self
                  reasoningTextView.isEditable = false
                  reasoningTextView.isSelectable = true
                  reasoningTextView.isScrollEnabled = false
          ''',
          '''        reasoningTextView.delegate = self
                  reasoningTextView.isEditable = false
                  reasoningTextView.isSelectable = false
                  reasoningTextView.isScrollEnabled = false
          ''', "compact reasoning text interaction")

          text = replace_once(text,
          '''        reasoningTextView.linkTextAttributes = [.foregroundColor: UIColor.label]
                  bubbleView.addSubview(reasoningTextView)
          ''',
          '''        reasoningTextView.linkTextAttributes = [.foregroundColor: UIColor.label]
                  reasoningTextView.addGestureRecognizer(UITapGestureRecognizer(target: self, action: #selector(reasoningTapped)))
                  bubbleView.addSubview(reasoningTextView)
          ''', "compact reasoning tap")

          path.write_text(text)

          root = Path("ChatGPTClient/RootViewController.swift")
          r = root.read_text()
          r = replace_once(r, '    case reasoningEnded\n', '    case reasoningEnded(Int?)\n', "reasoning event duration")
          r = replace_once(r,
          '''        case "reasoning_ended": activeEvents?(.reasoningEnded)
          ''',
          '''        case "reasoning_ended": activeEvents?(.reasoningEnded((body["durationSec"] as? NSNumber)?.intValue))
          ''', "reasoning handler duration")
          r = replace_once(r,
          '''        state.reasoningEnded = true;
                  post({ kind: 'reasoning_ended' });
          ''',
          '''        state.reasoningEnded = true;
                  const rawDuration = metadata.finished_duration_sec;
                  const durationSec = typeof rawDuration === 'number' && Number.isFinite(rawDuration) && rawDuration >= 0 ? Math.round(rawDuration) : null;
                  post({ kind: 'reasoning_ended', durationSec });
          ''', "bridge duration payload")
          r = replace_once(r,
          '''    var finalText: String
              var reasoningEnded: Bool
              var failureReason: String?
          ''',
          '''    var finalText: String
              var reasoningEnded: Bool
              var reasoningDurationSeconds: Int?
              var failureReason: String?
          ''', "snapshot duration field")
          r = replace_once(r,
          '''responseRuntime.snapshots[conversationID] = ConversationLiveResponseSnapshot(generation: generation, conversationID: conversationID, baselineVisibleMessageCount: baselineVisibleMessageCount, promptText: promptText, phase: .preparing, timeline: [], finalText: "", reasoningEnded: false, failureReason: nil)''',
          '''responseRuntime.snapshots[conversationID] = ConversationLiveResponseSnapshot(generation: generation, conversationID: conversationID, baselineVisibleMessageCount: baselineVisibleMessageCount, promptText: promptText, phase: .preparing, timeline: [], finalText: "", reasoningEnded: false, reasoningDurationSeconds: nil, failureReason: nil)''', "snapshot init duration")
          r = replace_once(r,
          '''    case .reasoningEnded:
                  snapshot.reasoningEnded = true
                  snapshot.phase = .final
                  eventName = "reasoning_ended"
          ''',
          '''    case .reasoningEnded(let durationSeconds):
                  snapshot.reasoningEnded = true
                  snapshot.reasoningDurationSeconds = durationSeconds
                  snapshot.phase = .final
                  eventName = "reasoning_ended"
          ''', "consume duration")
          root.write_text(r)

          pbx = Path("ChatGPTClient.xcodeproj/project.pbxproj")
          p = pbx.read_text()
          if p.count("CURRENT_PROJECT_VERSION = 70;") != 2: raise SystemExit("build number count mismatch")
          p = p.replace("CURRENT_PROJECT_VERSION = 70;", "CURRENT_PROJECT_VERSION = 71;")
          if p.count('DIAGNOSTICS_CANDIDATE = "DEV-send-stream-0.1.0-b70";') != 2: raise SystemExit("candidate count mismatch")
          p = p.replace('DIAGNOSTICS_CANDIDATE = "DEV-send-stream-0.1.0-b70";', 'DIAGNOSTICS_CANDIDATE = "DEV-send-stream-0.1.0-b71";')
          pbx.write_text(p)

          workflow = Path(".github/workflows/ios-foundation.yml")
          w = workflow.read_text()
          w = replace_once(w, "# Candidate: DEV-send-stream-0.1.0-b70", "# Candidate: DEV-send-stream-0.1.0-b71", "workflow candidate header")
          w = replace_once(w, "name: ChatGPTClient-DEV-send-stream-0.1.0-b70", "name: ChatGPTClient-DEV-send-stream-0.1.0-b71", "workflow artifact name")
          workflow.write_text(w)
          PY

      - name: Audit product scope and b71 invariants
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            .github/workflows/ios-foundation.yml
            ChatGPTClient.xcodeproj/project.pbxproj
            ChatGPTClient/Conversation/ConversationFeature.swift
            ChatGPTClient/RootViewController.swift
          )
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq "${#expected[@]}"
          diff -u <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${changed[@]}")
          grep -q 'CURRENT_PROJECT_VERSION = 71;' ChatGPTClient.xcodeproj/project.pbxproj
          grep -q 'DIAGNOSTICS_CANDIDATE = "DEV-send-stream-0.1.0-b71";' ChatGPTClient.xcodeproj/project.pbxproj
          grep -q 'reasoningDetail.presented' ChatGPTClient/Conversation/ConversationFeature.swift
          ! grep -q 'toolDetailMaximumBodyHeight' <(git diff --unified=0 ChatGPTClient/Conversation/ConversationFeature.swift | grep '^+' || true)
          ! git diff -- ChatGPTClient/RootViewController.swift | grep -E '^\+.*(setComposerText|submitPendingSendIfReady|/backend-api/f/conversation|send_observed|send_response)' | grep -v 'reasoning_ended'

      - name: Compile iOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project ChatGPTClient.xcodeproj -scheme ChatGPTClient -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

      - name: Emit clean product-only branch
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "refs/heads/${PRODUCT_BRANCH}" >/dev/null 2>&1; then
            echo "Product branch already exists; refusing to overwrite"
            exit 1
          fi
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/.github/workflows" "$tmp/ChatGPTClient.xcodeproj" "$tmp/ChatGPTClient/Conversation" "$tmp/ChatGPTClient"
          cp .github/workflows/ios-foundation.yml "$tmp/.github/workflows/ios-foundation.yml"
          cp ChatGPTClient.xcodeproj/project.pbxproj "$tmp/ChatGPTClient.xcodeproj/project.pbxproj"
          cp ChatGPTClient/Conversation/ConversationFeature.swift "$tmp/ChatGPTClient/Conversation/ConversationFeature.swift"
          cp ChatGPTClient/RootViewController.swift "$tmp/ChatGPTClient/RootViewController.swift"
          git reset --hard "$BASE_SHA"
          cp "$tmp/.github/workflows/ios-foundation.yml" .github/workflows/ios-foundation.yml
          cp "$tmp/ChatGPTClient.xcodeproj/project.pbxproj" ChatGPTClient.xcodeproj/project.pbxproj
          cp "$tmp/ChatGPTClient/Conversation/ConversationFeature.swift" ChatGPTClient/Conversation/ConversationFeature.swift
          cp "$tmp/ChatGPTClient/RootViewController.swift" ChatGPTClient/RootViewController.swift
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/ios-foundation.yml ChatGPTClient.xcodeproj/project.pbxproj ChatGPTClient/Conversation/ConversationFeature.swift ChatGPTClient/RootViewController.swift
          git diff --cached --check
          git commit -m 'feat: b71 official reasoning presentation'
          git push origin HEAD:"refs/heads/${PRODUCT_BRANCH}"
