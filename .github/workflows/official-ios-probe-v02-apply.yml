name: official iOS Probe v0.2 apply

# Triggered for exact v0.1 Runtime evidence c74a6670… on 2026-09-04.
on:
  push:
    branches:
      - dev/send-stream-20260829
    paths:
      - ".github/workflows/official-ios-probe-v02-apply.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/send-stream-20260829
          fetch-depth: 0

      - name: Guard exact research baseline
        run: |
          test "$(git rev-parse HEAD:scripts/research/official_ios_realtime_probe/ChatGPTRealtimeProbe.m)" = "77da135feedeb3bf70f8c8695d738131b346d315"
          test "$(git rev-parse HEAD:scripts/research/official_ios_realtime_probe/ProbeExportUI.m)" = "fe4a441c2fddcd00df831a806a46ef5f575c777f"
          test "$(git rev-parse HEAD:scripts/research/official_ios_realtime_probe/README.md)" = "af019d260482f44f756fe42f5e63443ceacdd079"
          test "$(git rev-parse HEAD:docs/project/current/dev/DEV-send-stream.md)" = "277baf03174e2de6270c1960bd8565e6eb340e01"
          test "$(git rev-parse HEAD:docs/project/PROJECT_STATE.md)" = "1d262615539762d2b594d4d87d434e5d9b004c87"
          test ! -e docs/project/runtime-evidence/DEV-send-stream-official-ios-probe-v01-runtime-v02-plan-20260904.md

      - name: Apply deterministic v0.2 research batch
        run: |
          python3 .github/probe_v02_apply.py
          git diff --check

      - name: Audit exact scope and invariants
        run: |
          grep -q 'RPTProbeVersion = @"0.2"' scripts/research/official_ios_realtime_probe/ChatGPTRealtimeProbe.m
          grep -q 'http.observed.request' scripts/research/official_ios_realtime_probe/ChatGPTRealtimeProbe.m
          grep -q 'http.observed.response' scripts/research/official_ios_realtime_probe/ChatGPTRealtimeProbe.m
          grep -q 'probe.log_cleared' scripts/research/official_ios_realtime_probe/ChatGPTRealtimeProbe.m
          grep -q 'ChatGPTRealtimeProbe.Clear' scripts/research/official_ios_realtime_probe/ProbeExportUI.m
          grep -q 'pathShape' scripts/research/official_ios_realtime_probe/ChatGPTRealtimeProbe.m
          test "$(grep -c '@"path": url.path' scripts/research/official_ios_realtime_probe/ChatGPTRealtimeProbe.m || true)" = "0"
          changed="$({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)"
          expected="$(printf '%s\n' \
            docs/project/PROJECT_STATE.md \
            docs/project/current/dev/DEV-send-stream.md \
            docs/project/runtime-evidence/DEV-send-stream-official-ios-probe-v01-runtime-v02-plan-20260904.md \
            scripts/research/official_ios_realtime_probe/ChatGPTRealtimeProbe.m \
            scripts/research/official_ios_realtime_probe/ProbeExportUI.m \
            scripts/research/official_ios_realtime_probe/README.md | sort)"
          test "$changed" = "$expected"

      - name: Commit atomic research batch
        run: |
          git config user.name "white-shark-ssw"
          git config user.email "houstools@gmail.com"
          git add docs/project/PROJECT_STATE.md docs/project/current/dev/DEV-send-stream.md docs/project/runtime-evidence/DEV-send-stream-official-ios-probe-v01-runtime-v02-plan-20260904.md scripts/research/official_ios_realtime_probe/ChatGPTRealtimeProbe.m scripts/research/official_ios_realtime_probe/ProbeExportUI.m scripts/research/official_ios_realtime_probe/README.md
          git commit -m "research: expand official iOS late-join probe v0.2"
          git push origin HEAD:dev/send-stream-20260829
