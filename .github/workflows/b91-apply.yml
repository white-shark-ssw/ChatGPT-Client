name: b91 scoped route parser staging

on:
  push:
    branches:
      - dev/send-stream-20260829
    paths:
      - ".github/workflows/b91-apply.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/send-stream-20260829
          fetch-depth: 0

      - name: Guard base
        run: |
          test "$(git rev-parse HEAD)" = "fd43eee51cdf045253ca527204ff1e4d34abf216" || { echo "unexpected head $(git rev-parse HEAD)"; exit 1; }

      - name: Apply exact b91 delta
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('ChatGPTClient/RootViewController.swift')
          text = root.read_text()
          old = r'''        const match = location.pathname.match(/^\/c\/([^/?#]+)/);'''
          new = r'''        const match = location.pathname.match(/^\/(?:g\/[^/?#]+\/)?c\/([^/?#]+)/);'''
          if text.count(old) != 1:
              raise SystemExit(f'route parser match count={text.count(old)}')
          root.write_text(text.replace(old, new, 1))

          pbx = Path('ChatGPTClient.xcodeproj/project.pbxproj')
          text = pbx.read_text()
          if text.count('CURRENT_PROJECT_VERSION = 90;') != 2:
              raise SystemExit('unexpected build-number count')
          if text.count('DIAGNOSTICS_CANDIDATE = "DEV-send-stream-0.1.0-b90";') != 2:
              raise SystemExit('unexpected candidate count')
          text = text.replace('CURRENT_PROJECT_VERSION = 90;', 'CURRENT_PROJECT_VERSION = 91;')
          text = text.replace('DIAGNOSTICS_CANDIDATE = "DEV-send-stream-0.1.0-b90";', 'DIAGNOSTICS_CANDIDATE = "DEV-send-stream-0.1.0-b91";')
          pbx.write_text(text)
          PY

      - name: Audit exact scope
        run: |
          git diff --check
          test "$(git diff --name-only | sort)" = $'ChatGPTClient.xcodeproj/project.pbxproj\nChatGPTClient/RootViewController.swift' || { git diff --name-only; exit 1; }
          git diff -- ChatGPTClient/RootViewController.swift ChatGPTClient.xcodeproj/project.pbxproj

      - name: Simulator compile
        run: |
          xcodebuild -project ChatGPTClient.xcodeproj -scheme ChatGPTClient -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

      - name: Commit product
        run: |
          git config user.name white-shark-ssw
          git config user.email houstools@gmail.com
          git add ChatGPTClient/RootViewController.swift ChatGPTClient.xcodeproj/project.pbxproj
          git commit -m 'b91: recognize project-scoped conversation routes'
          git push origin HEAD:dev/send-stream-20260829
