# Candidate: DEV-message-rendering-0.1.0-b113
# Product source: 7d1ddc8eaa164c9b307f525b00bb0e1404f395e9
# Stacked on DEV-send-stream b112 Runtime-positive role-isolated reuse; this workflow packages presentation-only message rendering.
name: iOS Native Message Rendering b113

on:
  push:
    branches:
      - dev/message-rendering-20260906
    paths:
      - "ChatGPTClient/**"
      - "ChatGPTClient.xcodeproj/**"
      - "scripts/build_ipa.sh"
      - "scripts/reconstruct_app_icon.sh"
      - "scripts/assets/**"
      - ".github/workflows/ios-foundation.yml"
  pull_request:
    paths:
      - "ChatGPTClient/**"
      - "ChatGPTClient.xcodeproj/**"
      - "scripts/build_ipa.sh"
      - "scripts/reconstruct_app_icon.sh"
      - "scripts/assets/**"
      - ".github/workflows/ios-foundation.yml"
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard b113 native rendering and b112 inheritance
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 7d1ddc8eaa164c9b307f525b00bb0e1404f395e9 HEAD
          git diff --quiet 7d1ddc8eaa164c9b307f525b00bb0e1404f395e9 HEAD -- ChatGPTClient.xcodeproj/project.pbxproj ChatGPTClient/Conversation/ConversationFeature.swift ChatGPTClient/RootViewController.swift
          test "$(grep -c 'CURRENT_PROJECT_VERSION = 113;' ChatGPTClient.xcodeproj/project.pbxproj)" = "2"
          test "$(grep -c 'DIAGNOSTICS_CANDIDATE = \"DEV-message-rendering-0.1.0-b113\";' ChatGPTClient.xcodeproj/project.pbxproj)" = "2"
          grep -Fq 'enum ConversationMessageRichTextRenderer' ChatGPTClient/Conversation/ConversationFeature.swift
          grep -Fq 'static let assistantLineHeight: CGFloat = 36 * 0.70' ChatGPTClient/Conversation/ConversationFeature.swift
          grep -Fq 'let attributedText: NSAttributedString' ChatGPTClient/Conversation/ConversationFeature.swift
          grep -Fq 'let rendered = ConversationMessageRichTextRenderer.render(message.text, role: message.role, renderAssistantMarkdown: renderAssistantMarkdown)' ChatGPTClient/Conversation/ConversationFeature.swift
          grep -Fq 'attributedText.attributedSubstring' ChatGPTClient/Conversation/ConversationFeature.swift
          grep -Fq 'renderAssistantMarkdown: !snapshot.phase.isActive' ChatGPTClient/Conversation/ConversationFeature.swift
          grep -Fq 'bareURLCharacters' ChatGPTClient/Conversation/ConversationFeature.swift
          grep -Fq 'scalar.value < 128' ChatGPTClient/Conversation/ConversationFeature.swift
          grep -Fq 'color: .systemBlue' ChatGPTClient/Conversation/ConversationFeature.swift
          grep -Fq 'return location.map { "〔文件引用 \($0)〕" } ?? "〔文件引用〕"' ChatGPTClient/Conversation/ConversationFeature.swift
          grep -Fq 'if kind == "cite" { return "〔引用〕" }' ChatGPTClient/Conversation/ConversationFeature.swift
          grep -Fq 'isTableSeparator' ChatGPTClient/Conversation/ConversationFeature.swift
          grep -Fq 'appendCodeBlock' ChatGPTClient/Conversation/ConversationFeature.swift
          grep -Fq 'static let userReuseIdentifier = "ConversationMessageCell.user"' ChatGPTClient/Conversation/ConversationFeature.swift
          grep -Fq 'static let assistantReuseIdentifier = "ConversationMessageCell.assistant"' ChatGPTClient/Conversation/ConversationFeature.swift
          grep -Fq 'reuseIdentifier(for: cellRole)' ChatGPTClient/Conversation/ConversationFeature.swift
          ! grep -Fq 'assistantBodyAttributedText' ChatGPTClient/Conversation/ConversationFeature.swift
          ! grep -Fq 'userBodyAttributedText' ChatGPTClient/Conversation/ConversationFeature.swift
          grep -Fq 'reasoningTextView.linkTextAttributes = [.foregroundColor: UIColor.secondaryLabel]' ChatGPTClient/Conversation/ConversationFeature.swift
          grep -q 'assistantChunkRender.afterDisplay' ChatGPTClient/Conversation/ConversationFeature.swift
          grep -q 'reusedFromRole' ChatGPTClient/Conversation/ConversationFeature.swift
          grep -q 'labelLayerTransparent' ChatGPTClient/Conversation/ConversationFeature.swift
          test ! -e ChatGPTClient/Protocol/CoveredWebProcessKillProbe.swift
          ! grep -R -q '_killWebContentProcessAndResetState' ChatGPTClient
          git diff --quiet 50432b8743f3391a8174a3b7aae745298082d433 HEAD -- ChatGPTClient/RootViewController.swift
          grep -q 'acceptedClientStreamEndedWithoutTerminal' ChatGPTClient/RootViewController.swift
          grep -q 'manualSync.clientLiveReconciled' ChatGPTClient/RootViewController.swift
          grep -q 'policy.*no_resend_same_generation' ChatGPTClient/RootViewController.swift

      - name: Toolchain
        run: xcodebuild -version

      - name: Build unsigned TrollStore IPA candidate
        run: bash scripts/build_ipa.sh

      - name: Inspect artifact
        run: |
          ls -lh build/artifacts
          unzip -l build/artifacts/*.ipa | head -n 40

      - name: Upload IPA candidate
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPTClient-DEV-message-rendering-0.1.0-b113
          path: |
            build/artifacts/*.ipa
            build/artifacts/*.sha256
          if-no-files-found: error
          retention-days: 14
