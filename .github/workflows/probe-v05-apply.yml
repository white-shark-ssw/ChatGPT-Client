name: Apply Probe v0.5 research delta

on:
  push:
    branches:
      - dev/send-stream-20260829
    paths:
      - '.github/workflows/probe-v05-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/send-stream-20260829
          fetch-depth: 0
      - name: Guard exact pre-v0.5 baseline
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "1074cabfb6afa31e0db37896bf606f25f2f7d685"
          CHANGED="$(git diff --name-only HEAD^ HEAD | sort)"
          EXPECTED=$'.github/probe_v05_apply.py\n.github/workflows/probe-v05-apply.yml'
          printf '%s\n' "$CHANGED"
          test "$CHANGED" = "$EXPECTED"
      - name: Apply exact v0.5 research changes
        run: |
          set -euo pipefail
          python3 .github/probe_v05_apply.py
          git diff --check
          grep -F 'static NSString * const RPTProbeVersion = @"0.5";' scripts/research/official_ios_realtime_probe/ChatGPTRealtimeProbe.m
          grep -F 'http.conversation_detail.async_status' scripts/research/official_ios_realtime_probe/ChatGPTRealtimeProbe.m
          grep -F 'URLSession:dataTask:didReceiveData:' scripts/research/official_ios_realtime_probe/ChatGPTRealtimeProbe.m
          grep -F 'RPTLateSessionRefreshDone' scripts/research/official_ios_realtime_probe/ChatGPTRealtimeProbe.m
          grep -F 'Current research revision: **Probe v0.5**.' scripts/research/official_ios_realtime_probe/README.md
          grep -F 'Official iOS Probe v0.5 async-status response gate' docs/project/current/dev/DEV-send-stream.md
      - name: Audit research-only scope and commit
        run: |
          set -euo pipefail
          rm .github/probe_v05_apply.py .github/workflows/probe-v05-apply.yml
          git add -A
          CHANGED="$(git diff --cached --name-only | sort)"
          EXPECTED=$'.github/probe_v05_apply.py\n.github/workflows/probe-v05-apply.yml\ndocs/project/current/dev/DEV-send-stream.md\nscripts/research/official_ios_realtime_probe/ChatGPTRealtimeProbe.m\nscripts/research/official_ios_realtime_probe/README.md'
          printf '%s\n' "$CHANGED"
          test "$CHANGED" = "$EXPECTED"
          if git diff --cached --name-only | grep -Eq '^ChatGPTClient/|^ChatGPTClient\.xcodeproj/|^\.github/workflows/ios-foundation\.yml$'; then exit 1; fi
          git config user.name 'OpenAI Probe v0.5 Research'
          git config user.email 'probe-v05@users.noreply.github.com'
          git commit -m 'research: observe official Detail async status [skip ci]'
          git push origin HEAD:dev/send-stream-20260829
