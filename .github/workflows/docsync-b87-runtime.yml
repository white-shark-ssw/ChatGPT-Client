name: Sync b87 Runtime evidence

on:
  push:
    branches:
      - staging/send-stream-b87-docsync-20260902

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tooling branch
        uses: actions/checkout@v4
        with:
          ref: staging/send-stream-b87-docsync-20260902
          path: tools

      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: dev/send-stream-20260829
          fetch-depth: 0
          path: target

      - name: Patch BUILD_TEST_INDEX
        working-directory: target
        run: |
          python3 ../tools/scripts/docsync_b87_runtime.py
          git diff --check
          grep -F 'DEV-send-stream-0.1.0-b87' docs/project/BUILD_TEST_INDEX.md >/dev/null
          grep -F 'focus-vs-router causality Unverified' docs/project/BUILD_TEST_INDEX.md >/dev/null

      - name: Commit and push
        working-directory: target
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/project/BUILD_TEST_INDEX.md
          git commit -m 'docs(send): classify b87 activation runtime'
          git push origin HEAD:dev/send-stream-20260829
