name: Guarded b89 docs sync

on:
  push:
    branches:
      - dev/send-stream-20260829
    paths:
      - ".github/workflows/b89-docsync.yml"

permissions:
  contents: write

jobs:
  sync-b89-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact feature head
        uses: actions/checkout@v4
        with:
          ref: dev/send-stream-20260829
          fetch-depth: 0

      - name: Apply exact b89 durable documentation updates
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def insert_top(path, heading, marker, section):
              p = Path(path)
              text = p.read_text()
              assert marker not in text, f"marker already present in {path}"
              anchor = heading + "\n\n"
              assert text.count(anchor) == 1, f"unexpected heading count in {path}: {text.count(anchor)}"
              p.write_text(text.replace(anchor, anchor + section + "\n", 1))

          insert_top(
              "docs/project/PROJECT_PROFILE.md",
              "# Project Profile",
              "## DEV-send-stream b89 package-ready override — 2026-09-03",
              "## DEV-send-stream b89 package-ready override — 2026-09-03\n\n"
              "- Exact Runtime candidate is now `DEV-send-stream-0.1.0-b89` / `0.1.0 (89)`. Product commit `f39bc9387575028d431b85409780a2f3670b3259`; exact product/config package source `fe45aeadf7ae03bf09aff66a8a05aa2542959676`.\n"
              "- Guarded staging `33722656297 / 100544857329` passed exact patch, `git diff --check` and Xcode 16.4 Simulator compile. Formal Push `33725042383 / 100552047445` and PR `33725044367 / 100552051932` both passed.\n"
              "- Canonical Push Artifact `9881665748`; Artifact ZIP `sha256:2e383a6328f801dd754d6858c3b9a8b71be5d5765a9a612d497b18c91b73988f`; IPA `sha256:c8ad5dcebbfde2131d3fc73c0309a47745f71527ad38b44c5fe3c5fbffe21a55`. Independent unpacking confirms Release `0.1.0 (89)`, Candidate b89, source `fe45aeadf7ae`, iOS14 minimum and Mach-O arm64.\n"
              "- b89 changes only covered `WKWebView.isUserInteractionEnabled=false -> true` plus privacy-safe automatic `navigator.userActivation` booleans; b88 focus/rearm, route, continuation protocol, Send and Repository ownership are unchanged. Runtime/manual remains Pending; Stable/Frozen Send remains No."
          )

          insert_top(
              "docs/project/PROJECT_STATE.md",
              "# Project State",
              "## DEV-send-stream b89 package-ready override — 2026-09-03",
              "## DEV-send-stream b89 package-ready override — 2026-09-03\n\n"
              "Exact b89 `DEV-send-stream-0.1.0-b89` / `0.1.0 (89)` is now the Human Runtime candidate. Product commit `f39bc9387575028d431b85409780a2f3670b3259`; exact package source `fe45aeadf7ae03bf09aff66a8a05aa2542959676`; guarded staging `33722656297 / 100544857329` passed; Push `33725042383 / 100552047445` and PR `33725044367 / 100552051932` passed. Canonical Push Artifact `9881665748`, ZIP `sha256:2e383a6328f801dd754d6858c3b9a8b71be5d5765a9a612d497b18c91b73988f`, IPA `sha256:c8ad5dcebbfde2131d3fc73c0309a47745f71527ad38b44c5fe3c5fbffe21a55`; package independently verified as Release 0.1.0 (89), Candidate b89, source `fe45aeadf7ae`, iOS14, arm64. b89 tests only covered-Web interactivity plus automatic user-activation diagnostics; real-device continuation causality is Pending and Stable/Frozen remains No."
          )

          insert_top(
              "docs/project/MODULE_STATUS.md",
              "# Module Status",
              "## DEV-send-stream b89 package-ready override — 2026-09-03",
              "## DEV-send-stream b89 package-ready override — 2026-09-03\n\n"
              "- Build/runtime metadata: exact b89 product `f39bc9387575028d431b85409780a2f3670b3259`, package source `fe45aeadf7ae03bf09aff66a8a05aa2542959676`, Candidate/Build `DEV-send-stream-0.1.0-b89` / `0.1.0 (89)`.\n"
              "- Guarded staging `33722656297/100544857329`, Push `33725042383/100552047445`, and PR `33725044367/100552051932` all passed. Canonical Push Artifact `9881665748`; ZIP `2e383a63...3988f`; IPA `c8ad5dce...21a55`; package independently verified as Release/source `fe45aeadf7ae`/iOS14/arm64.\n"
              "- Covered official-Web continuation: b89 enables only `WKWebView.isUserInteractionEnabled` and records automatic user-activation booleans while preserving b88 focus/rearm and all page-owned continuation rules. Runtime continuation remains Unverified.\n"
              "- Evidence ladder: Code/guarded Simulator/Push+PR CI/Artifact/package verified; Runtime Pending; Stable/Frozen Send No."
          )

          insert_top(
              "docs/project/TECHNICAL_DECISIONS.md",
              "# Technical Decisions",
              "## b89 interactivity A/B package qualification — 2026-09-03",
              "## b89 interactivity A/B package qualification — 2026-09-03\n\n"
              "- Fresh-root visible official Web already proved unscoped `/c/{conversation}` can canonicalize to exact scoped `/g/{scope}/c/{conversation}` and start page-owned continuation with transient user activation false, so scoped-route identity alone is no longer the remaining b88 explanation.\n"
              "- b89 therefore tests one remaining covered-WKWebView differential only: `isUserInteractionEnabled=true` instead of false, retaining the already-proven b88 first-responder focus/rearm behavior. Existing page-activation diagnostics additionally record privacy-safe `navigator.userActivation.isActive` / `hasBeenActive`; no user-triggered Web Rule Lab probe is needed.\n"
              "- b89 is Code/Simulator/Push+PR CI/Artifact/package verified but Runtime Pending. Do not treat interactivity or user activation as causal until a clean early/mid-generation real-device run observes page-owned `stream_status`/resume/snapshot continuation while the remote generation demonstrably remains active.\n"
              "- Existing prohibitions remain: no Native status/resume/offset synthesis, polling/timers/retries/watchdogs, router emulation, duplicate Send, WebSocket-body authority or second response store."
          )

          insert_top(
              "docs/project/WEB_SEND_ADAPTER.md",
              "# Web Send Adapter / Rule Update Playbook",
              "## b89 covered interactivity A/B package qualification — 2026-09-03",
              "## b89 covered interactivity A/B package qualification — 2026-09-03\n\n"
              "Fresh-root visible-Web evidence now proves that official Web can canonicalize an unscoped `/c/{conversation}` navigation to the exact scoped `/g/{scope}/c/{conversation}` route and start genuine page-owned continuation even when transient activation at navigation is false. Therefore project/GPT scope recovery and transient activation alone do not explain the b88 covered-page failure.\n\n"
              "b89 changes only covered `WKWebView.isUserInteractionEnabled` from false to true and automatically records privacy-safe `navigator.userActivation` availability / `isActive` / `hasBeenActive` on the existing page-activation diagnostic path. b88 one-shot first-responder focus after explicit Sync rearm remains unchanged. No route construction, page-owned status/resume/snapshot observation, Send, Repository ownership, cadence or fallback behavior changes.\n\n"
              "Exact b89 package source `fe45aeadf7ae03bf09aff66a8a05aa2542959676` passed guarded Simulator plus Push/PR CI; canonical Push Artifact `9881665748` and IPA `sha256:c8ad5dcebbfde2131d3fc73c0309a47745f71527ad38b44c5fe3c5fbffe21a55` are package-verified. Runtime is Pending. A clean test must keep the remote generation active after covered load/focus/interactivity and then determine whether official page-owned `stream_status` / `/resume` / snapshots appear. A negative clean run rejects interactivity as sufficient and returns the evidence target to genuine official SPA/router conversation-entry state."
          )

          insert_top(
              "docs/project/PROJECT_SPECIFIC_RULES.md",
              "# Project-Specific Rules",
              "## b89 current package rule — 2026-09-03",
              "## b89 current package rule — 2026-09-03\n\n"
              "- Exact b89 is emitted and permanently reserved: `DEV-send-stream-0.1.0-b89`, Build89, product commit `f39bc9387575028d431b85409780a2f3670b3259`, exact package source `fe45aeadf7ae03bf09aff66a8a05aa2542959676`, canonical Push Artifact `9881665748`, IPA SHA `c8ad5dcebbfde2131d3fc73c0309a47745f71527ad38b44c5fe3c5fbffe21a55`.\n"
              "- b89 may change only covered Web interactivity plus privacy-safe automatic user-activation diagnostics relative to b88; it does not authorize route synthesis, Native status/resume/offset, polling, retry/watchdog, duplicate Send, WebSocket-body authority or another response owner.\n"
              "- CI/Artifact/package success is not Runtime proof. Retain b89 only if a clean long-response real-device A/B supports the interactivity differential; otherwise reject it as sufficient and return to SPA/router-entry evidence."
          )

          p = Path("docs/project/BUILD_TEST_INDEX.md")
          text = p.read_text()
          marker = "| `DEV-send-stream-0.1.0-b89` |"
          assert marker not in text, "b89 BUILD_TEST_INDEX row already present"
          anchor = "|---|---|---|---|---|---|---|\n"
          assert text.count(anchor) == 1, f"unexpected candidate-table separator count: {text.count(anchor)}"
          row = (
              "| `DEV-send-stream-0.1.0-b89` | `DEV-send-stream` | `0.1.0 (89)` | exact interactivity-A/B product commit `f39bc9387575028d431b85409780a2f3670b3259`; exact product/config package source `fe45aeadf7ae03bf09aff66a8a05aa2542959676`; PR #29 | guarded staging `33722656297/100544857329` passed exact patch + `git diff --check` + Xcode 16.4 Simulator; Push `33725042383/100552047445` passed; PR `33725044367/100552051932` passed; canonical Push Artifact `9881665748`; ZIP `sha256:2e383a6328f801dd754d6858c3b9a8b71be5d5765a9a612d497b18c91b73988f`; IPA `sha256:c8ad5dcebbfde2131d3fc73c0309a47745f71527ad38b44c5fe3c5fbffe21a55`; package `0.1.0 (89)` / Candidate b89 / source `fe45aeadf7ae` / iOS14 / arm64 | Runtime pending: covered `isUserInteractionEnabled=true` + automatic user-activation diagnostics, retaining b88 one-shot focus/rearm; clean early/mid-generation continuation A/B required | **Code/guarded Simulator/Push+PR CI/Artifact/package verified; Runtime Unverified; Stable-Frozen No; permanently reserved** |\n"
          )
          p.write_text(text.replace(anchor, anchor + row, 1))
          PY

          expected=$'docs/project/BUILD_TEST_INDEX.md\ndocs/project/MODULE_STATUS.md\ndocs/project/PROJECT_PROFILE.md\ndocs/project/PROJECT_SPECIFIC_RULES.md\ndocs/project/PROJECT_STATE.md\ndocs/project/TECHNICAL_DECISIONS.md\ndocs/project/WEB_SEND_ADAPTER.md'
          test "$(git diff --name-only | sort)" = "$expected"
          git diff --check

      - name: Commit verified docs and remove temporary workflow
        run: |
          git rm .github/workflows/b89-docsync.yml
          changed="$({ git diff --name-only; git diff --cached --name-only; } | sort -u)"
          expected=$'.github/workflows/b89-docsync.yml\ndocs/project/BUILD_TEST_INDEX.md\ndocs/project/MODULE_STATUS.md\ndocs/project/PROJECT_PROFILE.md\ndocs/project/PROJECT_SPECIFIC_RULES.md\ndocs/project/PROJECT_STATE.md\ndocs/project/TECHNICAL_DECISIONS.md\ndocs/project/WEB_SEND_ADAPTER.md'
          test "$changed" = "$expected"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: record DEV-send-stream b89 package"
          git push origin HEAD:dev/send-stream-20260829
