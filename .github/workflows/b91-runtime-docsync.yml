name: b91 Runtime docs sync

on:
  push:
    branches:
      - dev/send-stream-20260829
    paths:
      - ".github/workflows/b91-runtime-docsync.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/send-stream-20260829
          fetch-depth: 0
      - name: Sync durable Runtime docs
        run: python3 .github/b91_runtime_docs.py
      - name: Audit docs-only scope
        run: |
          git diff --check
          CHANGED=$(git diff --name-only | sort)
          echo "$CHANGED"
          test -n "$CHANGED"
          if echo "$CHANGED" | grep -Ev '^docs/project/'; then
            echo 'unexpected non-doc change'
            exit 1
          fi
      - name: Commit docs
        run: |
          git config user.name white-shark-ssw
          git config user.email houstools@gmail.com
          git add docs/project
          git commit -m 'docs: record b91 live continuation Runtime positive'
          git push origin HEAD:dev/send-stream-20260829
