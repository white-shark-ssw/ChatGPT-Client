# Candidate: DEV-send-stream-0.1.0-b83
name: iOS Send Manual Sync Determinism b83

on:
  push:
    branches:
      - dev/send-stream-20260829
    paths:
      - "ChatGPTClient/**"
      - "ChatGPTClient.xcodeproj/**"
      - "scripts/build_ipa.sh"
      - "scripts/reconstruct_app_icon.sh"
      - "scripts/assets/**"
      - ".github/workflows/ios-foundation.yml"
  pull_request:
    paths:
      - "ChatGPTClient/**"
      - "ChatGPTClient.xcodeproj/**"
      - "scripts/build_ipa.sh"
      - "scripts/reconstruct_app_icon.sh"
      - ".github/workflows/ios-foundation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: xcodebuild -version

      - name: Apply exact b83 source correction
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("ChatGPTClient/RootViewController.swift")
          text = root.read_text()
          old = '''        detailViewController.onManualLatestSyncApplied = { [weak self] id, latestUserChanged in
                      guard let self, latestUserChanged, self.repository.selectedConversationID == id, !self.repository.isLiveResponseActive(for: id) else { return }
                      self.observeExternalResponseIfNeeded(conversationID: id, forcePageReload: true)
                  }'''
          new = '''        detailViewController.onManualLatestSyncApplied = { [weak self] id, _ in
                      guard let self, self.repository.selectedConversationID == id, !self.repository.isLiveResponseActive(for: id) else { return }
                      self.observeExternalResponseIfNeeded(conversationID: id, forcePageReload: true)
                  }'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one manual-sync callback block, found {text.count(old)}")
          root.write_text(text.replace(old, new))

          project = Path("ChatGPTClient.xcodeproj/project.pbxproj")
          text = project.read_text()
          if text.count("CURRENT_PROJECT_VERSION = 82;") != 2:
              raise SystemExit("expected two build-82 settings")
          if text.count('DIAGNOSTICS_CANDIDATE = "DEV-send-stream-0.1.0-b82";') != 2:
              raise SystemExit("expected two b82 candidate settings")
          text = text.replace("CURRENT_PROJECT_VERSION = 82;", "CURRENT_PROJECT_VERSION = 83;")
          text = text.replace('DIAGNOSTICS_CANDIDATE = "DEV-send-stream-0.1.0-b82";', 'DIAGNOSTICS_CANDIDATE = "DEV-send-stream-0.1.0-b83";')
          project.write_text(text)
          PY
          git diff --check
          git diff -- ChatGPTClient/RootViewController.swift ChatGPTClient.xcodeproj/project.pbxproj

      - name: Commit exact b83 product source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ChatGPTClient/RootViewController.swift ChatGPTClient.xcodeproj/project.pbxproj
          git commit -m "fix(send): make manual sync rearm deterministic (b83)"
          git push origin HEAD:dev/send-stream-20260829

      - name: Build unsigned TrollStore IPA candidate
        run: bash scripts/build_ipa.sh

      - name: Inspect artifact
        run: |
          ls -lh build/artifacts
          unzip -l build/artifacts/*.ipa | head -n 40

      - name: Upload IPA candidate
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPTClient-DEV-send-stream-0.1.0-b83
          path: |
            build/artifacts/*.ipa
            build/artifacts/*.sha256
          if-no-files-found: error
          retention-days: 14
