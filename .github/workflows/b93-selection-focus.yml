name: b93 selection focus staging

on:
  push:
    branches:
      - dev/send-stream-20260829
    paths:
      - ".github/b93_stage.py"
      - ".github/workflows/b93-selection-focus.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard staging base
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "7edef4c169737ecf7225e717a5fe3c3f03d8d8f1"
          git merge-base --is-ancestor 78fa094e4a9d312589115545d5a0349582d9b4f7 HEAD

      - name: Allocate b93 checkpoint
        run: |
          set -euo pipefail
          python3 .github/b93_stage.py allocate
          git diff --check
          test "$(git diff --name-only)" = "docs/project/current/dev/DEV-send-stream.md"
          git add docs/project/current/dev/DEV-send-stream.md
          git commit -m "checkpoint: allocate b93 selection focus A-B [skip ci]"
          git push origin HEAD:dev/send-stream-20260829

      - name: Apply b93 product delta
        run: |
          set -euo pipefail
          python3 .github/b93_stage.py product
          git diff --check
          test "$(git diff --name-only | sort)" = $'ChatGPTClient.xcodeproj/project.pbxproj\nChatGPTClient/RootViewController.swift'
          grep -Fq 'selection_external_focus_rearm' ChatGPTClient/RootViewController.swift
          grep -Fq 'selectionFocusActivationResult' ChatGPTClient/RootViewController.swift
          grep -Fq 'DEV-send-stream-0.1.0-b93' ChatGPTClient.xcodeproj/project.pbxproj

      - name: Simulator compile
        run: xcodebuild -project ChatGPTClient.xcodeproj -scheme ChatGPTClient -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

      - name: Commit b93 product
        run: |
          set -euo pipefail
          git add ChatGPTClient/RootViewController.swift ChatGPTClient.xcodeproj/project.pbxproj
          git commit -m "b93: rearm external focus on reselection [skip ci]"
          git push origin HEAD:dev/send-stream-20260829
