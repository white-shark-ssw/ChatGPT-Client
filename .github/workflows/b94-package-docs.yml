name: b94 package docs sync
on:
  push:
    branches: [dev/send-stream-20260829]
    paths: [".github/workflows/b94-package-docs.yml"]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: |
          set -euo pipefail
          git merge-base --is-ancestor 59894bd9ca7c293211cd856ecf33579f19ce4d84 HEAD
          python3 .github/b94_package_docs.py
          git diff --check
          CHANGED="$(git diff --name-only | sort)"
          printf '%s\n' "$CHANGED"
          test "$CHANGED" = $'docs/project/BUILD_TEST_INDEX.md\ndocs/project/current/dev/DEV-send-stream.md'
      - run: |
          set -euo pipefail
          git config user.name "OpenAI b94 Docs"
          git config user.email "b94-docs@users.noreply.github.com"
          git add docs/project
          git commit -m "docs: package b94 foreground rebootstrap gate [skip ci]"
          git push origin HEAD:dev/send-stream-20260829
