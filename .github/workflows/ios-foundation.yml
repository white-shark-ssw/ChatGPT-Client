# Candidate: DEV-send-stream-0.1.0-b107
# Product source: 113fa19d7264b953949770d2e44cb500ded2da6b
# b107 treats accepted SSE EOF without exact DONE as same-generation receive interruption and clears stale non-active client live state after authoritative manual Sync.
name: iOS Accepted SSE EOF Recovery b107

on:
  push:
    branches:
      - dev/send-stream-20260829
    paths:
      - "ChatGPTClient/**"
      - "ChatGPTClient.xcodeproj/**"
      - "scripts/build_ipa.sh"
      - "scripts/reconstruct_app_icon.sh"
      - "scripts/assets/**"
      - ".github/workflows/ios-foundation.yml"
  pull_request:
    paths:
      - "ChatGPTClient/**"
      - "ChatGPTClient.xcodeproj/**"
      - "scripts/build_ipa.sh"
      - "scripts/reconstruct_app_icon.sh"
      - "scripts/assets/**"
      - ".github/workflows/ios-foundation.yml"
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard b107 accepted SSE EOF same-generation recovery
        run: |
          test "$(grep -c 'CURRENT_PROJECT_VERSION = 107;' ChatGPTClient.xcodeproj/project.pbxproj)" = "2"
          test "$(grep -c 'DIAGNOSTICS_CANDIDATE = \"DEV-send-stream-0.1.0-b107\";' ChatGPTClient.xcodeproj/project.pbxproj)" = "2"
          test ! -e ChatGPTClient/Protocol/CoveredWebProcessKillProbe.swift
          ! grep -R -q '_killWebContentProcessAndResetState' ChatGPTClient
          grep -q 'func sendNewConversation' ChatGPTClient/RootViewController.swift
          grep -q 'protected_send_sse_conversation_id' ChatGPTClient/RootViewController.swift
          grep -q 'pendingNewConversationEvents' ChatGPTClient/RootViewController.swift
          grep -q 'new_conversation_identity_missing_at_terminal' ChatGPTClient/RootViewController.swift
          grep -q 'new_conversation_identity_conflict' ChatGPTClient/RootViewController.swift
          grep -q 'acceptedClientWebProcessInterrupted' ChatGPTClient/RootViewController.swift
          grep -q 'acceptedClientStreamEndedWithoutTerminal' ChatGPTClient/RootViewController.swift
          grep -q 'coveredExecutor.acceptedClientStreamEndRecovery' ChatGPTClient/RootViewController.swift
          grep -q 'state == "stream_ended_without_done", clientSendAccepted, responseActive' ChatGPTClient/RootViewController.swift
          grep -q 'trigger: "stream_ended_without_done"' ChatGPTClient/RootViewController.swift
          grep -q 'manualSync.clientLiveReconciled' ChatGPTClient/RootViewController.swift
          grep -q 'clearLiveResponseAfterAuthoritativeReconcile' ChatGPTClient/RootViewController.swift
          grep -q 'acceptedClientRecovery.started' ChatGPTClient/RootViewController.swift
          grep -q 'preservedClientGeneration' ChatGPTClient/RootViewController.swift
          grep -q 'policy.*no_resend_same_generation' ChatGPTClient/RootViewController.swift
          grep -q 'network_connection_lost_current_transient' ChatGPTClient/Conversation/ConversationFeature.swift
          grep -q 'foregroundConversationDiscovery.requested' ChatGPTClient/RootViewController.swift
          grep -q 'coveredExecutor.externalWebProcessRecovery' ChatGPTClient/RootViewController.swift

      - name: Toolchain
        run: xcodebuild -version

      - name: Build unsigned TrollStore IPA candidate
        run: bash scripts/build_ipa.sh

      - name: Inspect artifact
        run: |
          ls -lh build/artifacts
          unzip -l build/artifacts/*.ipa | head -n 40

      - name: Upload IPA candidate
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPTClient-DEV-send-stream-0.1.0-b107
          path: |
            build/artifacts/*.ipa
            build/artifacts/*.sha256
          if-no-files-found: error
          retention-days: 14
