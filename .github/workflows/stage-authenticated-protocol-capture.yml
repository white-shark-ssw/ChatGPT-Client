name: Stage Authenticated Protocol Capture Replay Correction

on:
  push:
    branches:
      - dev/authenticated-protocol-capture-20261009
    paths:
      - ".github/workflows/stage-authenticated-protocol-capture.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated capture branch
        uses: actions/checkout@v4
        with:
          ref: dev/authenticated-protocol-capture-20261009
          fetch-depth: 0

      - name: Guard parent and inherited Candidate identity
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 79107c64347e05e0dfd4f679a3c970dfa09a18b0 HEAD
          test "$(grep -c 'CURRENT_PROJECT_VERSION = 115;' ChatGPTClient.xcodeproj/project.pbxproj)" = "2"
          test "$(grep -c 'DIAGNOSTICS_CANDIDATE = \"DEV-send-stream-0.1.0-b115\";' ChatGPTClient.xcodeproj/project.pbxproj)" = "2"
          ! grep -q 'CURRENT_PROJECT_VERSION = 116;' ChatGPTClient.xcodeproj/project.pbxproj
          grep -q 'protocol_replay_request_body_mismatch' ChatGPTClient/Testing/SimulatorFixtureTransport.swift
          grep -q 'request.httpBody' ChatGPTClient/Testing/SimulatorFixtureTransport.swift

      - name: Apply strict body representation correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('ChatGPTClient/Testing/SimulatorFixtureTransport.swift')
          text = path.read_text()
          old_guard = '            guard let body = request.httpBody, let actualBody = try? JSONSerialization.jsonObject(with: body) as? [String: Any], jsonObjectsEqual(expectedBody, actualBody) else { return .failure("protocol_replay_request_body_mismatch") }'
          new_guard = '            guard let body = requestBodyData(for: request), let actualBody = try? JSONSerialization.jsonObject(with: body) as? [String: Any], jsonObjectsEqual(expectedBody, actualBody) else { return .failure("protocol_replay_request_body_mismatch") }'
          marker = '    private static func jsonObjectsEqual(_ lhs: [String: Any], _ rhs: [String: Any]) -> Bool {'
          helper_lines = [
              '    private static func requestBodyData(for request: URLRequest) -> Data? {',
              '        if let body = request.httpBody { return body }',
              '        guard let stream = request.httpBodyStream else { return nil }',
              '        let shouldOpen = stream.streamStatus == .notOpen',
              '        if shouldOpen { stream.open() }',
              '        defer { if shouldOpen { stream.close() } }',
              '        let bufferSize = 4096',
              '        var buffer = [UInt8](repeating: 0, count: bufferSize)',
              '        var data = Data()',
              '        while true {',
              '            let readCount = buffer.withUnsafeMutableBytes { rawBuffer -> Int in',
              '                guard let baseAddress = rawBuffer.bindMemory(to: UInt8.self).baseAddress else { return 0 }',
              '                return stream.read(baseAddress, maxLength: bufferSize)',
              '            }',
              '            if readCount < 0 { return nil }',
              '            if readCount == 0 { break }',
              '            data.append(contentsOf: buffer.prefix(readCount))',
              '        }',
              '        return data',
              '    }',
              ''
          ]
          if text.count(old_guard) != 1:
              raise SystemExit(f'expected one replay body guard, found {text.count(old_guard)}')
          if text.count(marker) != 1:
              raise SystemExit(f'expected one json equality marker, found {text.count(marker)}')
          text = text.replace(old_guard, new_guard, 1)
          text = text.replace(marker, '\n'.join(helper_lines) + marker, 1)
          path.write_text(text)
          PY

      - name: Validate exact correction scope
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/protocol_capture/sanitize_capture.py --self-test
          git diff --check
          test "$(git diff --name-only)" = "ChatGPTClient/Testing/SimulatorFixtureTransport.swift"
          grep -q 'requestBodyData(for: request)' ChatGPTClient/Testing/SimulatorFixtureTransport.swift
          grep -q 'request.httpBodyStream' ChatGPTClient/Testing/SimulatorFixtureTransport.swift
          grep -q 'jsonObjectsEqual(expectedBody, actualBody)' ChatGPTClient/Testing/SimulatorFixtureTransport.swift
          test "$(grep -c 'CURRENT_PROJECT_VERSION = 115;' ChatGPTClient.xcodeproj/project.pbxproj)" = "2"
          test "$(grep -c 'DIAGNOSTICS_CANDIDATE = \"DEV-send-stream-0.1.0-b115\";' ChatGPTClient.xcodeproj/project.pbxproj)" = "2"
          git diff --quiet -- ChatGPTClient/Conversation/ConversationFeature.swift ChatGPTClient/RootViewController.swift ChatGPTClient/Authentication ChatGPTClient.xcodeproj/project.pbxproj

      - name: Commit replay correction only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ChatGPTClient/Testing/SimulatorFixtureTransport.swift
          git commit -m "test: read replay request body stream strictly"
          git push origin HEAD:dev/authenticated-protocol-capture-20261009
