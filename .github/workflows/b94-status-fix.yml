name: b94 status fix
on:
  push:
    branches: [dev/send-stream-20260829]
    paths: [".github/workflows/b94-status-fix.yml"]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: |
          set -euo pipefail
          python3 .github/b94_status_fix.py
          git diff --check
          test "$(git diff --name-only)" = "docs/project/current/dev/DEV-send-stream.md"
          git config user.name "OpenAI b94 Docs"
          git config user.email "b94-docs@users.noreply.github.com"
          git add docs/project/current/dev/DEV-send-stream.md
          git commit -m "docs: close b94 package gate [skip ci]"
          git push origin HEAD:dev/send-stream-20260829
