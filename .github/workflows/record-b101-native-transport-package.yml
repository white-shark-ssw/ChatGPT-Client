name: Record b101 Native Transport Package Evidence

"on":
  push:
    branches:
      - dev/send-stream-20260829
    paths:
      - ".github/workflows/record-b101-native-transport-package.yml"

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout guarded branch
        uses: actions/checkout@v4
        with:
          ref: dev/send-stream-20260829
          fetch-depth: 0

      - name: Guard exact b101 package baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "1c5b45c0f1de7b3d8b56ed6987bfe4377d73e501"
          grep -q 'CURRENT_PROJECT_VERSION = 101;' ChatGPTClient.xcodeproj/project.pbxproj
          grep -q 'DIAGNOSTICS_CANDIDATE = "DEV-send-stream-0.1.0-b101";' ChatGPTClient.xcodeproj/project.pbxproj
          grep -q 'network_connection_lost_current_transient' ChatGPTClient/Conversation/ConversationFeature.swift
          grep -q '# Product source: 54a9fa52a7b44a1b7418a39e4b0f7493989f999d' .github/workflows/ios-foundation.yml
          grep -q 'ChatGPTClient-DEV-send-stream-0.1.0-b101' .github/workflows/ios-foundation.yml
          test -f scripts/staging/b101_record_package_ready.py
          ! grep -q 'DEV-send-stream-0.1.0-b101' docs/project/BUILD_TEST_INDEX.md

      - name: Apply durable b101 evidence
        run: python3 scripts/staging/b101_record_package_ready.py

      - name: Validate docs-only scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' docs/project/BUILD_TEST_INDEX.md docs/project/MODULE_STATUS.md docs/project/PROJECT_PROFILE.md docs/project/PROJECT_SPECIFIC_RULES.md docs/project/PROJECT_STATE.md docs/project/TECHNICAL_DECISIONS.md docs/project/current/dev/DEV-send-stream-round7-runtime-addendum.md | sort)"
          test "$changed" = "$expected"
          grep -q 'b101 Native read transport renewal — package-ready' docs/project/current/dev/DEV-send-stream-round7-runtime-addendum.md
          grep -q 'DEV-send-stream-0.1.0-b101' docs/project/BUILD_TEST_INDEX.md
          grep -q 'Native read transport loss recovery — b101' docs/project/PROJECT_SPECIFIC_RULES.md

      - name: Commit durable b101 evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/project/BUILD_TEST_INDEX.md docs/project/MODULE_STATUS.md docs/project/PROJECT_PROFILE.md docs/project/PROJECT_SPECIFIC_RULES.md docs/project/PROJECT_STATE.md docs/project/TECHNICAL_DECISIONS.md docs/project/current/dev/DEV-send-stream-round7-runtime-addendum.md
          git commit -m "docs: record b101 native transport package evidence"
          git push origin HEAD:dev/send-stream-20260829
