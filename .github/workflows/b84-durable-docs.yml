name: b84 Durable Build Index Update

on:
  push:
    branches:
      - dev/send-stream-20260829
    paths:
      - ".github/workflows/b84-durable-docs.yml"

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: dev/send-stream-20260829
          fetch-depth: 0

      - name: Update b83 and b84 candidate rows
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/project/BUILD_TEST_INDEX.md")
          lines = path.read_text().splitlines()

          b83_prefix = "| `DEV-send-stream-0.1.0-b83` |"
          b84_prefix = "| `DEV-send-stream-0.1.0-b84` |"
          b83 = "| `DEV-send-stream-0.1.0-b83` | `DEV-send-stream` | `0.1.0 (83)` | exact product/config source `12e3c27138ebc81cbbae6236347122f79e03bf08`; clean CI/package head `3771ddccc8d0847ce28f72acbbe311aaf30b7482`; PR #29 | Push `33556857625/100019684027`; PR `33556862137`; canonical Artifact `9819681774`; ZIP `sha256:b76c71493b01c88c6dfc60f9ef886e9e1c862d15a6e93ee00794ae6740a42682`; IPA `sha256:46f06106c3d47b3845a584665666fb6cb6d39cd66c0c9415412702e81795be97`; package Release/source `3771ddccc8d0`/iOS14/arm64 | Runtime Rejected: repeated explicit Sync calls all reached authoritative Detail and `manual_sync_rearm`; several covered-page loads completed cleanly, but no live reasoning/snapshot was acquired and `livePresentationRowCount` stayed 0 until completed reasoning appeared as historical content. Active Detail graph nevertheless evolved (`mappingCount 1020->1043`) while visible count stayed 22 | **Code/Push+PR CI/Artifact/package verified; Runtime Rejected; permanently reserved** |"
          b84 = "| `DEV-send-stream-0.1.0-b84` | `DEV-send-stream` | `0.1.0 (84)` | exact product/config source `626c3ad4d4d592618d794c4cb8854324f719f4a4`; clean CI/package head `c7398eea6b20788f0e13a18f98e79d3c81ebfc21`; PR #29 | Push `33559649854/100028790782`; PR `33559655688/100028812048`; canonical Artifact `9820763662`; ZIP `sha256:65ff52ddc7b6c4ad1e85e0c084a4f55799da06baad602dff3693edd12a814e9f`; IPA `sha256:1a276fbfc46efeb75566989892d8811561563d6c43a664b1bb7b30799468be38`; package Release/source `c7398eea6b20`/iOS14/arm64 | Runtime Pending: diagnostic-only structural counters determine whether active authoritative Detail ends with an already-presentational trailing reasoning/tool timeline that current Native projection drops; no reasoning/body text or hidden CoT is exported | **Code/Push+PR CI/Artifact/package verified; Runtime Pending; permanently reserved** |"

          b83_indices = [i for i, line in enumerate(lines) if line.startswith(b83_prefix)]
          if len(b83_indices) != 1:
              raise SystemExit(f"expected one b83 row, found {len(b83_indices)}")
          lines[b83_indices[0]] = b83

          b84_indices = [i for i, line in enumerate(lines) if line.startswith(b84_prefix)]
          if len(b84_indices) > 1:
              raise SystemExit(f"expected at most one b84 row, found {len(b84_indices)}")
          if not b84_indices:
              lines.insert(b83_indices[0], b84)
          else:
              lines[b84_indices[0]] = b84

          path.write_text("\n".join(lines) + "\n")
          PY
          git diff --check
          git diff -- docs/project/BUILD_TEST_INDEX.md

      - name: Commit durable index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/project/BUILD_TEST_INDEX.md
          git commit -m "docs: index b83 rejection and b84 diagnostics"
          git push origin HEAD:dev/send-stream-20260829
