name: b75 evidence docs sync

on:
  push:
    branches:
      - assembly/dev-send-stream-b75-20260901
    paths:
      - '.github/workflows/b75-docs-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve patcher and checkout exact b75 product head
        run: |
          cp scripts/b75_docs_sync.py /tmp/b75_docs_sync.py
          git checkout -B dev/send-stream-20260829 origin/dev/send-stream-20260829
          test "$(git rev-parse HEAD)" = 'b77303b8870dc25851dbffbf38ffc153a47bbcb2'
      - name: Patch and audit docs-only evidence
        run: |
          python3 /tmp/b75_docs_sync.py
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' docs/project/BUILD_TEST_INDEX.md docs/project/MODULE_STATUS.md docs/project/PROJECT_STATE.md docs/project/WEB_SEND_ADAPTER.md docs/project/current/dev/DEV-send-stream.md | sort)"
          test "$changed" = "$expected"
          grep -Fq 'Artifact `9772079468`' docs/project/current/dev/DEV-send-stream.md
          grep -Fq 'Runtime/manual/real-device = **Pending**' docs/project/current/dev/DEV-send-stream.md
          grep -Fq 'DEV-send-stream-0.1.0-b75' docs/project/BUILD_TEST_INDEX.md
      - name: Commit docs-only evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/project
          git commit -m 'docs: record DEV-send-stream b75 artifact gate'
          git push origin HEAD:dev/send-stream-20260829
