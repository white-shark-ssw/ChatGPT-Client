            docs/project/DEVELOPMENT_PLAN.md \
            docs/project/MODULE_STATUS.md \
            docs/project/PROJECT_SPECIFIC_RULES.md \
            docs/project/PROJECT_STATE.md \
            docs/project/TECHNICAL_DECISIONS.md \
            docs/project/WEB_SEND_ADAPTER.md \
            docs/project/current/dev/DEV-send-stream.md \
            docs/project/runtime-evidence/DEV-send-stream-b76-candidate.md | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual

      - name: Commit and fast-forward formal branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/project
          git commit -m 'docs: classify b76 pre-runtime candidate'
          git push origin HEAD:refs/heads/dev/send-stream-20260829
