name: b92 covered-form cleanup staging

on:
  push:
    branches:
      - dev/send-stream-20260829
    paths:
      - ".github/workflows/b92-covered-cleanup.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/send-stream-20260829
          fetch-depth: 0

      - name: Guard exact b91 state
        run: |
          git merge-base --is-ancestor 2c5074e567f3aeb929d9a9e254c1b72d0c12216a HEAD
          test "$(grep -c 'hostView.bringSubviewToFront(webView)' ChatGPTClient/RootViewController.swift)" = "1"
          test "$(grep -c 'const match = location.pathname.match(/^\\/(?:g\\/[^/?#]+\\/)?c\\/([^/?#]+)/);' ChatGPTClient/RootViewController.swift)" = "1"
          test "$(grep -c 'CURRENT_PROJECT_VERSION = 91;' ChatGPTClient.xcodeproj/project.pbxproj)" = "2"
          test "$(grep -c 'DIAGNOSTICS_CANDIDATE = \"DEV-send-stream-0.1.0-b91\";' ChatGPTClient.xcodeproj/project.pbxproj)" = "2"

      - name: Allocate b92 checkpoint
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/project/current/dev/DEV-send-stream.md')
          text = p.read_text()
          old = '**Closed for b91 Runtime evidence. Next exact action:** allocate the next unique candidate for one isolated presentation cleanup only: retain b91 scoped-route parsing and page-owned continuation, remove b90 `bringSubviewToFront(webView)` so the executor stays covered, then run project live + natural terminal/final Runtime. No retry/polling/timer/watchdog/Native status or resume synthesis.'
          new = '**Open for b92 covered-form cleanup. Next exact action:** remove only the b90 frontmost z-order mutation while retaining b91 scoped-route identity, page-owned continuation and Repository ownership; validate exact two-file scope + Simulator, then package b92 and stop at Human Runtime for covered live progression + natural terminal/final completion.'
          if text.count(old) != 1:
              raise SystemExit(f'checkpoint next-action count={text.count(old)}')
          anchor = '- b91 IPA SHA-256: `abbd27370665fb97dd1ee5edd239c0a5fa1ea0694cbb329a81c32ee86867c140`\n'
          insert = anchor + '- b92 Candidate / Build: `DEV-send-stream-0.1.0-b92` / `0.1.0 (92)` permanently reserved; product/package not yet emitted at allocation checkpoint\n'
          if text.count(anchor) != 1:
              raise SystemExit('checkpoint identity anchor mismatch')
          text = text.replace(anchor, insert, 1).replace(old, new, 1)
          p.write_text(text)
          PY
          git diff --check
          test "$(git diff --name-only)" = "docs/project/current/dev/DEV-send-stream.md"
          git config user.name white-shark-ssw
          git config user.email houstools@gmail.com
          git add docs/project/current/dev/DEV-send-stream.md
          git commit -m 'checkpoint: allocate b92 covered-form cleanup'
          git push origin HEAD:dev/send-stream-20260829

      - name: Apply exact b92 product delta
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('ChatGPTClient/RootViewController.swift')
          text = root.read_text()
          old = '''        if forceReload, let hostView = webView.superview {\n            hostView.bringSubviewToFront(webView)\n            logWebViewActivationState(stage: "manual_sync_frontmost_ab")\n        }'''
          new = '''        if forceReload { logWebViewActivationState(stage: "manual_sync_covered") }'''
          if text.count(old) != 1:
              raise SystemExit(f'frontmost block count={text.count(old)}')
          root.write_text(text.replace(old, new, 1))

          pbx = Path('ChatGPTClient.xcodeproj/project.pbxproj')
          text = pbx.read_text()
          if text.count('CURRENT_PROJECT_VERSION = 91;') != 2:
              raise SystemExit('unexpected b91 build count')
          if text.count('DIAGNOSTICS_CANDIDATE = "DEV-send-stream-0.1.0-b91";') != 2:
              raise SystemExit('unexpected b91 candidate count')
          text = text.replace('CURRENT_PROJECT_VERSION = 91;', 'CURRENT_PROJECT_VERSION = 92;')
          text = text.replace('DIAGNOSTICS_CANDIDATE = "DEV-send-stream-0.1.0-b91";', 'DIAGNOSTICS_CANDIDATE = "DEV-send-stream-0.1.0-b92";')
          pbx.write_text(text)
          PY

      - name: Audit exact product scope
        run: |
          git diff --check
          test "$(git diff --name-only | sort)" = $'ChatGPTClient.xcodeproj/project.pbxproj\nChatGPTClient/RootViewController.swift' || { git diff --name-only; exit 1; }
          test "$(grep -c 'hostView.bringSubviewToFront(webView)' ChatGPTClient/RootViewController.swift)" = "0"
          test "$(grep -c 'manual_sync_covered' ChatGPTClient/RootViewController.swift)" = "1"
          test "$(grep -c 'const match = location.pathname.match(/^\\/(?:g\\/[^/?#]+\\/)?c\\/([^/?#]+)/);' ChatGPTClient/RootViewController.swift)" = "1"
          git diff -- ChatGPTClient/RootViewController.swift ChatGPTClient.xcodeproj/project.pbxproj

      - name: Simulator compile
        run: xcodebuild -project ChatGPTClient.xcodeproj -scheme ChatGPTClient -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

      - name: Commit b92 product
        run: |
          git config user.name white-shark-ssw
          git config user.email houstools@gmail.com
          git add ChatGPTClient/RootViewController.swift ChatGPTClient.xcodeproj/project.pbxproj
          git commit -m 'b92: restore covered executor presentation'
          git push origin HEAD:dev/send-stream-20260829
