name: b78 guarded assembly

on:
  push:
    branches:
      - tooling/dev-send-stream-b78-assembly-20260901
    paths:
      - ".github/workflows/b78-assembly.yml"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact final presentation patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("ChatGPTClient/Conversation/ConversationFeature.swift")
          text = p.read_text()
          replacements = [
              ('        let toolAttributes: [NSAttributedString.Key: Any] = [.font: toolFont, .foregroundColor: UIColor.label, .paragraphStyle: toolParagraph]\n        for item in timeline {', '        let toolAttributes: [NSAttributedString.Key: Any] = [.font: toolFont, .foregroundColor: UIColor.label, .paragraphStyle: toolParagraph]\n        var separatorAttributes: [NSAttributedString.Key: Any]?\n        for item in timeline {'),
              ('            if output.length > 0 { output.append(NSAttributedString(string: "\\n", attributes: reasoningAttributes)) }', '            if output.length > 0, let separatorAttributes { output.append(NSAttributedString(string: "\\n", attributes: separatorAttributes)) }'),
              ('            case .reasoning:\n                output.append(NSAttributedString(string: normalized, attributes: reasoningAttributes))\n            case .tool:', '            case .reasoning:\n                output.append(NSAttributedString(string: normalized, attributes: reasoningAttributes))\n                separatorAttributes = reasoningAttributes\n            case .tool:'),
              ('                appendToolIcon(item.toolIconKind, to: output)\n                if output.length > start { output.append(NSAttributedString(string: "  ", attributes: toolAttributes)) }', '                appendToolIcon(item.toolIconKind, to: output)\n                if output.length > start {\n                    output.addAttributes(toolAttributes, range: NSRange(location: start, length: output.length - start))\n                    output.append(NSAttributedString(string: "  ", attributes: toolAttributes))\n                }'),
              ('                if let slot = item.toolSlot, let url = URL(string: "chatgpt-tool-list://slot/\\(slot)") { output.addAttribute(.link, value: url, range: NSRange(location: start, length: output.length - start)) }\n            }', '                if let slot = item.toolSlot, let url = URL(string: "chatgpt-tool-list://slot/\\(slot)") { output.addAttribute(.link, value: url, range: NSRange(location: start, length: output.length - start)) }\n                separatorAttributes = toolAttributes\n            }')
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one exact match, found {count}: {old[:100]!r}")
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY

      - name: Exact scope and diff check
        shell: bash
        run: |
          git diff --check
          actual="$(git diff --name-only)"
          test "$actual" = "ChatGPTClient/Conversation/ConversationFeature.swift" || { echo "Unexpected scope: $actual"; exit 1; }

      - name: Xcode 16.4 Simulator build
        shell: bash
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          xcodebuild -project ChatGPTClient.xcodeproj -scheme ChatGPTClient -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

      - name: Commit validated presentation patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ChatGPTClient/Conversation/ConversationFeature.swift
          git commit -m "dev: finalize b78 tool presentation geometry"
          git push origin HEAD:${GITHUB_REF_NAME}
