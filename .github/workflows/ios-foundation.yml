          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ChatGPTClient/Conversation/ConversationFeature.swift ChatGPTClient/RootViewController.swift ChatGPTClient.xcodeproj/project.pbxproj
          git commit -m "fix(send): adopt authoritative Detail reasoning blocks"
          git push origin HEAD:dev/send-stream-20260829
