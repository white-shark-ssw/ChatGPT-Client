name: Stage b87 activation diagnostics

on:
  push:
    branches:
      - staging/send-stream-b87-activation-20260902
    paths:
      - ".github/workflows/stage-b87-activation.yml"

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply guarded patch
        run: |
          python3 scripts/research/patch_b87_activation_diagnostics.py
          git diff --check
          test "$(grep -c 'CURRENT_PROJECT_VERSION = 87;' ChatGPTClient.xcodeproj/project.pbxproj)" -eq 2
          test "$(grep -c 'DIAGNOSTICS_CANDIDATE = \"DEV-send-stream-0.1.0-b87\";' ChatGPTClient.xcodeproj/project.pbxproj)" -eq 2
          grep -q 'coveredExecutor.pageActivation' ChatGPTClient/RootViewController.swift
          grep -q 'coveredExecutor.webViewActivation' ChatGPTClient/RootViewController.swift
      - name: Commit staged product blobs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ChatGPTClient/RootViewController.swift ChatGPTClient.xcodeproj/project.pbxproj
          git diff --cached --check
          git commit -m "diag(send): stage b87 activation state probes"
          git push origin HEAD:staging/send-stream-b87-activation-20260902
