name: cross-platform realtime priority docs

on:
  push:
    branches:
      - dev/send-stream-20260829
    paths:
      - ".github/workflows/cross-platform-priority-docsync.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/send-stream-20260829
          fetch-depth: 0
      - name: Update selected checkpoint and state
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          checkpoint = Path('docs/project/current/dev/DEV-send-stream.md')
          s = checkpoint.read_text()
          old = '**Active — exact b95 hard Reload is Runtime Positive as a deliberate recovery path, but automatic external terminal/final convergence remains insufficient. b95 again proves foreground full-page rebootstrap can restart page-owned continuation and did not reproduce WebContent termination, while prior b94 still prevents calling repeated/heavy full-page Web stable. The strongest next architecture hypothesis is a server-issued Web->Native continuation handoff for client-owned turns, with separate proof required for cross-device already-active turns. Stable/Frozen Send remains No.**'
          new = '**Active — exact b95 hard Reload is Runtime Positive as a deliberate recovery path, but automatic external terminal/final convergence remains insufficient. Latest user priority is cross-platform late-join continuation first: official iOS is explicitly reported able to continue a response initiated on another platform, so the immediate gate is to observe and reproduce the official native late-join realtime registration/topic/update path. Client-owned Web->Native handoff remains recorded but is secondary until this cross-platform path is resolved. Stable/Frozen Send remains No.**'
          assert old in s
          s = s.replace(old, new, 1)
          marker = '## Cross-platform late-join priority override — 2026-09-04'
          assert marker not in s
          s += '''\n\n## Cross-platform late-join priority override — 2026-09-04\n\nLatest explicit user direction prioritizes the existing cross-platform automatic-disconnect defect over client-owned handoff research. Treat the user's current observation that official ChatGPT iOS can join/continue another platform's active response as the highest-priority Runtime fact. This proves a late-join capability exists somewhere in the official service/client stack; it does not yet identify its transport or authorize guessing it.\n\nReuse the already-built privacy-safe official-iOS realtime Probe instead of modifying ChatGPTClient product code. The decisive observer and TrollStore packaging path already exist and statically match official native realtime types (`WebSocketConversationEventsService`, `WebSocketConversationObserver`, `WebSocketRegisterResponse.websocketURL`, `WebSocketTopic`, `SubscribePayload`, conversation-update/add-messages/async-status events).\n\nRe-materialized research package identity is recorded in `docs/project/runtime-evidence/DEV-send-stream-cross-platform-late-join-priority-20260904.md`: official source ZIP `sha256:bb11734434bee912355b1435930ee2a2e3b1078d42049a59649fd8d500938a80`; chained Probe dylib `sha256:0d20cf4761a982612fab995ed8766a887064005a561726c603edceea6072285e`; research IPA `ChatGPT-Official-RealtimeProbe-TrollStore-20260904.ipa`, `sha256:dd40dd092853f1e4dd4e52c560df0f1b24df18ebd47ca44015065442864ba555`. This is research tooling, not a product Candidate; b96 remains unallocated.\n\n**Next exact action:** install/run the re-materialized official iOS realtime Probe, start a deliberately long response from another platform in the target project conversation, export `ChatGPTRealtimeProbe.jsonl`, and identify the first target-matching registration/subscribe/topic/update/catchup/live event before terminal. Analyze that evidence before allocating b96 or changing ChatGPTClient product code. No guessed topic/offset/resume, fixed polling, retry/watchdog/timer, duplicate Send, WebSocket-body authority or second response store.\n'''
          checkpoint.write_text(s)

          state = Path('docs/project/PROJECT_STATE.md')
          s = state.read_text()
          block = '''## DEV-send-stream cross-platform late-join priority override — 2026-09-04\n\n- Latest explicit priority is to solve cross-platform automatic continuation interruption first. User reports official ChatGPT iOS can continue an answer initiated on another platform; treat that as current highest-priority Runtime evidence of an official late-join capability.\n- Immediate gate is research-only observation of the official native realtime path, using the already-built privacy-safe injected Probe. Client-owned Web->Native handoff remains secondary until the cross-platform path is identified.\n- Re-materialized official research IPA: `ChatGPT-Official-RealtimeProbe-TrollStore-20260904.ipa`, SHA `dd40dd092853f1e4dd4e52c560df0f1b24df18ebd47ca44015065442864ba555`; source official ZIP SHA `bb11734434bee912355b1435930ee2a2e3b1078d42049a59649fd8d500938a80`; Probe dylib SHA `0d20cf4761a982612fab995ed8766a887064005a561726c603edceea6072285e`. Research tooling only; no b96 allocated.\n- Next evidence must reveal actual current-account registration/subscribe/topic/offset/conversation-update semantics before product implementation. `ConversationRepository` remains Native content authority.\n\n'''
          assert block.splitlines()[0] not in s
          assert s.startswith('# Project State\n\n')
          s = s.replace('# Project State\n\n', '# Project State\n\n' + block, 1)
          state.write_text(s)
          PY
          git diff --check
          CHANGED="$(git diff --name-only | sort)"
          EXPECTED=$'docs/project/PROJECT_STATE.md\ndocs/project/current/dev/DEV-send-stream.md'
          test "$CHANGED" = "$EXPECTED"
          git config user.name "OpenAI cross-platform docs"
          git config user.email "cross-platform-docs@users.noreply.github.com"
          git add docs/project/PROJECT_STATE.md docs/project/current/dev/DEV-send-stream.md
          git commit -m "docs: prioritize cross-platform late-join realtime [skip ci]"
          git push origin HEAD:dev/send-stream-20260829
