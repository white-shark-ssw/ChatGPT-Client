name: Update b86 runtime index

on:
  push:
    branches:
      - dev/send-stream-20260829
    paths:
      - ".github/workflows/docs-b86-index.yml"

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch exact b86 row
        run: |
          python3 scripts/research/update_b86_index_runtime.py
          git diff --check
      - name: Commit index update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/project/BUILD_TEST_INDEX.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs(send): qualify b86 runtime in index"
          git push origin HEAD:dev/send-stream-20260829
