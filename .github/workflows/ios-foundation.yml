# Candidate: DEV-send-stream-0.1.0-b115
# Product source: 2346c2d4ab26d40ef720b7850ae34316acb3cc62
# Runtime correction: authoritative/live user ownership + active Sync/Reload availability; preserve b114 follow-tail.
# Candidate packaging is explicit-only. Ordinary development validation runs through ios-simulator-preflight.yml first.
name: iOS Candidate Package b115

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard exact b115 product and inherited owners
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 2346c2d4ab26d40ef720b7850ae34316acb3cc62 HEAD
          git diff --quiet 2346c2d4ab26d40ef720b7850ae34316acb3cc62 HEAD -- ChatGPTClient.xcodeproj/project.pbxproj ChatGPTClient/Conversation/ConversationFeature.swift ChatGPTClient/RootViewController.swift
          test "$(grep -c 'CURRENT_PROJECT_VERSION = 115;' ChatGPTClient.xcodeproj/project.pbxproj)" = "2"
          test "$(grep -c 'DIAGNOSTICS_CANDIDATE = \"DEV-send-stream-0.1.0-b115\";' ChatGPTClient.xcodeproj/project.pbxproj)" = "2"
          grep -Fq 'let canSync = selectedID != nil && !recoveryInProgress' ChatGPTClient/Conversation/ConversationFeature.swift
          grep -Fq 'let canReload = selectedID != nil' ChatGPTClient/Conversation/ConversationFeature.swift
          ! grep -q 'conversation.detailReload.blocked' ChatGPTClient/Conversation/ConversationFeature.swift
          ! grep -Fq 'snapshot.phase.isActive, !snapshot.promptText.isEmpty { return }' ChatGPTClient/Conversation/ConversationFeature.swift
          grep -Fq 'let authoritativeSuffixStart = min(snapshot.baselineVisibleMessageCount, messages.count)' ChatGPTClient/Conversation/ConversationFeature.swift
          grep -Fq 'let authoritativeUserMaterialized = !snapshot.promptText.isEmpty && messages.dropFirst(authoritativeSuffixStart).contains { $0.role == .user }' ChatGPTClient/Conversation/ConversationFeature.swift
          grep -Fq 'fields["liveUserPresentationCount"]' ChatGPTClient/Conversation/ConversationFeature.swift
          grep -q 'scrollAnchor.followTailPreserved' ChatGPTClient/Conversation/ConversationFeature.swift
          ! grep -q 'assistantChunkColor.willDisplay' ChatGPTClient/Conversation/ConversationFeature.swift
          ! grep -q 'assistantChunkRender.afterDisplay' ChatGPTClient/Conversation/ConversationFeature.swift
          grep -Fq 'enum ConversationMessageRichTextRenderer' ChatGPTClient/Conversation/ConversationFeature.swift
          grep -Fq 'static let userReuseIdentifier = "ConversationMessageCell.user"' ChatGPTClient/Conversation/ConversationFeature.swift
          grep -Fq 'static let assistantReuseIdentifier = "ConversationMessageCell.assistant"' ChatGPTClient/Conversation/ConversationFeature.swift
          grep -q 'acceptedClientStreamEndedWithoutTerminal' ChatGPTClient/RootViewController.swift
          grep -q 'manualSync.clientLiveReconciled' ChatGPTClient/RootViewController.swift
          grep -q 'policy.*no_resend_same_generation' ChatGPTClient/RootViewController.swift
          test ! -e ChatGPTClient/Protocol/CoveredWebProcessKillProbe.swift
          ! grep -R -q '_killWebContentProcessAndResetState' ChatGPTClient

      - name: Toolchain
        run: xcodebuild -version

      - name: Build unsigned TrollStore IPA candidate
        run: bash scripts/build_ipa.sh

      - name: Inspect artifact
        run: |
          ls -lh build/artifacts
          unzip -l build/artifacts/*.ipa | head -n 40

      - name: Upload IPA candidate
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPTClient-DEV-send-stream-0.1.0-b115
          path: |
            build/artifacts/*.ipa
            build/artifacts/*.sha256
          if-no-files-found: error
          retention-days: 14
