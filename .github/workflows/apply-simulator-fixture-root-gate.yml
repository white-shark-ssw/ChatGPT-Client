name: Apply simulator fixture Root gate

on:
  push:
    branches:
      - dev/simulator-test-baseline-20261009
    paths:
      - .github/workflows/apply-simulator-fixture-root-gate.yml

permissions:
  contents: write

jobs:
  patch-root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact fixture isolation gate and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("ChatGPTClient/RootViewController.swift")
          text = path.read_text()
          needle = '''    private func observeExternalResponseIfNeeded(conversationID: String, forcePageReload: Bool = false, preservedClientGeneration: Int? = nil) {\n        guard repository.selectedConversationID == conversationID else { return }\n'''
          replacement = '''    private func observeExternalResponseIfNeeded(conversationID: String, forcePageReload: Bool = false, preservedClientGeneration: Int? = nil) {\n#if DEBUG\n        if SimulatorFixtureTransport.isEnabled { return }\n#endif\n        guard repository.selectedConversationID == conversationID else { return }\n'''
          if text.count(needle) != 1:
              raise SystemExit(f"Expected exactly one Root observer needle, found {text.count(needle)}")
          path.write_text(text.replace(needle, replacement, 1))
          PY
          rm .github/workflows/apply-simulator-fixture-root-gate.yml
          git diff --check
          git diff -- ChatGPTClient/RootViewController.swift .github/workflows/apply-simulator-fixture-root-gate.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ChatGPTClient/RootViewController.swift .github/workflows/apply-simulator-fixture-root-gate.yml
          git commit -m "test: isolate external Web observer in simulator fixtures"
          git push
