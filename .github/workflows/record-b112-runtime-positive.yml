name: Record b112 Runtime Positive

"on":
  push:
    branches:
      - dev/send-stream-20260829
    paths:
      - ".github/workflows/record-b112-runtime-positive.yml"

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout guarded branch
        uses: actions/checkout@v4
        with:
          ref: dev/send-stream-20260829
          fetch-depth: 0

      - name: Guard exact b112 package and docs-only update
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor abaf3cd4cd902f42d2f8ad2836a4e17115a78389 HEAD
          git diff --quiet abaf3cd4cd902f42d2f8ad2836a4e17115a78389 HEAD -- ChatGPTClient.xcodeproj/project.pbxproj ChatGPTClient/Conversation/ConversationFeature.swift ChatGPTClient/RootViewController.swift
          test "$(grep -c 'CURRENT_PROJECT_VERSION = 112;' ChatGPTClient.xcodeproj/project.pbxproj)" = "2"
          test "$(grep -c 'DIAGNOSTICS_CANDIDATE = \"DEV-send-stream-0.1.0-b112\";' ChatGPTClient.xcodeproj/project.pbxproj)" = "2"
          ! grep -q 'DEV-send-stream-0.1.0-b113' docs/project/BUILD_TEST_INDEX.md
          test -f scripts/staging/record_b112_runtime_positive.py

      - name: Record b112 Human Runtime result
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/staging/record_b112_runtime_positive.py
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' docs/project/BUILD_TEST_INDEX.md docs/project/MODULE_STATUS.md docs/project/PROJECT_PROFILE.md docs/project/PROJECT_SPECIFIC_RULES.md docs/project/PROJECT_STATE.md docs/project/TECHNICAL_DECISIONS.md docs/project/current/dev/DEV-send-stream-round7-runtime-addendum.md | sort)"
          test "$changed" = "$expected"
          grep -q '36fd01529ee522fd0646f7bdf6e6f409dca3f55a4b17ff21c88e4e19d16e23b2' docs/project/BUILD_TEST_INDEX.md
          grep -q 'b112 Human Runtime Positive — role-isolated reuse color fix' docs/project/current/dev/DEV-send-stream-round7-runtime-addendum.md
          grep -q 'Message-cell role reuse isolation — Runtime accepted b112' docs/project/PROJECT_SPECIFIC_RULES.md
          ! grep -q 'DEV-send-stream-0.1.0-b113' docs/project/BUILD_TEST_INDEX.md

      - name: Commit durable Runtime truth
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/project/BUILD_TEST_INDEX.md docs/project/MODULE_STATUS.md docs/project/PROJECT_PROFILE.md docs/project/PROJECT_SPECIFIC_RULES.md docs/project/PROJECT_STATE.md docs/project/TECHNICAL_DECISIONS.md docs/project/current/dev/DEV-send-stream-round7-runtime-addendum.md
          git commit -m "docs: record b112 runtime positive"
          git push origin HEAD:dev/send-stream-20260829
