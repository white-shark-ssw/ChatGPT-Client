name: Record b107 Package Evidence

"on":
  push:
    branches:
      - dev/send-stream-20260829
    paths:
      - ".github/workflows/record-b107-package-evidence.yml"

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout guarded branch
        uses: actions/checkout@v4
        with:
          ref: dev/send-stream-20260829
          fetch-depth: 0

      - name: Guard canonical b107 package and post-package evidence scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 4bd3501a3092dfe7aad7ea836ba0cb8e42b0d65f HEAD
          grep -q 'CURRENT_PROJECT_VERSION = 107;' ChatGPTClient.xcodeproj/project.pbxproj
          grep -q 'DIAGNOSTICS_CANDIDATE = "DEV-send-stream-0.1.0-b107";' ChatGPTClient.xcodeproj/project.pbxproj
          grep -q 'acceptedClientStreamEndedWithoutTerminal' ChatGPTClient/RootViewController.swift
          grep -q 'manualSync.clientLiveReconciled' ChatGPTClient/RootViewController.swift
          git diff --quiet 4bd3501a3092dfe7aad7ea836ba0cb8e42b0d65f...HEAD -- ChatGPTClient ChatGPTClient.xcodeproj .github/workflows/ios-foundation.yml scripts/build_ipa.sh scripts/reconstruct_app_icon.sh scripts/assets
          allowed=$'.github/workflows/record-b107-package-evidence.yml\ndocs/project/BUILD_TEST_INDEX.md\ndocs/project/MODULE_STATUS.md\ndocs/project/PROJECT_PROFILE.md\ndocs/project/PROJECT_SPECIFIC_RULES.md\ndocs/project/PROJECT_STATE.md\ndocs/project/TECHNICAL_DECISIONS.md\ndocs/project/WEB_SEND_ADAPTER.md\ndocs/project/current/dev/DEV-send-stream-round7-runtime-addendum.md\nscripts/staging/record_b107_package_evidence.py'
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            printf '%s\n' "$allowed" | grep -Fxq "$path"
          done < <(git diff --name-only 4bd3501a3092dfe7aad7ea836ba0cb8e42b0d65f...HEAD)

      - name: Record exact b107 evidence
        run: python3 scripts/staging/record_b107_package_evidence.py

      - name: Validate docs-only scope and markers
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          allowed=$'docs/project/BUILD_TEST_INDEX.md\ndocs/project/MODULE_STATUS.md\ndocs/project/PROJECT_PROFILE.md\ndocs/project/PROJECT_SPECIFIC_RULES.md\ndocs/project/PROJECT_STATE.md\ndocs/project/TECHNICAL_DECISIONS.md\ndocs/project/WEB_SEND_ADAPTER.md\ndocs/project/current/dev/DEV-send-stream-round7-runtime-addendum.md'
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            printf '%s\n' "$allowed" | grep -Fxq "$path"
          done <<< "$changed"
          grep -q 'DEV-send-stream-0.1.0-b107' docs/project/BUILD_TEST_INDEX.md
          grep -q '9967821935' docs/project/BUILD_TEST_INDEX.md
          grep -q '7195d89cb9837efc3386c5dd7e030e7f11f10233689416e59c86d1ae4cf055cd' docs/project/BUILD_TEST_INDEX.md
          grep -q 'b107 accepted-SSE EOF convergence — package ready' docs/project/current/dev/DEV-send-stream-round7-runtime-addendum.md
          grep -q 'Covered executor emits `.acceptedClientStreamEndedWithoutTerminal`' docs/project/current/dev/DEV-send-stream-round7-runtime-addendum.md
          grep -q 'Accepted client SSE clean-EOF recovery — b107' docs/project/PROJECT_SPECIFIC_RULES.md

      - name: Commit durable b107 evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/project/BUILD_TEST_INDEX.md docs/project/MODULE_STATUS.md docs/project/PROJECT_PROFILE.md docs/project/PROJECT_SPECIFIC_RULES.md docs/project/PROJECT_STATE.md docs/project/TECHNICAL_DECISIONS.md docs/project/WEB_SEND_ADAPTER.md docs/project/current/dev/DEV-send-stream-round7-runtime-addendum.md
          if git diff --cached --quiet; then
            echo 'No durable evidence changes required.'
            exit 0
          fi
          git commit -m "docs: record b107 package evidence"
          git push origin HEAD:dev/send-stream-20260829
