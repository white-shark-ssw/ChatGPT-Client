name: Record b115 Runtime Menu Issue

on:
  push:
    branches:
      - dev/send-stream-20260829
    paths:
      - ".github/workflows/record-b115-runtime-menu-issue.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout guarded branch
        uses: actions/checkout@v4
        with:
          ref: dev/send-stream-20260829
          fetch-depth: 0

      - name: Guard canonical b115 product and no b116 allocation
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 2dc0a4155f3549f32b1b08a9e4d8e6fb87495692 HEAD
          git diff --quiet 2dc0a4155f3549f32b1b08a9e4d8e6fb87495692 HEAD -- ChatGPTClient.xcodeproj/project.pbxproj ChatGPTClient/Conversation/ConversationFeature.swift ChatGPTClient/RootViewController.swift
          test "$(grep -c 'CURRENT_PROJECT_VERSION = 115;' ChatGPTClient.xcodeproj/project.pbxproj)" = "2"
          test "$(grep -c 'DIAGNOSTICS_CANDIDATE = \"DEV-send-stream-0.1.0-b115\";' ChatGPTClient.xcodeproj/project.pbxproj)" = "2"
          ! grep -R -q 'DEV-send-stream-0.1.0-b116' docs/project ChatGPTClient.xcodeproj/project.pbxproj
          test -f scripts/staging/record_b115_runtime_menu_issue.py

      - name: Record Runtime evidence and deferred issue
        run: python3 scripts/staging/record_b115_runtime_menu_issue.py

      - name: Validate docs-only scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' docs/project/BUILD_TEST_INDEX.md docs/project/MODULE_STATUS.md docs/project/PROJECT_PROFILE.md docs/project/PROJECT_STATE.md docs/project/current/dev/DEV-send-stream-round7-runtime-addendum.md | sort)"
          test "$changed" = "$expected"
          grep -q 'b115 Human Runtime partial + deferred open-menu dismissal' docs/project/current/dev/DEV-send-stream-round7-runtime-addendum.md
          grep -q 'menu-persistence defect deferred without b116 allocation' docs/project/BUILD_TEST_INDEX.md

      - name: Commit durable Runtime record
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/project/BUILD_TEST_INDEX.md docs/project/MODULE_STATUS.md docs/project/PROJECT_PROFILE.md docs/project/PROJECT_STATE.md docs/project/current/dev/DEV-send-stream-round7-runtime-addendum.md
          git commit -m "docs: record b115 runtime menu issue"
          git push origin HEAD:dev/send-stream-20260829
