              print('b85 product identity already staged; no-op')
              raise SystemExit(0)

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              return text.replace(old, new, 1)

          feature = replace_once(feature, '''struct ConversationDetail {
              let id: String
              let title: String
              let currentNodeID: String
              let messages: [ConversationMessage]
          }''', '''struct ConversationDetail {
              let id: String
              let title: String
              let currentNodeID: String
              let messages: [ConversationMessage]
              let trailingResponseTimeline: [ConversationResponseTimelineItem]
              let trailingReasoningDurationSeconds: Int?
          }''', 'ConversationDetail fields')

          feature = replace_once(feature, '''            let detail = ConversationDetail(id: id, title: title, currentNodeID: currentNode, messages: messages)''', '''            let detail = ConversationDetail(id: id, title: title, currentNodeID: currentNode, messages: messages, trailingResponseTimeline: projection.trailingResponseTimeline, trailingReasoningDurationSeconds: projection.trailingReasoningDurationSeconds)''', 'ConversationDetail construction')

          feature = replace_once(feature, '''    private static func parseCurrentBranch(mapping: [String: Any], currentNode: String) -> (messages: [ConversationMessage], filteredRecipientMessageCount: Int, trailingTimelineItemCount: Int, trailingReasoningItemCount: Int, trailingToolItemCount: Int, thinkingPreambleMessageCount: Int, ignoredThoughtsMessageCount: Int, ignoredInlineCotMessageCount: Int) {''', '''    private static func parseCurrentBranch(mapping: [String: Any], currentNode: String) -> (messages: [ConversationMessage], filteredRecipientMessageCount: Int, trailingResponseTimeline: [ConversationResponseTimelineItem], trailingReasoningDurationSeconds: Int?, trailingTimelineItemCount: Int, trailingReasoningItemCount: Int, trailingToolItemCount: Int, thinkingPreambleMessageCount: Int, ignoredThoughtsMessageCount: Int, ignoredInlineCotMessageCount: Int) {''', 'parseCurrentBranch signature')

          feature = replace_once(feature, '''    return (messages, filteredRecipientMessageCount, pendingTimeline.count, trailingReasoningItemCount, trailingToolItemCount, thinkingPreambleMessageCount, ignoredThoughtsMessageCount, ignoredInlineCotMessageCount)''', '''    return (messages, filteredRecipientMessageCount, pendingTimeline, pendingReasoningDurationSeconds, pendingTimeline.count, trailingReasoningItemCount, trailingToolItemCount, thinkingPreambleMessageCount, ignoredThoughtsMessageCount, ignoredInlineCotMessageCount)''', 'parseCurrentBranch return')

          feature = replace_once(feature, '''        let previousMessages = messages
        let previousLatestUserID = previousMessages.last(where: { $0.role == .user })?.id
        let hadLoadedDetail = repository.selectedConversation?.id == id''', '''        let previousMessages = messages
        let previousLatestUserID = previousMessages.last(where: { $0.role == .user })?.id
        let previousTrailingTimeline = repository.selectedConversation?.trailingResponseTimeline ?? []
        let hadLoadedDetail = repository.selectedConversation?.id == id''', 'manual Sync previous trailing timeline')

          feature = replace_once(feature, '''            case .success(let detail):
                let changed = self.hasVisibleMessageChanges(from: previousMessages, to: detail.messages)
                let latestUserChanged = detail.messages.last(where: { $0.role == .user })?.id != previousLatestUserID
                _ = self.repository.clearTerminalExternalLiveResponseAfterAuthoritativeRefresh(conversationID: id)
                self.apply(detail) { [weak self] in''', '''            case .success(let detail):
                let changed = self.hasVisibleMessageChanges(from: previousMessages, to: detail.messages) || previousTrailingTimeline != detail.trailingResponseTimeline
                let latestUserChanged = detail.messages.last(where: { $0.role == .user })?.id != previousLatestUserID
                _ = self.repository.clearTerminalExternalLiveResponseAfterAuthoritativeRefresh(conversationID: id)
                _ = self.repository.adoptExternalAuthoritativeDetailTimeline(conversationID: id, timeline: detail.trailingResponseTimeline, reasoningDurationSeconds: detail.trailingReasoningDurationSeconds, authoritativeVisibleMessageCount: detail.messages.count, latestVisibleRole: detail.messages.last?.role)
                self.apply(detail) { [weak self] in''', 'manual Sync Detail adoption')

          feature = replace_once(feature, '''    private func updateConversationMenu() {
        let selectedID = repository.selectedConversationID
        let operationKind = selectedID.flatMap { repository.detailOperationSnapshot(for: $0)?.kind }
        let recoveryInProgress = operationKind == .sync || operationKind == .reload
        let canRecover = selectedID != nil && !recoveryInProgress
        let recoveryAttributes: UIMenuElement.Attributes = canRecover ? [] : [.disabled]
        let syncAction = UIAction(title: "同步最新消息", image: UIImage(systemName: "arrow.triangle.2.circlepath"), attributes: recoveryAttributes) { [weak self] _ in self?.syncLatestMessages() }
        let reloadAction = UIAction(title: "重载当前会话", image: UIImage(systemName: "arrow.clockwise"), attributes: recoveryAttributes) { [weak self] _ in self?.reloadCurrentConversation() }
        navigationItem.rightBarButtonItem = UIBarButtonItem(title: nil, image: UIImage(systemName: "ellipsis.circle"), primaryAction: nil, menu: UIMenu(children: [syncAction, reloadAction]))
    }''', '''    private func updateConversationMenu() {
        let selectedID = repository.selectedConversationID
        let operationKind = selectedID.flatMap { repository.detailOperationSnapshot(for: $0)?.kind }
        let recoveryInProgress = operationKind == .sync || operationKind == .reload
        let liveSnapshot = selectedID.flatMap { repository.liveResponse(for: $0) }
        let responseActive = liveSnapshot?.phase.isActive == true
        let localResponseActive = responseActive && !(liveSnapshot?.promptText.isEmpty ?? true)
        let canSync = selectedID != nil && !recoveryInProgress && !localResponseActive
        let canReload = selectedID != nil && !recoveryInProgress && !responseActive
        let syncAttributes: UIMenuElement.Attributes = canSync ? [] : [.disabled]
        let reloadAttributes: UIMenuElement.Attributes = canReload ? [] : [.disabled]
        let syncAction = UIAction(title: "同步最新消息", image: UIImage(systemName: "arrow.triangle.2.circlepath"), attributes: syncAttributes) { [weak self] _ in self?.syncLatestMessages() }
        let reloadAction = UIAction(title: "重载当前会话", image: UIImage(systemName: "arrow.clockwise"), attributes: reloadAttributes) { [weak self] _ in self?.reloadCurrentConversation() }
        navigationItem.rightBarButtonItem = UIBarButtonItem(title: nil, image: UIImage(systemName: "ellipsis.circle"), primaryAction: nil, menu: UIMenu(children: [syncAction, reloadAction]))
    }''', 'recovery menu response-source rules')

          feature = replace_once(feature, '''    private func syncLatestMessages() {
        guard let id = repository.selectedConversationID else { return }
        if let kind = repository.detailOperationSnapshot(for: id)?.kind, kind == .sync || kind == .reload { return }''', '''    private func syncLatestMessages() {
        guard let id = repository.selectedConversationID else { return }
        if let snapshot = repository.liveResponse(for: id), snapshot.phase.isActive, !snapshot.promptText.isEmpty { return }
        if let kind = repository.detailOperationSnapshot(for: id)?.kind, kind == .sync || kind == .reload { return }''', 'manual Sync local-response guard')

          feature = replace_once(feature, '''    @objc private func reloadCurrentConversation() {
        guard let id = repository.selectedConversationID else { return }
        if let kind = repository.detailOperationSnapshot(for: id)?.kind, kind == .sync || kind == .reload { return }''', '''    @objc private func reloadCurrentConversation() {
        guard let id = repository.selectedConversationID else { return }
        guard !repository.isLiveResponseActive(for: id) else { return }
        if let kind = repository.detailOperationSnapshot(for: id)?.kind, kind == .sync || kind == .reload { return }''', 'Reload active-response guard')

          feature = replace_once(feature, '''    diagnostics.info(category: "ui", name: "liveResponse.presentationApplied", fields: fields)
}''', '''    diagnostics.info(category: "ui", name: "liveResponse.presentationApplied", fields: fields)
    updateConversationMenu()
}''', 'live response menu refresh')

          insertion_point = '''    func consumeExternalConversationSnapshot(_ serviceMessages: [[String: Any]], conversationID: String, generation: Int) {'''
          adoption_method = '''    @discardableResult
    func adoptExternalAuthoritativeDetailTimeline(conversationID: String, timeline: [ConversationResponseTimelineItem], reasoningDurationSeconds: Int?, authoritativeVisibleMessageCount: Int, latestVisibleRole: ConversationMessage.Role?) -> Int? {
        precondition(Thread.isMainThread)
        if timeline.isEmpty {
            guard let snapshot = responseRuntime.snapshots[conversationID], snapshot.phase.isActive, snapshot.promptText.isEmpty else { return nil }
            guard authoritativeVisibleMessageCount > snapshot.baselineVisibleMessageCount, latestVisibleRole == .assistant else { return snapshot.generation }
            responseRuntime.snapshots.removeValue(forKey: conversationID)
            var fields = diagnosticsFields(for: conversationID)
            fields["responseGeneration"] = String(snapshot.generation)
            fields["authoritativeVisibleMessageCount"] = String(authoritativeVisibleMessageCount)
            fields["baselineVisibleMessageCount"] = String(snapshot.baselineVisibleMessageCount)
            fields["reason"] = "authoritative_assistant_materialized"
            DiagnosticsLogger.shared.info(category: "conversation", name: "liveResponse.externalDetailReconciled", fields: fields)
            responseRuntime.onChange?(conversationID)
            return nil
        }

        if let active = responseRuntime.snapshots[conversationID], active.phase.isActive, !active.promptText.isEmpty {
            var fields = diagnosticsFields(for: conversationID)
            fields["responseGeneration"] = String(active.generation)
            fields["reason"] = "client_owned_response_active"
            DiagnosticsLogger.shared.info(category: "conversation", name: "liveResponse.externalDetailDiscarded", fields: fields)
            return nil
        }

        let generation: Int
        var snapshot: ConversationLiveResponseSnapshot
        if let active = responseRuntime.snapshots[conversationID], active.phase.isActive, active.promptText.isEmpty {
            generation = active.generation
            snapshot = active
        } else {
            generation = (responseRuntime.generations[conversationID] ?? 0) + 1
            responseRuntime.generations[conversationID] = generation
            snapshot = ConversationLiveResponseSnapshot(generation: generation, conversationID: conversationID, baselineVisibleMessageCount: authoritativeVisibleMessageCount, promptText: "", phase: .reasoning, timeline: [], finalText: "", reasoningEnded: false, reasoningDurationSeconds: nil, failureReason: nil)
            var fields = diagnosticsFields(for: conversationID)
            fields["responseGeneration"] = String(generation)
            fields["phase"] = ConversationLiveResponsePhase.reasoning.rawValue
            fields["source"] = "external_authoritative_detail"
            fields["baselineVisibleMessageCount"] = String(authoritativeVisibleMessageCount)
            DiagnosticsLogger.shared.info(category: "conversation", name: "liveResponse.started", fields: fields)
        }

        let changed = snapshot.phase != .reasoning || snapshot.timeline != timeline || snapshot.reasoningDurationSeconds != reasoningDurationSeconds || !snapshot.finalText.isEmpty
        snapshot.phase = .reasoning
        snapshot.timeline = timeline
        snapshot.finalText = ""
        snapshot.reasoningDurationSeconds = reasoningDurationSeconds
        snapshot.failureReason = nil
        responseRuntime.snapshots[conversationID] = snapshot
        var fields = diagnosticsFields(for: conversationID)
        fields["responseGeneration"] = String(generation)
        fields["changed"] = changed ? "true" : "false"
        fields["timelineItemCount"] = String(timeline.count)
        fields["reasoningItemCount"] = String(timeline.filter { $0.kind == .reasoning }.count)
        fields["toolCount"] = String(timeline.filter { $0.kind == .tool }.count)
        fields["source"] = "authoritative_detail"
        DiagnosticsLogger.shared.info(category: "conversation", name: "liveResponse.externalDetailSnapshot", fields: fields)
        if changed { responseRuntime.onChange?(conversationID) }
        return generation
    }

'''
          feature = replace_once(feature, insertion_point, adoption_method + insertion_point, 'external Detail adoption method')

          root = replace_once(root, '''    private func observeExternalResponseIfNeeded(conversationID: String, forcePageReload: Bool = false) {
        guard repository.selectedConversationID == conversationID, !repository.isLiveResponseActive(for: conversationID) else { return }
        let sendExecutor = executor(for: conversationID)
        var externalGeneration: Int?''', '''    private func observeExternalResponseIfNeeded(conversationID: String, forcePageReload: Bool = false) {
        guard repository.selectedConversationID == conversationID else { return }
        let existingSnapshot = repository.liveResponse(for: conversationID)
        guard existingSnapshot?.phase.isActive != true || existingSnapshot?.promptText.isEmpty == true else { return }
        let sendExecutor = executor(for: conversationID)
        var externalGeneration: Int? = existingSnapshot?.phase.isActive == true ? existingSnapshot?.generation : nil''', 'reuse external generation for page continuation')

          root = replace_once(root, '''        detailViewController.onManualLatestSyncApplied = { [weak self] id, _ in
            guard let self, self.repository.selectedConversationID == id, !self.repository.isLiveResponseActive(for: id) else { return }
            self.observeExternalResponseIfNeeded(conversationID: id, forcePageReload: true)
        }''', '''        detailViewController.onManualLatestSyncApplied = { [weak self] id, _ in
            guard let self, self.repository.selectedConversationID == id else { return }
            if let snapshot = self.repository.liveResponse(for: id), snapshot.phase.isActive, !snapshot.promptText.isEmpty { return }
            self.observeExternalResponseIfNeeded(conversationID: id, forcePageReload: true)
        }''', 'manual Sync page rearm with external Detail owner')

          root = replace_once(root, '''        let snapshot = repository.liveResponse(for: conversationID)
        let selectedResponseActive = snapshot?.phase.isActive ?? false
        validationSendButton.isEnabled = !selectedResponseActive
        validationSendButton.setTitle(selectedResponseActive ? "回答中…" : "测试发送…", for: .normal)
        detailViewController.navigationItem.rightBarButtonItem?.isEnabled = !selectedResponseActive''', '''        let snapshot = repository.liveResponse(for: conversationID)
        let selectedResponseActive = snapshot?.phase.isActive ?? false
        let localResponseActive = selectedResponseActive && !(snapshot?.promptText.isEmpty ?? true)
        validationSendButton.isEnabled = !selectedResponseActive
        validationSendButton.setTitle(selectedResponseActive ? "回答中…" : "测试发送…", for: .normal)
        detailViewController.navigationItem.rightBarButtonItem?.isEnabled = !localResponseActive''', 'external manual recovery toolbar availability')

          for old, new, label in [
              ('CURRENT_PROJECT_VERSION = 84;', 'CURRENT_PROJECT_VERSION = 85;', 'build number'),
              ('DIAGNOSTICS_CANDIDATE = "DEV-send-stream-0.1.0-b84";', 'DIAGNOSTICS_CANDIDATE = "DEV-send-stream-0.1.0-b85";', 'candidate')
          ]:
              count = project.count(old)
              if count != 2:
                  raise SystemExit(f'{label}: expected 2 matches, got {count}')
              project = project.replace(old, new)

          feature_path.write_text(feature)
          root_path.write_text(root)
          project_path.write_text(project)
          PY

          git diff --check
          grep -q 'CURRENT_PROJECT_VERSION = 85;' ChatGPTClient.xcodeproj/project.pbxproj
          grep -q 'DEV-send-stream-0.1.0-b85' ChatGPTClient.xcodeproj/project.pbxproj
          grep -q 'external_authoritative_detail' ChatGPTClient/Conversation/ConversationFeature.swift
          grep -q 'trailingResponseTimeline' ChatGPTClient/Conversation/ConversationFeature.swift

      - name: Commit exact b85 product patch
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
