name: b95 docs sync

on:
  push:
    branches:
      - dev/send-stream-20260829
    paths:
      - ".github/workflows/b95-docsync.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/send-stream-20260829
          fetch-depth: 0
      - name: Record b95 package gate and next disconnect target
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          checkpoint = Path('docs/project/current/dev/DEV-send-stream.md')
          s = checkpoint.read_text()
          old_status = '**Active — exact b94 rebootstrap is Runtime Positive but repeated/heavy covered-Web reliability is Runtime Negative. User has now restored the original hard-recovery invariant: `重载当前会话` must remain available whenever a conversation is selected, including active/stuck response and in-flight Sync/Reload states, and must reset the current conversation page/local response execution state before reloading authoritative server Detail. b95 is allocated only for this hard-reload invariant. Stable/Frozen Send remains No.**'
          new_status = '**Active — exact b95 hard Reload is packaged and awaits Human Runtime. The primary unresolved Send/Stream defect remains automatic page-owned continuation interruption: b92/b93 prove the official page loop can stop after background or browsing-context handoff; b93 focus reacquisition is insufficient; b94 full-page foreground rebootstrap can restart the loop but repeated/heavy rebootstrap ended in WebContent-process termination. Stable/Frozen Send remains No.**'
          assert old_status in s
          s = s.replace(old_status, new_status, 1)
          anchor = '- b94 IPA SHA-256: `a0d3de344f18f75e0286f26c27b9ea0c89548bed6a75bff4bb3369ee7bcfaffb`\n'
          identity = '''- b95 Candidate / Build: `DEV-send-stream-0.1.0-b95` / `0.1.0 (95)` permanently reserved\n- Exact b95 product commit: `ac5e621aa69f5f27ef3167b4a951812be8b8e2c2`\n- Exact b95 product/config package source: `a10320e589acd551a8dc53f56aaf28a0a08f5b4a`\n- b95 staging: `33775057479 / 100714562438` — success\n- b95 Push CI: `33775521398 / 100716116912` — success\n- b95 PR CI: `33775526525 / 100716136837` — success\n- b95 canonical Push Artifact: `9901461763`\n- b95 Artifact digest: `sha256:0378271690113e92849d87cec7bc32fa56d4ae8de4885e7003fc0ba69e26cb6a`\n- b95 IPA SHA-256: `2fd213a1dd692202b496adabd393c4130080607384e3d6c0f84cd3f975a8840d`\n'''
          assert identity.splitlines()[0] not in s
          assert anchor in s
          s = s.replace(anchor, anchor + identity, 1)
          marker = '## b95 package / validation state'
          assert marker not in s
          s += '''\n\n## b95 package / validation state\n\nExact b95 implements only the restored hard-Reload invariant. Product `ac5e621aa69f5f27ef3167b4a951812be8b8e2c2`; exact product/config package source `a10320e589acd551a8dc53f56aaf28a0a08f5b4a`. Isolated staging `33775057479 / 100714562438` passed exact three-product-file scope and Simulator compile. Formal Push CI `33775521398 / 100716116912` and PR CI `33775526525 / 100716136837` both passed. Canonical Push Artifact `9901461763` has digest `sha256:0378271690113e92849d87cec7bc32fa56d4ae8de4885e7003fc0ba69e26cb6a`. Independent unpacking verified `ChatGPTClient-0.1.0-b95-dev-send-stream.ipa`, SHA `2fd213a1dd692202b496adabd393c4130080607384e3d6c0f84cd3f975a8840d` matching sidecar, `0.1.0 (95)`, Candidate b95, source `a10320e589ac`, MinimumOS 14.0, device family `[1,2]`, `iphoneos`, arm64.\n\nEvidence ladder: **Code written / guarded exact scope + Simulator passed / Push CI passed / PR CI passed / Artifact produced / package identity independently verified / Human Runtime pending / Stable-Frozen No.**\n\n### b95 Human Runtime gate\n\nUse b95 primarily to validate recovery semantics while collecting a fresh exact log for the still-primary automatic-disconnect defect:\n\n1. Start a deliberately long project response remotely and use one explicit Sync to establish page-owned external progression.\n2. Let b95 advance automatically for several status/snapshot rounds.\n3. Trigger one already-proven interruption boundary (background/foreground, or switch away and reselect) and confirm whether page-owned `externalStreamStatusResponse` / `externalSnapshot` stops while the remote answer remains active.\n4. While the selected conversation is still active/stuck, verify `重载当前会话` remains enabled and invoke it once.\n5. Require `manualReload.hardReset`, old executor release/live snapshot reset, one replacement authoritative Detail load, then a fresh external observation only if authoritative trailing timeline is still active.\n6. Export diagnostics after observing whether automatic continuation resumes.\n\nReload Runtime success is a recovery feature only; it must not be classified as solving automatic continuation interruption.\n\n## Automatic-disconnect source conclusion after b95 package\n\nCurrent source plus b92-b94 Runtime narrows the primary defect to the lifetime of the official page-owned continuation acquisition loop. The covered bridge does not create Native polling: it only observes the official page's matching `stream_status`, `/resume`, and plural-conversation reads. When that page loop stops after background or browsing-context handoff, Repository progression therefore stops even though the remote server can keep generating. b93 proves restoring first-responder/document focus alone does not reliably restart the loop. b94 proves reloading the same official conversation page can restart it, but repeated/heavy full-page rebootstrap later terminated the WebContent process.\n\nNo b96 is allocated before b95 Human Runtime, per the artifact-to-runtime gate. Investigation may continue, but the next product candidate must remain event-driven and must not add polling, timers, retry/watchdog, Native `stream_status`/`resume`, guessed offsets, duplicate Send, WebSocket-body authority, or a second response store. The next change must reduce or replace repeated heavy page rebootstrap using evidence from an exact b95 interruption sample; do not simply add more reload triggers.\n\n**Next exact action:** Human Runtime exact b95, with one active/stuck Reload test and one fresh automatic-interruption trace. Do not modify product/config or allocate b96 before that evidence.\n'''
          checkpoint.write_text(s)

          index = Path('docs/project/BUILD_TEST_INDEX.md')
          s = index.read_text()
          row = '| `DEV-send-stream-0.1.0-b95` | `DEV-send-stream` | `0.1.0 (95)` | hard-Reload recovery product `ac5e621aa69f5f27ef3167b4a951812be8b8e2c2`; exact package source `a10320e589acd551a8dc53f56aaf28a0a08f5b4a`; PR #29 | staging `33775057479/100714562438` exact three-product-file scope+Simulator passed; Push `33775521398/100716116912` passed; PR `33775526525/100716136837` passed; canonical Artifact `9901461763`; Artifact `sha256:0378271690113e92849d87cec7bc32fa56d4ae8de4885e7003fc0ba69e26cb6a`; IPA `sha256:2fd213a1dd692202b496adabd393c4130080607384e3d6c0f84cd3f975a8840d`; package `0.1.0 (95)` / Candidate b95 / source `a10320e589ac` / iOS14 / `[1,2]` / arm64 | Runtime pending: Reload is now always enabled for a selected conversation and hard-resets executor/live/page state before authoritative Detail reload; exact b95 must also capture a fresh automatic page-loop interruption trace | **Package verified; Human Runtime pending; automatic-disconnect unresolved; Stable-Frozen No; permanently reserved** |\n'
          assert row not in s
          table_anchor = '|---|---|---|---|---|---|---|\n'
          assert table_anchor in s
          s = s.replace(table_anchor, table_anchor + row, 1)
          index.write_text(s)

          state = Path('docs/project/PROJECT_STATE.md')
          s = state.read_text()
          state_block = '''## DEV-send-stream b95 hard-Reload package-ready / disconnect priority override — 2026-09-04\n\n- Exact b95 is package-ready: product `ac5e621aa69f5f27ef3167b4a951812be8b8e2c2`; package source `a10320e589acd551a8dc53f56aaf28a0a08f5b4a`; Push/PR CI passed; canonical Artifact `9901461763`; IPA SHA `2fd213a1dd692202b496adabd393c4130080607384e3d6c0f84cd3f975a8840d`; Human Runtime pending; Stable/Frozen Send No.\n- b95 restores the user-required recovery invariant: `重载当前会话` remains available whenever a conversation is selected, including active/stuck live response and in-flight Sync/Reload states. It invalidates the current covered executor/live projection, clears the page presentation/resident Detail, then performs one authoritative server Detail reload; it does not resend/regenerate or claim to stop server generation.\n- Primary unresolved defect remains automatic page-owned continuation interruption. b92/b93 prove the official continuation loop can stop after background or browsing-context handoff; b93 focus restoration is insufficient. b94 full-page rebootstrap restarts the loop but repeated/heavy rebootstrap ended in WebContent-process termination.\n- No b96/product modification before exact b95 Human Runtime. Next evidence must distinguish the interruption boundary and recovery behavior without adding polling/timer/retry/watchdog/Native status-resume synthesis.\n\n'''
          assert state_block.splitlines()[0] not in s
          assert s.startswith('# Project State\n\n')
          s = s.replace('# Project State\n\n', '# Project State\n\n' + state_block, 1)
          state.write_text(s)

          rules = Path('docs/project/PROJECT_SPECIFIC_RULES.md')
          s = rules.read_text()
          rules_block = '''## Hard Reload recovery invariant — 2026-09-04\n\n- `重载当前会话` is an exceptional recovery control and must remain enabled whenever a current conversation is selected. Active local/external response, stuck external state, or an in-flight Sync/Reload must not disable this action.\n- Reload semantics are a conversation hard reset: invalidate/release the current covered executor/observation, clear the current Repository live-response projection without rolling its generation counter backward, clear current page presentation/resident Detail, and start one replacement authoritative Detail load. Existing detail-operation replacement ownership supersedes the older request.\n- Reload is not Send, regenerate, retry, polling, watchdog, or server Stop. It must never duplicate the prompt or claim that remote generation was cancelled.\n- After authoritative Reload succeeds, only the returned server Detail may decide whether an external live projection is rebuilt and a fresh covered observer is attached.\n- This recovery invariant does not relax the Send/continuation architecture boundary: official page owns continuation transport; `ConversationRepository` remains the sole Native response/content owner.\n\n'''
          assert rules_block.splitlines()[0] not in s
          assert s.startswith('# Project-Specific Rules\n\n')
          s = s.replace('# Project-Specific Rules\n\n', '# Project-Specific Rules\n\n' + rules_block, 1)
          rules.write_text(s)

          PY
          git diff --check
          CHANGED="$(git diff --name-only | sort)"
          EXPECTED=$'docs/project/BUILD_TEST_INDEX.md\ndocs/project/PROJECT_SPECIFIC_RULES.md\ndocs/project/PROJECT_STATE.md\ndocs/project/current/dev/DEV-send-stream.md'
          printf '%s\n' "$CHANGED"
          test "$CHANGED" = "$EXPECTED"
          git config user.name "OpenAI b95 Docs"
          git config user.email "b95-docs@users.noreply.github.com"
          git add docs/project/BUILD_TEST_INDEX.md docs/project/PROJECT_SPECIFIC_RULES.md docs/project/PROJECT_STATE.md docs/project/current/dev/DEV-send-stream.md
          git commit -m "docs: record b95 package and disconnect gate [skip ci]"
          git push origin HEAD:dev/send-stream-20260829
