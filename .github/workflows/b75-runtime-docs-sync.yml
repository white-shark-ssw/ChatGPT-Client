name: b75 runtime docs sync

on:
  push:
    branches:
      - tooling/dev-send-stream-b75-runtime-docs-20260901
    paths:
      - '.github/workflows/b75-runtime-docs-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve patcher and checkout exact formal docs head
        run: |
          cp scripts/b75_runtime_docs_sync.py /tmp/b75_runtime_docs_sync.py
          git checkout -B dev/send-stream-20260829 origin/dev/send-stream-20260829
          test "$(git rev-parse HEAD)" = 'd07cde81277d5bbb1e57d2c3f85c8772a64745c7'
      - name: Patch and audit durable runtime docs
        run: |
          python3 /tmp/b75_runtime_docs_sync.py
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' docs/project/BUILD_TEST_INDEX.md docs/project/MODULE_STATUS.md docs/project/PROJECT_STATE.md docs/project/WEB_SEND_ADAPTER.md | sort)"
          test "$changed" = "$expected"
          grep -Fq 'DEV-send-stream-0.1.0-b75' docs/project/BUILD_TEST_INDEX.md
          grep -Fq 'b75 covered-production qualification' docs/project/WEB_SEND_ADAPTER.md
          grep -Fq 'partial/rejected' docs/project/PROJECT_STATE.md
      - name: Commit docs-only runtime evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/project/BUILD_TEST_INDEX.md docs/project/MODULE_STATUS.md docs/project/PROJECT_STATE.md docs/project/WEB_SEND_ADAPTER.md
          git commit -m 'docs: record b75 runtime rejection'
          git push origin HEAD:dev/send-stream-20260829
