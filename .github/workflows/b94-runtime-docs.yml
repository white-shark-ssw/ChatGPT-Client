name: b94 Runtime docs sync

on:
  push:
    branches:
      - dev/send-stream-20260829
    paths:
      - ".github/workflows/b94-runtime-docs.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/send-stream-20260829
          fetch-depth: 0

      - name: Guard exact Runtime evidence
        run: |
          test -f docs/project/runtime-evidence/DEV-send-stream-b94-foreground-rebootstrap-web-process-terminated-20260903.md
          grep -Fq 'Exact b94 proves foreground official-page rebootstrap' docs/project/runtime-evidence/DEV-send-stream-b94-foreground-rebootstrap-web-process-terminated-20260903.md

      - name: Apply durable docs
        run: python3 .github/b94_runtime_sync.py

      - name: Scope audit
        run: |
          changed="$(git diff --name-only)"
          echo "$changed"
          test -n "$changed"
          if echo "$changed" | grep -Ev '^docs/project/' ; then
            echo 'unexpected non-doc change' >&2
            exit 1
          fi

      - name: Commit durable docs
        run: |
          git config user.name 'OpenAI b94 Runtime Docs'
          git config user.email 'b94-runtime-docs@users.noreply.github.com'
          git add docs/project
          git commit -m 'docs: classify b94 Runtime and WebContent termination [skip ci]'
          git push origin HEAD:dev/send-stream-20260829
