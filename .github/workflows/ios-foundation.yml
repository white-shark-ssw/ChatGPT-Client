# Candidate staging: DEV-send-stream-0.1.0-b85
name: Stage Send Detail Projection b85

on:
  push:
    branches:
      - dev/send-stream-20260829
    paths:
      - "ChatGPTClient/**"
      - "ChatGPTClient.xcodeproj/**"
      - "scripts/research/stage_b85.py"
      - ".github/workflows/ios-foundation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage-b85:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact b85 product patch
        run: |
          python3 scripts/research/stage_b85.py
          git diff --check
          grep -q 'CURRENT_PROJECT_VERSION = 85;' ChatGPTClient.xcodeproj/project.pbxproj
          grep -q 'DEV-send-stream-0.1.0-b85' ChatGPTClient.xcodeproj/project.pbxproj
          grep -q 'trailingResponseTimeline' ChatGPTClient/Conversation/ConversationFeature.swift
          grep -q 'external_authoritative_detail' ChatGPTClient/RootViewController.swift

      - name: Commit exact b85 product patch
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ChatGPTClient/Conversation/ConversationFeature.swift ChatGPTClient/RootViewController.swift ChatGPTClient.xcodeproj/project.pbxproj
          git commit -m "fix(send): adopt authoritative Detail reasoning blocks"
          git push origin HEAD:dev/send-stream-20260829
