name: Stage b98 Hard WebContent Recovery

on:
  push:
    branches:
      - dev/send-stream-20260829
    paths:
      - ".github/workflows/stage-b97-foreground-external-reconcile.yml"

permissions:
  contents: write

jobs:
  stage:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout guarded branch
        uses: actions/checkout@v4
        with:
          ref: dev/send-stream-20260829
          fetch-depth: 1

      - name: Record b98 checkpoint before product writes
        run: python3 scripts/staging/b98_web_process_recovery.py checkpoint

      - name: Validate checkpoint scope
        run: |
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' docs/project/BUILD_TEST_INDEX.md docs/project/current/dev/DEV-send-stream-round7-runtime-addendum.md | sort)"
          grep -q 'b98 hard WebContent termination recovery — checkpoint' docs/project/current/dev/DEV-send-stream-round7-runtime-addendum.md
          grep -q 'Runtime not executed / superseded by b98 test priority' docs/project/BUILD_TEST_INDEX.md

      - name: Commit and push durable checkpoint
        run: |
          git config user.name "white-shark-ssw"
          git config user.email "houstools@gmail.com"
          git add docs/project/BUILD_TEST_INDEX.md docs/project/current/dev/DEV-send-stream-round7-runtime-addendum.md
          git commit -m "docs: checkpoint b98 hard WebContent recovery"
          git push origin HEAD:dev/send-stream-20260829

      - name: Apply exact b98 product delta
        run: python3 scripts/staging/b98_web_process_recovery.py product

      - name: Validate exact product scope
        run: |
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' ChatGPTClient.xcodeproj/project.pbxproj ChatGPTClient/RootViewController.swift | sort)"
          grep -q 'CURRENT_PROJECT_VERSION = 98;' ChatGPTClient.xcodeproj/project.pbxproj
          grep -q 'DIAGNOSTICS_CANDIDATE = "DEV-send-stream-0.1.0-b98";' ChatGPTClient.xcodeproj/project.pbxproj
          grep -q 'coveredExecutor.externalWebProcessRecovery' ChatGPTClient/RootViewController.swift
          grep -q 'if observingExternalResponse {' ChatGPTClient/RootViewController.swift
          grep -q 'UIApplication.shared.applicationState == .active' ChatGPTClient/RootViewController.swift
          grep -q 'failCurrent("web_process_terminated")' ChatGPTClient/RootViewController.swift
          git status --short

      - name: Simulator compile
        run: xcodebuild -project ChatGPTClient.xcodeproj -target ChatGPTClient -configuration Debug -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Commit exact b98 product delta
        run: |
          git add ChatGPTClient.xcodeproj/project.pbxproj ChatGPTClient/RootViewController.swift
          git commit -m "DEV-send-stream: recover external WebContent termination b98"
          git push origin HEAD:dev/send-stream-20260829
