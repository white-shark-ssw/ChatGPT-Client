name: b95 runtime docs sync

on:
  push:
    branches:
      - dev/send-stream-20260829
    paths:
      - ".github/workflows/b95-runtime-docsync.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/send-stream-20260829
          fetch-depth: 0
      - name: Record b95 Runtime and next handoff research gate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          checkpoint = Path('docs/project/current/dev/DEV-send-stream.md')
          s = checkpoint.read_text()
          old_status = '**Active — exact b95 hard Reload is packaged and awaits Human Runtime. The primary unresolved Send/Stream defect remains automatic page-owned continuation interruption: b92/b93 prove the official page loop can stop after background or browsing-context handoff; b93 focus reacquisition is insufficient; b94 full-page foreground rebootstrap can restart the loop but repeated/heavy rebootstrap ended in WebContent-process termination. Stable/Frozen Send remains No.**'
          new_status = '**Active — exact b95 hard Reload is Runtime Positive as a deliberate recovery path, but automatic external terminal/final convergence remains insufficient. b95 again proves foreground full-page rebootstrap can restart page-owned continuation and did not reproduce WebContent termination, while prior b94 still prevents calling repeated/heavy full-page Web stable. The strongest next architecture hypothesis is a server-issued Web->Native continuation handoff for client-owned turns, with separate proof required for cross-device already-active turns. Stable/Frozen Send remains No.**'
          assert old_status in s
          s = s.replace(old_status, new_status, 1)
          old_action = '**Next exact action:** Human Runtime exact b95, with one active/stuck Reload test and one fresh automatic-interruption trace. Do not modify product/config or allocate b96 before that evidence.'
          new_action = '**Next exact action:** keep b95 product fixed and perform a privacy-safe transport-handoff research gate. For one client-owned protected Send, prove or reject server-issued continuation identity (`resume_conversation_token`, `stream_handoff`, `turn_exchange_id`, `topic_id` or equivalent) and whether a Native continuation channel can be established before Web becomes disposable. Separately prove whether an already-active cross-device turn exposes an official realtime subscription/update path. Do not allocate production b96 from guessed transport or reproduce page polling cadence.'
          assert old_action in s
          s = s.replace(old_action, new_action, 1)
          result_marker = '## b95 Human Runtime result — 2026-09-04'
          assert result_marker not in s
          s += '''\n\n## b95 Human Runtime result — 2026-09-04\n\nExact b95 diagnostics match Candidate `DEV-send-stream-0.1.0-b95`, Build 95, source `a10320e589ac`, iPhone / iOS 17.0. Full evidence: `docs/project/runtime-evidence/DEV-send-stream-b95-hard-reload-and-handoff-hypothesis-20260904.md`.\n\nOne explicit Sync exposed an active external tail and page-owned continuation then advanced automatically through repeated HTTP200 `IS_STREAMING` + plural snapshots. Before the first background, service/tools progressed `6/2 -> 14/6`; after foreground full-page rebootstrap the same response resumed, and a later rebootstrap caught up to phase `final`, reasoning `757`, service `103`, tools `30`, final characters `0`. Five foreground rebootstrap requests occurred in this run. Unlike b94, b95 emitted no `coveredExecutor.webProcess state=terminated` and no `coveredExecutor.failed`; therefore WebContent termination is not reproduced, but prior b94 still makes repeated/heavy full-page reliability non-stable and its cause remains Unverified.\n\nAt `17:09:33Z` the user invoked `重载当前会话` while the Repository live snapshot remained active/stuck in final phase. b95 released the old executor, reset the live snapshot (`manualReload.hardReset executorReleased=true / liveSnapshotCleared=true`), and issued one replacement authoritative Detail load. HTTP200 Reload returned `6,235,224` bytes, mapping `1737`, visible messages `33`, with zero trailing reasoning/timeline/tools; `conversationReload.end` reported visible `32 -> 33`. The completed assistant was therefore already authoritative and Hard Reload materialized it successfully. **Hard Reload recovery is Runtime Positive.**\n\nThe run still does not prove natural external terminal/final convergence: before manual Reload the official page kept reporting `IS_STREAMING` with static service `103` / tools `30` / final `0`, and there is no page-owned COMPLETE / natural terminal / automatic authoritative reconcile before Reload. Classification: **b95 Hard Reload Runtime Positive; full-page rebootstrap restart mechanism Runtime Positive again; WebContent termination not reproduced / cause Unverified; automatic external terminal/final convergence not achieved; Stable-Frozen No.**\n\nA narrower b95 orchestration mismatch is also proven: after authoritative Reload returned no active trailing timeline, Root still created a fresh covered executor/`mode=selection` observer. This conflicts with b95's intended post-Reload rule to re-observe only if authoritative Detail remains active. Record as a secondary cleanup item; do not let it displace the primary automatic-disconnect architecture.\n\n### Web -> Native transport handoff hypothesis\n\nUser proposes making covered Web only the protected Send/bootstrap executor, then letting Native own continuation once a matching Native channel is confirmed, so later WebContent death becomes irrelevant. This is a coherent next research direction only as a **server-supported transport handoff**, not by attempting to inherit the exact JavaScript `ReadableStream` after WebContent dies. Existing historical first-party probes already observed early `resume_conversation_token` on our own protected Send; external comparison research reports current self-submitted-turn paths that can expose `stream_handoff` / `turn_exchange_id` / `topic_id` and then subscribe to shared realtime transport.\n\nFor client-owned Send, the next research gate is therefore to prove those server-issued identities and an actual Native continuation subscription before releasing Web. For a cross-device already-active response, Sync/Detail alone does not prove possession of the original turn's handoff token/topic; that case requires separate first-party realtime evidence. Copying the official page's `stream_status` + plural-read cadence into Native remains rejected polling, not handoff.\n\nNo production ownership rule changes yet. Until the research gate is positive, official page owns continuation transport, `ConversationRepository` owns Native response/content, and Native must not guess topic/offset/resume, duplicate Send, add polling/timers/retry/watchdog, or create a second response store.\n'''
          checkpoint.write_text(s)

          index = Path('docs/project/BUILD_TEST_INDEX.md')
          s = index.read_text()
          old = '| `DEV-send-stream-0.1.0-b95` | `DEV-send-stream` | `0.1.0 (95)` | hard-Reload recovery product `ac5e621aa69f5f27ef3167b4a951812be8b8e2c2`; exact package source `a10320e589acd551a8dc53f56aaf28a0a08f5b4a`; PR #29 | staging `33775057479/100714562438` exact three-product-file scope+Simulator passed; Push `33775521398/100716116912` passed; PR `33775526525/100716136837` passed; canonical Artifact `9901461763`; Artifact `sha256:0378271690113e92849d87cec7bc32fa56d4ae8de4885e7003fc0ba69e26cb6a`; IPA `sha256:2fd213a1dd692202b496adabd393c4130080607384e3d6c0f84cd3f975a8840d`; package `0.1.0 (95)` / Candidate b95 / source `a10320e589ac` / iOS14 / `[1,2]` / arm64 | Runtime pending: Reload is now always enabled for a selected conversation and hard-resets executor/live/page state before authoritative Detail reload; exact b95 must also capture a fresh automatic page-loop interruption trace | **Package verified; Human Runtime pending; automatic-disconnect unresolved; Stable-Frozen No; permanently reserved** |'
          new = '| `DEV-send-stream-0.1.0-b95` | `DEV-send-stream` | `0.1.0 (95)` | hard-Reload recovery product `ac5e621aa69f5f27ef3167b4a951812be8b8e2c2`; exact package source `a10320e589acd551a8dc53f56aaf28a0a08f5b4a`; PR #29 | staging `33775057479/100714562438` exact three-product-file scope+Simulator passed; Push `33775521398/100716116912` passed; PR `33775526525/100716136837` passed; canonical Artifact `9901461763`; Artifact `sha256:0378271690113e92849d87cec7bc32fa56d4ae8de4885e7003fc0ba69e26cb6a`; IPA `sha256:2fd213a1dd692202b496adabd393c4130080607384e3d6c0f84cd3f975a8840d`; package `0.1.0 (95)` / Candidate b95 / source `a10320e589ac` / iOS14 / `[1,2]` / arm64 | **Runtime Partial:** page-owned continuation repeatedly resumed after foreground full-page rebootstrap; no WebContent termination occurred in this run. Active/stuck Hard Reload released executor + live snapshot and authoritative HTTP200 Detail added final visible message `32->33` with no active tail. Natural external terminal/final still did not occur before manual Reload; post-Reload observer was unnecessarily recreated despite no active tail | **Hard Reload Runtime Positive; rebootstrap restart Positive / repeated-heavy stability still not accepted; automatic terminal/final insufficient; handoff research next; Stable-Frozen No; permanently reserved** |'
          assert old in s
          s = s.replace(old, new, 1)
          index.write_text(s)

          state = Path('docs/project/PROJECT_STATE.md')
          s = state.read_text()
          old_block = '''## DEV-send-stream b95 hard-Reload package-ready / disconnect priority override — 2026-09-04\n\n- Exact b95 is package-ready: product `ac5e621aa69f5f27ef3167b4a951812be8b8e2c2`; package source `a10320e589acd551a8dc53f56aaf28a0a08f5b4a`; Push/PR CI passed; canonical Artifact `9901461763`; IPA SHA `2fd213a1dd692202b496adabd393c4130080607384e3d6c0f84cd3f975a8840d`; Human Runtime pending; Stable/Frozen Send No.\n- b95 restores the user-required recovery invariant: `重载当前会话` remains available whenever a conversation is selected, including active/stuck live response and in-flight Sync/Reload states. It invalidates the current covered executor/live projection, clears the page presentation/resident Detail, then performs one authoritative server Detail reload; it does not resend/regenerate or claim to stop server generation.\n- Primary unresolved defect remains automatic page-owned continuation interruption. b92/b93 prove the official continuation loop can stop after background or browsing-context handoff; b93 focus restoration is insufficient. b94 full-page rebootstrap restarts the loop but repeated/heavy rebootstrap ended in WebContent-process termination.\n- No b96/product modification before exact b95 Human Runtime. Next evidence must distinguish the interruption boundary and recovery behavior without adding polling/timer/retry/watchdog/Native status-resume synthesis.\n\n'''
          new_block = '''## DEV-send-stream b95 Runtime / transport-handoff research override — 2026-09-04\n\n- Exact b95 identity remains product `ac5e621aa69f5f27ef3167b4a951812be8b8e2c2`, package source `a10320e589acd551a8dc53f56aaf28a0a08f5b4a`, Artifact `9901461763`, IPA SHA `2fd213a1dd692202b496adabd393c4130080607384e3d6c0f84cd3f975a8840d`. Human Runtime is now Partial; Stable/Frozen Send No.\n- Hard Reload recovery is Runtime Positive: while an external live projection was active/stuck, b95 released the executor, reset the live snapshot, performed one authoritative Reload, and materialized the completed assistant (`visible 32 -> 33`, zero trailing active timeline).\n- Foreground full-page rebootstrap restarted page-owned continuation repeatedly in b95 and no WebContent termination was emitted in this run. Prior exact b94 termination still blocks treating repeated/heavy full-page Web as stable; cause remains Unverified.\n- Automatic external terminal/final convergence remains insufficient: prior to Hard Reload the page stayed HTTP200 `IS_STREAMING` with static service `103` / tools `30` / final `0`; final materialized only via authoritative Reload in this sample.\n- Secondary b95 defect: after Reload returned no active tail, Root still recreated a covered selection observer. Cleanup is warranted but is not the primary disconnect architecture.\n- Strongest next research hypothesis comes from the user's proposal: use Web only for one protected Send/bootstrap, then perform a server-issued transport handoff to Native once a matching Native continuation channel is confirmed. This is not a direct transfer of a WKWebView `ReadableStream`; it requires independently usable server continuation identity/channel.\n- Client-owned and cross-device cases must be proven separately. Historical self-send probes already expose `resume_conversation_token`; external comparison evidence suggests `stream_handoff`/`turn_exchange_id`/`topic_id` may support a realtime subscription for self-submitted turns. Cross-device active Sync does not yet prove access to equivalent handoff identity.\n- No production b96 or ownership-rule change from guessed transport. Next gate is privacy-safe structural proof of a server-issued Native continuation channel; page polling/cadence reproduction remains rejected.\n\n'''
          assert old_block in s
          s = s.replace(old_block, new_block, 1)
          state.write_text(s)
          PY
          git diff --check
          CHANGED="$(git diff --name-only | sort)"
          EXPECTED=$'docs/project/BUILD_TEST_INDEX.md\ndocs/project/PROJECT_STATE.md\ndocs/project/current/dev/DEV-send-stream.md'
          printf '%s\n' "$CHANGED"
          test "$CHANGED" = "$EXPECTED"
          git config user.name "OpenAI b95 Runtime Docs"
          git config user.email "b95-runtime-docs@users.noreply.github.com"
          git add docs/project/BUILD_TEST_INDEX.md docs/project/PROJECT_STATE.md docs/project/current/dev/DEV-send-stream.md
          git commit -m "docs: record b95 runtime and handoff research gate [skip ci]"
          git push origin HEAD:dev/send-stream-20260829
