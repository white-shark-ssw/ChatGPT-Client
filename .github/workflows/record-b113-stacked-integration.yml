name: Record b113 Stacked Integration

"on":
  push:
    branches:
      - dev/send-stream-20260829
    paths:
      - ".github/workflows/record-b113-stacked-integration.yml"

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout guarded DEV-send-stream branch
        uses: actions/checkout@v4
        with:
          ref: dev/send-stream-20260829
          fetch-depth: 0

      - name: Guard merged b113 product identity
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 4a22086f7ccab39427c46a163854e8f68530c65f HEAD
          git merge-base --is-ancestor 75ccad15208610c2b0420033846f9bb15bbdb494 HEAD
          git diff --quiet 4a22086f7ccab39427c46a163854e8f68530c65f HEAD -- ChatGPTClient ChatGPTClient.xcodeproj/project.pbxproj
          git diff --quiet 75ccad15208610c2b0420033846f9bb15bbdb494 HEAD -- ChatGPTClient ChatGPTClient.xcodeproj/project.pbxproj
          test "$(grep -c 'CURRENT_PROJECT_VERSION = 113;' ChatGPTClient.xcodeproj/project.pbxproj)" = "2"
          test "$(grep -c 'DIAGNOSTICS_CANDIDATE = \"DEV-message-rendering-0.1.0-b113\";' ChatGPTClient.xcodeproj/project.pbxproj)" = "2"
          test -f scripts/staging/record_b113_stacked_integration.py
          test -f scripts/staging/correct_b113_integration_index.py

      - name: Reconcile checkpoint and durable integration truth
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/staging/record_b113_stacked_integration.py
          python3 scripts/staging/correct_b113_integration_index.py
          git diff --check
          changed="$(git diff --name-only | sort)"
          if [ -z "$changed" ]; then
            echo "Integration state already fully recorded."
            exit 0
          fi
          test "$changed" = "docs/project/BUILD_TEST_INDEX.md"

      - name: Commit integration records if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No integration record change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/project/BUILD_TEST_INDEX.md
          git commit -m "docs: reconcile b113 stacked integration index"
          git push origin HEAD:dev/send-stream-20260829
