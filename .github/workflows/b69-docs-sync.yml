name: b69 docs sync

on:
  push:
    branches:
      - assembly/dev-send-stream-b69-docs-20260831
    paths:
      - ".github/workflows/b69-docs-sync.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assembly/dev-send-stream-b69-docs-20260831
          fetch-depth: 0
      - name: Apply durable docs updates and emit clean docs commit
        run: |
          cp scripts/b69_docs_sync.py /tmp/b69_docs_sync.py
          python3 /tmp/b69_docs_sync.py
          git diff --check
          test "$(git diff --name-only 5e9c2183483094304f7eaeecf4ffc7ad8e65b902 | grep '^docs/project/' | sort)" = "$(printf '%s\n' 'docs/project/BUILD_TEST_INDEX.md' 'docs/project/MODULE_STATUS.md' 'docs/project/PROJECT_PROFILE.md' 'docs/project/PROJECT_STATE.md' 'docs/project/TECHNICAL_DECISIONS.md' 'docs/project/current/dev/DEV-send-stream.md' | sort)"
          git reset --hard 5e9c2183483094304f7eaeecf4ffc7ad8e65b902
          python3 /tmp/b69_docs_sync.py
          git add docs/project
          git diff --cached --check
          test "$(git diff --cached --name-only | sort)" = "$(printf '%s\n' 'docs/project/BUILD_TEST_INDEX.md' 'docs/project/MODULE_STATUS.md' 'docs/project/PROJECT_PROFILE.md' 'docs/project/PROJECT_STATE.md' 'docs/project/TECHNICAL_DECISIONS.md' 'docs/project/current/dev/DEV-send-stream.md' | sort)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: record b69 ordered timeline runtime gate"
          git push origin HEAD:assembly/dev-send-stream-b69-docs-product-20260831
