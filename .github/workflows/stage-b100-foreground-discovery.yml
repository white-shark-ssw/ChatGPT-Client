name: Record b99 Runtime and b100 Package Evidence

on:
  push:
    branches:
      - dev/send-stream-20260829
    paths:
      - .github/workflows/stage-b100-foreground-discovery.yml

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout guarded branch
        uses: actions/checkout@v4
        with:
          ref: dev/send-stream-20260829
          fetch-depth: 0

      - name: Guard exact b100 package baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "8b966e259217e7e5dbdf8cbe0b72143150a35502"
          grep -q 'CURRENT_PROJECT_VERSION = 100;' ChatGPTClient.xcodeproj/project.pbxproj
          grep -q 'DIAGNOSTICS_CANDIDATE = "DEV-send-stream-0.1.0-b100";' ChatGPTClient.xcodeproj/project.pbxproj
          grep -q 'foregroundConversationDiscovery.requested' ChatGPTClient/RootViewController.swift

      - name: Record durable evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          S = base64.b64decode('').decode()
          D = base64.b64decode('').decode()
          R = base64.b64decode('').decode()
          C = base64.b64decode('').decode()
          R100 = base64.b64decode('').decode()
          R99 = base64.b64decode('').decode()
          def prepend(path, marker, block):
              p = Path(path); text = p.read_text()
              if marker not in text: p.write_text(block.rstrip() + '\n\n' + text)
          for path in ['docs/project/PROJECT_STATE.md','docs/project/PROJECT_PROFILE.md','docs/project/MODULE_STATUS.md']:
              prepend(path, '## DEV-send-stream b100 foreground dormant-discovery override — 2026-09-05', S)
          prepend('docs/project/TECHNICAL_DECISIONS.md', '## DEV-send-stream b100 lifecycle-triggered dormant discovery — 2026-09-05', D)
          prepend('docs/project/PROJECT_SPECIFIC_RULES.md', '## Foreground dormant cross-platform discovery — b100 2026-09-05', R)
          prepend('docs/project/current/dev/DEV-send-stream-round7-runtime-addendum.md', '## b100 foreground dormant discovery — package-ready 2026-09-05', C)
          p = Path('docs/project/BUILD_TEST_INDEX.md'); lines = p.read_text().splitlines(); out=[]; inserted=False; found=False
          for line in lines:
              if line.startswith('| `DEV-send-stream-0.1.0-b100` |'):
                  if not inserted: out.append(R100); inserted=True
              elif line.startswith('| `DEV-send-stream-0.1.0-b99` |'):
                  if not inserted: out.append(R100); inserted=True
                  out.append(R99); found=True
              else: out.append(line)
          if not found: raise SystemExit('b99 row not found')
          p.write_text('\n'.join(out) + '\n')
          PY

      - name: Validate docs-only scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          expected={'docs/project/BUILD_TEST_INDEX.md','docs/project/PROJECT_STATE.md','docs/project/PROJECT_PROFILE.md','docs/project/MODULE_STATUS.md','docs/project/TECHNICAL_DECISIONS.md','docs/project/PROJECT_SPECIFIC_RULES.md','docs/project/current/dev/DEV-send-stream-round7-runtime-addendum.md'}
          if changed != expected: raise SystemExit(f'unexpected docs scope: {sorted(changed)}')
          PY

      - name: Commit durable b100 evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/project/BUILD_TEST_INDEX.md docs/project/PROJECT_STATE.md docs/project/PROJECT_PROFILE.md docs/project/MODULE_STATUS.md docs/project/TECHNICAL_DECISIONS.md docs/project/PROJECT_SPECIFIC_RULES.md docs/project/current/dev/DEV-send-stream-round7-runtime-addendum.md
          git commit -m "docs: record b99 runtime and b100 package evidence"
          git push origin HEAD:dev/send-stream-20260829
