name: Record b104 Package Evidence

"on":
  push:
    branches:
      - dev/send-stream-20260829
    paths:
      - ".github/workflows/record-b104-package-evidence.yml"

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout guarded branch
        uses: actions/checkout@v4
        with:
          ref: dev/send-stream-20260829
          fetch-depth: 0

      - name: Guard canonical b104 package source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "08fab73ab9a6fb83f6aa97702d2d4cd358b6ec43"
          test "$(git rev-parse 08fab73ab9a6fb83f6aa97702d2d4cd358b6ec43^)" = "4aebb546f3be6b71de0a67f466e6557a357dbfdc"
          grep -q 'CURRENT_PROJECT_VERSION = 104;' ChatGPTClient.xcodeproj/project.pbxproj
          grep -q 'DIAGNOSTICS_CANDIDATE = "DEV-send-stream-0.1.0-b104";' ChatGPTClient.xcodeproj/project.pbxproj
          test ! -e ChatGPTClient/Protocol/CoveredWebProcessKillProbe.swift
          ! grep -R -q '_killWebContentProcessAndResetState' ChatGPTClient
          grep -q 'acceptedClientWebProcessInterrupted' ChatGPTClient/RootViewController.swift
          grep -q 'acceptedClientRecovery.started' ChatGPTClient/RootViewController.swift

      - name: Record durable b103 Runtime and b104 package evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          runtime_sha = '99049f500c129571d33aa628720f7d23ce5cf6d183e887938cd7fa621a3bbc51'
          product = '4aebb546f3be6b71de0a67f466e6557a357dbfdc'
          package = '08fab73ab9a6fb83f6aa97702d2d4cd358b6ec43'
          zip_sha = '2ef6278a72fd46e86cb279a97e0e84b2228b5c78eb390cdc7582229b84e3d82e'
          ipa_sha = '9c35141e9877621d3a7e39245982cba6722acbb17a19f5ebabd8734d2b94df04'

          def prepend(path, heading, section):
              p = Path(path)
              text = p.read_text()
              if heading not in text:
                  p.write_text(section + text)

          checkpoint_heading = '## b104 normal no-probe accepted-client recovery — package ready 2026-09-05'
          checkpoint_section = f'''{checkpoint_heading}

          Exact Runtime / package evidence:

          - b103 Human Runtime diagnostics `sha256:{runtime_sha}` is decisive for the accepted-client hard-Web recovery gate. The exact run had one protected Send, explicit HTTP200 `text/event-stream` acceptance, deterministic hard WebContent death, immediate `acceptedClientWebProcessRecovery` / `acceptedClientRecovery.started` on the same `responseGeneration=1`, no lifecycle nudge, HTTP200 `IS_STREAMING`, matching external snapshot, HTTP200 SSE resume, natural terminal, and automatic authoritative Detail `19 -> 21` reconciliation with live state cleared. There was no second protected Send.
          - `DEV-send-stream-0.1.0-b104` / `0.1.0 (104)` is permanently reserved as the first normal candidate after that deterministic test. Exact product `{product}`; canonical package source `{package}`.
          - b104 product delta from the b103 Runtime checkpoint is exactly three product paths: Build/Candidate 103 -> 104 plus removal of kill-probe Xcode membership, one AppDelegate installer line removal, and deletion of `CoveredWebProcessKillProbe.swift`. `RootViewController.swift` accepted-client recovery logic is unchanged.
          - Staging `33917182143 / 101166941594` passed exact three-product-path audit and Debug Simulator compile before committing product `{product}`.
          - Formal Push `33917342654 / 101167460031` and PR `33917346052 / 101167471587` both passed on exact package source `{package}`.
          - Canonical Push Artifact `9953695815`; downloaded Artifact ZIP independently recomputed `sha256:{zip_sha}`, matching GitHub's Artifact digest.
          - Canonical IPA `ChatGPTClient-0.1.0-b104-dev-send-stream.ipa`; independently recomputed `sha256:{ipa_sha}`, matching the emitted sidecar.
          - Independent package inspection confirms `com.whitesharkssw.chatgptclient`, `0.1.0 (104)`, Candidate b104, source marker `08fab73ab9a6`, Release, MinimumOSVersion 14.0, UIDeviceFamily `[1,2]`, iPhoneOS, Mach-O 64-bit arm64. Binary contains the accepted-client recovery diagnostics and contains no `_killWebContentProcessAndResetState`, `coveredExecutor.killProbe`, `CoveredWebProcessKillProbe`, or b103 swizzle method.

          Evidence boundary:

          - b103 accepted-client hard-Web recovery is **Human Runtime Positive for the tested foreground iPhone/iOS17 path**. This does not prove true execution while iOS suspends the app, pre-acceptance Web death recovery, silent-but-alive Web stalls, generic navigation failure recovery, or the separate b101 exact `-1005` branch.
          - b104 contains no deterministic kill instrumentation. Its Human Runtime gate is an ordinary no-probe Send regression only; do not expect or force a 120-second Web kill.
          - No resend/replay/regenerate, timer/watchdog, polling, heartbeat, challenge replay, guessed Native resume, or second response/content authority is added.

          Evidence ladder: **b103 recovery Runtime Positive / b104 Code written / exact scope + Simulator passed / Push CI passed / PR CI passed / Artifact produced / package identity independently verified / b104 ordinary Runtime pending / Stable-Frozen No.**

          **Next exact action:** install only canonical b104 and run an ordinary existing-conversation Native Send. Confirm there is no `coveredExecutor.killProbe`, protected Send is HTTP200 SSE accepted once, normal reasoning/tools/final reaches terminal and automatic authoritative reconcile, with no artificial WebContent death. Export diagnostics. Do not allocate b105 unless b104 Runtime exposes new evidence.

          '''
          prepend('docs/project/current/dev/DEV-send-stream-round7-runtime-addendum.md', checkpoint_heading, checkpoint_section)

          index = Path('docs/project/BUILD_TEST_INDEX.md')
          lines = index.read_text().splitlines()
          b104 = f'| `DEV-send-stream-0.1.0-b104` | `DEV-send-stream` | `0.1.0 (104)` | normal no-probe accepted-client recovery product `{product}`; package `{package}`; PR #29 | staging `33917182143/101166941594` exact three-product-path scope + Simulator passed; Push `33917342654/101167460031` passed; PR `33917346052/101167471587` passed; canonical Artifact `9953695815`; ZIP `{zip_sha}`; IPA `{ipa_sha}`; b104/source `08fab73ab9a6`/Release/iOS14/[1,2]/arm64 verified; deterministic kill probe/private SPI absent | b103 recovery Runtime `sha256:{runtime_sha}` Positive; b104 Human Runtime pending ordinary no-probe Send regression. Recovery logic is unchanged from b103; there must be no artificial 120s kill or `killProbe` event | **Code written / exact scope+Simulator passed / Push+PR CI passed / Artifact produced / package identity verified / b103 recovery Runtime Positive / b104 Runtime pending / Stable-Frozen No; permanently reserved** |'
          found = False
          for i, line in enumerate(lines):
              if line.startswith('| `DEV-send-stream-0.1.0-b104` |'):
                  lines[i] = b104
                  found = True
                  break
          if not found:
              raise SystemExit('b104 row missing')
          index.write_text('\n'.join(lines) + '\n')

          profile_heading = '## Latest DEV-send-stream candidate override — b104 2026-09-05'
          profile_section = f'''{profile_heading}

          - Latest Human Runtime candidate is `DEV-send-stream-0.1.0-b104` / `0.1.0 (104)`, permanently reserved. Exact product `{product}`; package source `{package}`. b104 preserves b103 accepted-client hard-Web same-generation recovery unchanged and removes only deterministic kill instrumentation.
          - Staging `33917182143/101166941594`, Push `33917342654/101167460031` and PR `33917346052/101167471587` passed. Canonical Artifact `9953695815`; ZIP `sha256:{zip_sha}`; IPA `sha256:{ipa_sha}`; independent package identity verifies Release b104/source `08fab73ab9a6`/iOS14+/`[1,2]`/arm64 and no kill-probe/private-SPI strings.
          - b103 Runtime `sha256:{runtime_sha}` is Positive for accepted-client hard-Web recovery on the tested foreground iPhone/iOS17 path: one accepted protected Send, same-generation automatic reattach with no lifecycle nudge or resend, live continuation, terminal and authoritative convergence. b104 ordinary no-probe Runtime remains pending; Stable/Frozen No.

          '''
          prepend('docs/project/PROJECT_PROFILE.md', profile_heading, profile_section)

          state_heading = '## DEV-send-stream b104 normal no-probe recovery package ready — 2026-09-05'
          state_section = f'''{state_heading}

          - b103 Human Runtime `sha256:{runtime_sha}` closes the accepted-client hard-Web foreground recovery gate as Runtime Positive: exactly one HTTP200 SSE accepted protected Send survived hard WebContent death, the same Repository generation automatically attached one fresh covered observer without a lifecycle nudge or resend, page-owned status/snapshot/resume continued, and terminal authoritative Detail converged `19 -> 21` and cleared live state.
          - b104 removes only the deterministic b102/b103 test surface: no `CoveredWebProcessKillProbe`, no AppDelegate installer, no `_killWebContentProcessAndResetState`, no 120-second test timer. Accepted-client recovery in Root is unchanged. Product `{product}`; package `{package}`.
          - Staging `33917182143/101166941594`, Push `33917342654/101167460031`, PR `33917346052/101167471587` passed; Artifact `9953695815`; ZIP `sha256:{zip_sha}`; IPA `sha256:{ipa_sha}`; package independently verified b104/source `08fab73ab9a6`/Release/iOS14+/arm64.
          - Human Runtime for b104 is pending ordinary no-probe Send regression. No true-background/silent-stall/pre-acceptance recovery claim; Stable-Frozen No.

          '''
          prepend('docs/project/PROJECT_STATE.md', state_heading, state_section)

          module_heading = '## DEV-send-stream b104 no-probe accepted-client recovery — 2026-09-05'
          module_section = f'''{module_heading}

          - `ConversationRepository` remains sole Native response/content/lifecycle authority. b103 Runtime `sha256:{runtime_sha}` proves the accepted-client hard-Web handoff keeps one prompt-owned generation through death, fresh covered observation, resume/live terminal and authoritative reconcile with no second protected Send.
          - b104 keeps that recovery implementation unchanged and removes the deterministic kill instrumentation completely. No test timer/private WebKit kill SPI ships in this normal candidate.
          - Exact product/package `{product}` / `{package}`; staging + Push + PR CI passed; Artifact `9953695815`; IPA `sha256:{ipa_sha}`; package identity independently verified. b104 ordinary Runtime pending; module remains Active / Runtime Partial overall / Stable-Frozen No because separate background/silent-stall and other open gates are not collapsed into this result.

          '''
          prepend('docs/project/MODULE_STATUS.md', module_heading, module_section)

          decision_heading = '## DEV-send-stream b103 Runtime acceptance / b104 probe-retirement decision — 2026-09-05'
          decision_section = f'''{decision_heading}

          - Exact b103 Runtime `sha256:{runtime_sha}` validates the decision made from b102: once one protected Send has explicit HTTP200 `text/event-stream` acceptance, hard `webViewWebContentProcessDidTerminate` may be treated as receive-transport interruption for the tested foreground path. Preserve the same prompt-owned Repository generation, release the dead executor, attach one fresh covered observer, and never resend the prompt.
          - The recovery qualifies without lifecycle assistance: no post-kill foreground/background event occurred before the fresh observer obtained HTTP200 `IS_STREAMING`, matching snapshot and HTTP200 SSE resume; generation 1 then reached terminal and authoritative Detail reconciliation.
          - The deterministic 120-second kill has fulfilled its diagnostic purpose and is retired in b104. No timer, swizzle, `_killWebContentProcessAndResetState`, watchdog, retry loop or replacement synthetic disconnect detector is authorized for normal product behavior.
          - Pre-acceptance hard Web death remains normal failure/no-resend. Silence, elapsed time, route/focus state, generic navigation error and missing snapshot remain insufficient hard-disconnect evidence. True background execution remains separately unproven.

          '''
          prepend('docs/project/TECHNICAL_DECISIONS.md', decision_heading, decision_section)

          rules_heading = '## Accepted client Send hard-Web recovery — Runtime accepted / b104 normal rule 2026-09-05'
          rules_section = f'''{rules_heading}

          - b103 Human Runtime `sha256:{runtime_sha}` supersedes the earlier test-pending wording: for the tested foreground iPhone/iOS17 path, a protected Send that has already returned HTTP200 `text/event-stream` may survive hard covered-WebContent death and must retain the same prompt-owned `ConversationRepository` generation rather than being marked failed solely because the transport process died.
          - On that exact post-acceptance hard termination signal, release only the dead executor transport and attach one fresh covered observer to the same conversation/generation while active; if inactive, do not start background network work and defer the fresh observer to foreground. Never resend/replay/regenerate the prompt.
          - Before explicit Send acceptance, hard WebContent death remains failure/no-resend. Generic navigation failure, silence, elapsed time, missing snapshots, route state and focus state are not equivalent hard-disconnect evidence.
          - The b102/b103 deterministic 120-second kill probe is retired after this Runtime proof. Normal candidates from b104 forward must not contain its timer, JavaScript swizzle or `_killWebContentProcessAndResetState` test SPI unless a future explicitly scoped diagnostic experiment is separately justified and allocated.
          - `ConversationRepository` remains the sole response/content authority; this rule authorizes no polling, heartbeat, retry loop, challenge replay, guessed Native resume, duplicate Send, second live-response store or claim of true background execution.

          '''
          prepend('docs/project/PROJECT_SPECIFIC_RULES.md', rules_heading, rules_section)
          PY

          rm -f .github/workflows/stage-b104-remove-kill-probe.yml .github/workflows/record-b104-package-evidence.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/project/current/dev/DEV-send-stream-round7-runtime-addendum.md docs/project/BUILD_TEST_INDEX.md docs/project/PROJECT_PROFILE.md docs/project/PROJECT_STATE.md docs/project/MODULE_STATUS.md docs/project/TECHNICAL_DECISIONS.md docs/project/PROJECT_SPECIFIC_RULES.md .github/workflows/stage-b104-remove-kill-probe.yml .github/workflows/record-b104-package-evidence.yml
          git commit -m "docs: record b104 package and b103 runtime evidence"
          git push origin HEAD:dev/send-stream-20260829
