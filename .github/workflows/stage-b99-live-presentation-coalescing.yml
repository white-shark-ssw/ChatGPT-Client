name: Stage b99 Live Presentation Coalescing

on:
  push:
    branches:
      - dev/send-stream-20260829
    paths:
      - .github/workflows/stage-b99-live-presentation-coalescing.yml

permissions:
  contents: write

jobs:
  stage:
    runs-on: macos-15
    steps:
      - name: Checkout guarded branch
        uses: actions/checkout@v4
        with:
          ref: dev/send-stream-20260829
          fetch-depth: 0

      - name: Guard exact b99 baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "db81d0766a640899509326b07c20f4f198a3baee"
          grep -q 'CURRENT_PROJECT_VERSION = 98;' ChatGPTClient.xcodeproj/project.pbxproj
          grep -q 'DIAGNOSTICS_CANDIDATE = "DEV-send-stream-0.1.0-b98";' ChatGPTClient.xcodeproj/project.pbxproj
          grep -q 'private var livePresentationContentHeight: CGFloat = 0' ChatGPTClient/Conversation/ConversationFeature.swift
          grep -q 'func liveResponseDidChange(id: String)' ChatGPTClient/Conversation/ConversationFeature.swift

      - name: Apply exact b99 product delta
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          project = Path('ChatGPTClient.xcodeproj/project.pbxproj')
          text = project.read_text()
          old_build = 'CURRENT_PROJECT_VERSION = 98;'
          old_candidate = 'DIAGNOSTICS_CANDIDATE = "DEV-send-stream-0.1.0-b98";'
          if text.count(old_build) != 2 or text.count(old_candidate) != 2:
              raise SystemExit('unexpected b98 project identity count')
          text = text.replace(old_build, 'CURRENT_PROJECT_VERSION = 99;')
          text = text.replace(old_candidate, 'DIAGNOSTICS_CANDIDATE = "DEV-send-stream-0.1.0-b99";')
          project.write_text(text)

          source = Path('ChatGPTClient/Conversation/ConversationFeature.swift')
          text = source.read_text()
          property_anchor = '    private var livePresentationContentHeight: CGFloat = 0\n'
          if text.count(property_anchor) != 1:
              raise SystemExit('unexpected live presentation property anchor count')
          text = text.replace(property_anchor, property_anchor + '    private var liveResponsePresentationUpdateScheduled = false\n', 1)

          start_marker = '    func liveResponseDidChange(id: String) {\n'
          end_marker = '    private func synchronizeLiveReasoningDisclosure(snapshot: ConversationLiveResponseSnapshot, messageID: String, conversationID: String) {\n'
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit('unexpected liveResponseDidChange markers')
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          lines = [
              '    func liveResponseDidChange(id: String) {',
              '        guard displayedConversationID == id, repository.selectedConversationID == id else { return }',
              '        guard !liveResponsePresentationUpdateScheduled else { return }',
              '        liveResponsePresentationUpdateScheduled = true',
              '        DispatchQueue.main.async { [weak self] in',
              '            guard let self else { return }',
              '            self.liveResponsePresentationUpdateScheduled = false',
              '            guard self.displayedConversationID == id, self.repository.selectedConversationID == id else { return }',
              '            self.applyLiveResponsePresentationChange(id: id)',
              '        }',
              '    }',
              '',
              '    private func applyLiveResponsePresentationChange(id: String) {',
              '        if repository.liveResponse(for: id) == nil, let detail = repository.selectedConversation, detail.id == id, detail.currentNodeID != displayedCurrentNodeID || hasVisibleMessageChanges(from: messages, to: detail.messages) {',
              '            apply(detail)',
              '            return',
              '        }',
              '        let boundsBefore = answerJumpScrollBounds()',
              '        let wasAtPhysicalBottom = tableView.contentOffset.y >= boundsBefore.maximumY - 0.5',
              '        rebuildLiveResponsePresentation(width: effectivePresentationWidth())',
              '        tableView.reloadData()',
              '        tableView.layoutIfNeeded()',
              '        if wasAtPhysicalBottom { setScrollOffsetY(answerJumpScrollBounds().maximumY) }',
              '        updateAnswerJumpButton()',
              '        var fields = repository.diagnosticsFields(for: id)',
              '        fields["livePresentationRowCount"] = String(liveMessagePresentation.rows.count)',
              '        fields["liveContentHeightPoints"] = String(format: "%.2f", livePresentationContentHeight)',
              '        fields["followedPhysicalBottom"] = wasAtPhysicalBottom ? "true" : "false"',
              '        diagnostics.info(category: "ui", name: "liveResponse.presentationApplied", fields: fields)',
              '        updateConversationMenu()',
              '    }',
              '',
          ]
          text = text[:start] + '\n'.join(lines) + '\n' + text[end:]
          source.write_text(text)
          PY

      - name: Validate exact product scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'ChatGPTClient.xcodeproj/project.pbxproj\nChatGPTClient/Conversation/ConversationFeature.swift'
          grep -q 'CURRENT_PROJECT_VERSION = 99;' ChatGPTClient.xcodeproj/project.pbxproj
          grep -q 'DIAGNOSTICS_CANDIDATE = "DEV-send-stream-0.1.0-b99";' ChatGPTClient.xcodeproj/project.pbxproj
          grep -q 'private var liveResponsePresentationUpdateScheduled = false' ChatGPTClient/Conversation/ConversationFeature.swift
          grep -q 'private func applyLiveResponsePresentationChange' ChatGPTClient/Conversation/ConversationFeature.swift

      - name: Build Debug iphonesimulator
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project ChatGPTClient.xcodeproj -scheme ChatGPTClient -configuration Debug -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build

      - name: Commit exact b99 product delta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ChatGPTClient.xcodeproj/project.pbxproj ChatGPTClient/Conversation/ConversationFeature.swift
          git commit -m "fix: coalesce live presentation updates for b99"
          git push origin HEAD:dev/send-stream-20260829
