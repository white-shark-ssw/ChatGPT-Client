name: Record b113 Stacked Integration

"on":
  push:
    branches:
      - dev/send-stream-20260829
    paths:
      - ".github/workflows/record-b113-stacked-integration.yml"

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout guarded DEV-send-stream branch
        uses: actions/checkout@v4
        with:
          ref: dev/send-stream-20260829
          fetch-depth: 0

      - name: Guard merged b113 product identity
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 4a22086f7ccab39427c46a163854e8f68530c65f HEAD
          git merge-base --is-ancestor 75ccad15208610c2b0420033846f9bb15bbdb494 HEAD
          git diff --quiet 4a22086f7ccab39427c46a163854e8f68530c65f HEAD -- ChatGPTClient ChatGPTClient.xcodeproj/project.pbxproj
          git diff --quiet 75ccad15208610c2b0420033846f9bb15bbdb494 HEAD -- ChatGPTClient ChatGPTClient.xcodeproj/project.pbxproj
          test "$(grep -c 'CURRENT_PROJECT_VERSION = 113;' ChatGPTClient.xcodeproj/project.pbxproj)" = "2"
          test "$(grep -c 'DIAGNOSTICS_CANDIDATE = \"DEV-message-rendering-0.1.0-b113\";' ChatGPTClient.xcodeproj/project.pbxproj)" = "2"
          test -f scripts/staging/record_b113_stacked_integration.py

      - name: Record checkpoint and durable integration truth
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/staging/record_b113_stacked_integration.py
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            docs/project/BUILD_TEST_INDEX.md \
            docs/project/MODULE_STATUS.md \
            docs/project/PROJECT_PROFILE.md \
            docs/project/PROJECT_SPECIFIC_RULES.md \
            docs/project/PROJECT_STATE.md \
            docs/project/TECHNICAL_DECISIONS.md \
            docs/project/current/dev/DEV-send-stream-round7-runtime-addendum.md | sort)"
          test "$changed" = "$expected"

      - name: Commit integration records
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Integration state already recorded."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/project/BUILD_TEST_INDEX.md docs/project/MODULE_STATUS.md docs/project/PROJECT_PROFILE.md docs/project/PROJECT_SPECIFIC_RULES.md docs/project/PROJECT_STATE.md docs/project/TECHNICAL_DECISIONS.md docs/project/current/dev/DEV-send-stream-round7-runtime-addendum.md
          git commit -m "docs: record b113 stacked integration"
          git push origin HEAD:dev/send-stream-20260829
