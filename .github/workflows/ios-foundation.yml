# Candidate: DEV-send-stream-0.1.0-b101
# Product source: 54a9fa52a7b44a1b7418a39e4b0f7493989f999d
name: iOS Native Read Transport Recovery b101

on:
  push:
    branches:
      - dev/send-stream-20260829
    paths:
      - "ChatGPTClient/**"
      - "ChatGPTClient.xcodeproj/**"
      - "scripts/build_ipa.sh"
      - "scripts/reconstruct_app_icon.sh"
      - "scripts/assets/**"
      - ".github/workflows/ios-foundation.yml"
  pull_request:
    paths:
      - "ChatGPTClient/**"
      - "ChatGPTClient.xcodeproj/**"
      - "scripts/build_ipa.sh"
      - "scripts/reconstruct_app_icon.sh"
      - "scripts/assets/**"
      - ".github/workflows/ios-foundation.yml"
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard b101 identity and preserved send-stream invariants
        run: |
          grep -q 'CURRENT_PROJECT_VERSION = 101;' ChatGPTClient.xcodeproj/project.pbxproj
          grep -q 'DIAGNOSTICS_CANDIDATE = "DEV-send-stream-0.1.0-b101";' ChatGPTClient.xcodeproj/project.pbxproj
          grep -q 'network_connection_lost_current_transient' ChatGPTClient/Conversation/ConversationFeature.swift
          grep -q 'transportRecoveryAttempted' ChatGPTClient/Conversation/ConversationFeature.swift
          grep -q 'foregroundConversationDiscovery.requested' ChatGPTClient/RootViewController.swift
          grep -q 'shouldRearmDiscoveredRemoteTurn' ChatGPTClient/RootViewController.swift
          grep -q 'liveResponsePresentationUpdateScheduled' ChatGPTClient/Conversation/ConversationFeature.swift
          grep -q 'coveredExecutor.externalWebProcessRecovery' ChatGPTClient/RootViewController.swift

      - name: Toolchain
        run: xcodebuild -version

      - name: Build unsigned TrollStore IPA candidate
        run: bash scripts/build_ipa.sh

      - name: Inspect artifact
        run: |
          ls -lh build/artifacts
          unzip -l build/artifacts/*.ipa | head -n 40

      - name: Upload IPA candidate
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPTClient-DEV-send-stream-0.1.0-b101
          path: |
            build/artifacts/*.ipa
            build/artifacts/*.sha256
          if-no-files-found: error
          retention-days: 14
