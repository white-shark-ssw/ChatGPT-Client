          grep -q 'Latest DEV-send-stream candidate override — b96' docs/project/PROJECT_PROFILE.md
          grep -q 'b96 Native continuation package-ready override' docs/project/MODULE_STATUS.md
          grep -q 'b96 Native authoritative Detail continuation decision' docs/project/TECHNICAL_DECISIONS.md
          grep -q 'Native cross-platform Detail continuation exception' docs/project/PROJECT_SPECIFIC_RULES.md
          git status --short

      - name: Commit durable b96 evidence
        run: |
          git config user.name "white-shark-ssw"
          git config user.email "houstools@gmail.com"
          git add docs/project/BUILD_TEST_INDEX.md docs/project/PROJECT_STATE.md docs/project/PROJECT_PROFILE.md docs/project/MODULE_STATUS.md docs/project/TECHNICAL_DECISIONS.md docs/project/PROJECT_SPECIFIC_RULES.md
