# Candidate: DEV-send-stream-0.1.0-b114
# Product source: 673f2905ddc7a5aba23317e81e75677b2e81edb3
# Phase 9 closeout: follow-tail ownership + active Reload safety + fulfilled color-probe retirement.
name: iOS Phase 9 Closeout b114

on:
  push:
    branches:
      - dev/send-stream-20260829
    paths:
      - "ChatGPTClient/**"
      - "ChatGPTClient.xcodeproj/**"
      - "scripts/build_ipa.sh"
      - "scripts/reconstruct_app_icon.sh"
      - "scripts/assets/**"
      - ".github/workflows/ios-foundation.yml"
  pull_request:
    paths:
      - "ChatGPTClient/**"
      - "ChatGPTClient.xcodeproj/**"
      - "scripts/build_ipa.sh"
      - "scripts/reconstruct_app_icon.sh"
      - "scripts/assets/**"
      - ".github/workflows/ios-foundation.yml"
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard exact b114 closeout product and inherited owners
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 673f2905ddc7a5aba23317e81e75677b2e81edb3 HEAD
          git diff --quiet 673f2905ddc7a5aba23317e81e75677b2e81edb3 HEAD -- ChatGPTClient.xcodeproj/project.pbxproj ChatGPTClient/Conversation/ConversationFeature.swift ChatGPTClient/RootViewController.swift
          test "$(grep -c 'CURRENT_PROJECT_VERSION = 114;' ChatGPTClient.xcodeproj/project.pbxproj)" = "2"
          test "$(grep -c 'DIAGNOSTICS_CANDIDATE = \"DEV-send-stream-0.1.0-b114\";' ChatGPTClient.xcodeproj/project.pbxproj)" = "2"
          grep -q 'scrollAnchor.followTailPreserved' ChatGPTClient/Conversation/ConversationFeature.swift
          grep -Fq 'let canReload = selectedID != nil && !recoveryInProgress && !responseActive' ChatGPTClient/Conversation/ConversationFeature.swift
          grep -q 'conversation.detailReload.blocked' ChatGPTClient/Conversation/ConversationFeature.swift
          ! grep -q 'assistantChunkColor.willDisplay' ChatGPTClient/Conversation/ConversationFeature.swift
          ! grep -q 'assistantChunkRender.afterDisplay' ChatGPTClient/Conversation/ConversationFeature.swift
          ! grep -q 'diagnosticCellOrdinalSeed' ChatGPTClient/Conversation/ConversationFeature.swift
          ! grep -q 'bodyRenderedColorDiagnostics' ChatGPTClient/Conversation/ConversationFeature.swift
          ! grep -q 'labelLayerTransparent' ChatGPTClient/Conversation/ConversationFeature.swift
          grep -Fq 'enum ConversationMessageRichTextRenderer' ChatGPTClient/Conversation/ConversationFeature.swift
          grep -Fq 'static let userReuseIdentifier = "ConversationMessageCell.user"' ChatGPTClient/Conversation/ConversationFeature.swift
          grep -Fq 'static let assistantReuseIdentifier = "ConversationMessageCell.assistant"' ChatGPTClient/Conversation/ConversationFeature.swift
          grep -Fq 'return location.map { "〔文件引用 \($0)〕" } ?? "〔文件引用〕"' ChatGPTClient/Conversation/ConversationFeature.swift
          grep -Fq 'reasoningTextView.linkTextAttributes = [.foregroundColor: UIColor.secondaryLabel]' ChatGPTClient/Conversation/ConversationFeature.swift
          test ! -e ChatGPTClient/Protocol/CoveredWebProcessKillProbe.swift
          ! grep -R -q '_killWebContentProcessAndResetState' ChatGPTClient
          git diff --quiet cce8a7b5d9208e45e9f83cd169ed91f68acca3ad 673f2905ddc7a5aba23317e81e75677b2e81edb3 -- ChatGPTClient/RootViewController.swift
          grep -q 'acceptedClientStreamEndedWithoutTerminal' ChatGPTClient/RootViewController.swift
          grep -q 'manualSync.clientLiveReconciled' ChatGPTClient/RootViewController.swift
          grep -q 'policy.*no_resend_same_generation' ChatGPTClient/RootViewController.swift

      - name: Toolchain
        run: xcodebuild -version

      - name: Build unsigned TrollStore IPA candidate
        run: bash scripts/build_ipa.sh

      - name: Inspect artifact
        run: |
          ls -lh build/artifacts
          unzip -l build/artifacts/*.ipa | head -n 40

      - name: Upload IPA candidate
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPTClient-DEV-send-stream-0.1.0-b114
          path: |
            build/artifacts/*.ipa
            build/artifacts/*.sha256
          if-no-files-found: error
          retention-days: 14
