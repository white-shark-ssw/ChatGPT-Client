name: Sync b88 Focus A-B evidence

on:
  push:
    branches:
      - staging/send-stream-b88-docsync-20260902
    paths:
      - "scripts/docsync_b88_focus_ab.py"
      - ".github/workflows/docsync-b88-focus-ab.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tooling
        uses: actions/checkout@v4
        with:
          ref: staging/send-stream-b88-docsync-20260902
          path: tools

      - name: Checkout exact feature target
        uses: actions/checkout@v4
        with:
          ref: dev/send-stream-20260829
          fetch-depth: 0
          path: target

      - name: Guard exact feature head
        working-directory: target
        run: test "$(git rev-parse HEAD)" = "777988afe4afa56fca08840d4cc3c23e3e7cf797"

      - name: Apply durable evidence updates
        working-directory: target
        run: |
          set -euxo pipefail
          python3 ../tools/scripts/docsync_b88_focus_ab.py
          git diff --check
          git diff --name-only | sort
          test -z "$(git diff --name-only | grep -Ev '^docs/project/' || true)"
          test -f docs/project/runtime-evidence/DEV-send-stream-visible-web-focus-sse-ab-20260902.md
          test -f docs/project/runtime-evidence/DEV-send-stream-b88-focus-positive-near-terminal-inconclusive-20260902.md
          grep -F 'DEV-send-stream-0.1.0-b88' docs/project/BUILD_TEST_INDEX.md
          grep -F 'b88 focus activation Runtime qualification' docs/project/WEB_SEND_ADAPTER.md
          grep -F 'Focus causality: **Inconclusive**' docs/project/runtime-evidence/DEV-send-stream-b88-focus-positive-near-terminal-inconclusive-20260902.md

      - name: Commit and push docs only
        working-directory: target
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/project/BUILD_TEST_INDEX.md docs/project/MODULE_STATUS.md docs/project/TECHNICAL_DECISIONS.md docs/project/WEB_SEND_ADAPTER.md docs/project/runtime-evidence/DEV-send-stream-b88-focus-positive-near-terminal-inconclusive-20260902.md docs/project/runtime-evidence/DEV-send-stream-visible-web-focus-sse-ab-20260902.md
          git diff --cached --check
          git commit -m 'docs(send): record b88 focus runtime evidence'
          git push origin HEAD:dev/send-stream-20260829
