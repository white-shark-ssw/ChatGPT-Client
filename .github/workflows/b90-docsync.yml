name: Sync DEV-send-stream b89 Runtime and b90 package docs

on:
  push:
    branches:
      - dev/send-stream-20260829
    paths:
      - ".github/workflows/b90-docsync.yml"

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact feature head
        uses: actions/checkout@v4
        with:
          ref: dev/send-stream-20260829
          fetch-depth: 2

      - name: Guard package-ready baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "99f1aa15ce49b6abb0ff50e808bd889e381de917"
          grep -q 'CURRENT_PROJECT_VERSION = 90;' ChatGPTClient.xcodeproj/project.pbxproj
          grep -q 'DIAGNOSTICS_CANDIDATE = "DEV-send-stream-0.1.0-b90";' ChatGPTClient.xcodeproj/project.pbxproj
          grep -q 'name: iOS Send Frontmost Presentation A-B b90' .github/workflows/ios-foundation.yml

      - name: Synchronize durable evidence and checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          b89_runtime = '''## DEV-send-stream b89 decisive interactivity-negative Runtime override — 2026-09-03

- Exact b89 identity remains `DEV-send-stream-0.1.0-b89` / `0.1.0 (89)`, product `f39bc9387575028d431b85409780a2f3670b3259`, package source `fe45aeadf7ae03bf09aff66a8a05aa2542959676`, Artifact `9881665748`, IPA SHA `c8ad5dcebbfde2131d3fc73c0309a47745f71527ad38b44c5fe3c5fbffe21a55`.
- Exact iPhone/iOS17 Runtime is decisive: after manual Sync/rearm, covered Web had `isUserInteractionEnabled=true`, non-empty/intersecting key-window bounds, then `nativeFirstResponder=true` and `documentHasFocus=true`, but emitted zero matching page-owned `stream_status`, `/resume`, SSE or external snapshot continuation.
- The same external response advanced only when manually re-Synced: authoritative live timeline `5 -> 28`, tools `4 -> 25`, reasoning `1 -> 3`. Therefore interactivity is rejected as a sufficient condition for automatic continuation. Manual authoritative Detail block projection remains Runtime Positive.
- b89 also recorded `subviewIndex=0` / `visibleSiblingCountAbove=1`; the next isolated causal A/B is genuine frontmost presentation/occlusion, not a route/status/resume/polling workaround.
'''

          b90_package = '''## DEV-send-stream b90 frontmost-presentation package-ready override — 2026-09-03

- Candidate / Build: `DEV-send-stream-0.1.0-b90` / `0.1.0 (90)`, permanently reserved.
- Exact b90 product commit: `5e9d735ddb2f7a2c46dbc43de2525980c86a1c1e`; exact product/config package source: `99f1aa15ce49b6abb0ff50e808bd889e381de917`.
- b90 changes only one Runtime A/B variable relative to b89: after explicit manual-Sync rearm, the existing executor `WKWebView` is brought to the front of its current Root host before loading the same target. Existing interactivity, focus rearm, route, page-owned continuation observation, protected Send and `ConversationRepository` ownership remain unchanged.
- Corrected guarded staging `33727956426 / 100561161422` passed exact patch, exact two-product-file scope audit and Xcode Simulator compile, then committed/pushed product `5e9d735...`. An earlier staging run `33727587238 / 100560009446` also passed patch/scope/Simulator but failed before remote product commit only because the Actions token could not modify a workflow file; it emitted no b90 product identity.
- Push CI `33728071476 / 100561518990` and PR CI `33728075476 / 100561530874` both passed on package source `99f1aa15...`.
- Canonical Push Artifact `9882770072`; ZIP `sha256:363c6fdbade5d476eacdee064eec26ed3480c0e7ba1da3b5dcf6b8537af46f6e`; IPA `ChatGPTClient-0.1.0-b90-dev-send-stream.ipa`, SHA `e75fac1a0c935ddb577fe2361c3fc5add0164d2f555a4fe5e8d7975f5b9fe3ee`.
- Independent package inspection confirms Release `0.1.0 (90)`, Candidate b90, source `99f1aa15ce49`, MinimumOSVersion 14.0, iPhone/iPad family and Mach-O arm64; sidecar SHA matches.
- Evidence ladder: **Code written / guarded scope + Simulator passed / Push CI passed / PR CI passed / Artifact produced / package identity independently verified / Runtime pending / Stable-Frozen No.**
- Human Runtime gate: after one explicit Sync on a deliberately long externally active response, b90 must prove `manual_sync_frontmost_ab` with `visibleSiblingCountAbove=0`, then determine whether the official page itself begins matching `stream_status` / `/resume` / snapshot continuation without another Sync.
'''

          def insert_after_title(path, blocks):
              p = Path(path)
              text = p.read_text()
              marker = '\n\n'
              pos = text.find(marker)
              if pos < 0:
                  raise SystemExit(f'no title separator in {path}')
              for block in blocks:
                  if block.splitlines()[0] in text:
                      raise SystemExit(f'block already present in {path}: {block.splitlines()[0]}')
              p.write_text(text[:pos+2] + '\n'.join(blocks) + '\n' + text[pos+2:])

          for path in [
              'docs/project/PROJECT_PROFILE.md',
              'docs/project/PROJECT_STATE.md',
              'docs/project/MODULE_STATUS.md',
              'docs/project/TECHNICAL_DECISIONS.md',
              'docs/project/PROJECT_SPECIFIC_RULES.md',
              'docs/project/WEB_SEND_ADAPTER.md',
              'docs/project/DEVELOPMENT_PLAN.md',
          ]:
              insert_after_title(path, [b90_package, b89_runtime])

          idx = Path('docs/project/BUILD_TEST_INDEX.md')
          text = idx.read_text()
          old_prefix = '| `DEV-send-stream-0.1.0-b89` |'
          lines = text.splitlines()
          found = False
          b90_row = '| `DEV-send-stream-0.1.0-b90` | `DEV-send-stream` | `0.1.0 (90)` | exact frontmost-presentation A/B product commit `5e9d735ddb2f7a2c46dbc43de2525980c86a1c1e`; exact product/config package source `99f1aa15ce49b6abb0ff50e808bd889e381de917`; PR #29 | corrected staging `33727956426/100561161422` passed exact patch + two-product-file scope + Simulator; Push `33728071476/100561518990` passed; PR `33728075476/100561530874` passed; canonical Push Artifact `9882770072`; ZIP `sha256:363c6fdbade5d476eacdee064eec26ed3480c0e7ba1da3b5dcf6b8537af46f6e`; IPA `sha256:e75fac1a0c935ddb577fe2361c3fc5add0164d2f555a4fe5e8d7975f5b9fe3ee`; package `0.1.0 (90)` / Candidate b90 / source `99f1aa15ce49` / iOS14 / arm64 | Runtime pending: one explicit manual-Sync rearm brings the same executor WKWebView frontmost, requiring `visibleSiblingCountAbove=0`, then tests whether page-owned continuation starts while the remote response remains active | **Code/guarded scope+Simulator/Push+PR CI/Artifact/package verified; Runtime Unverified; Stable-Frozen No; permanently reserved** |'
          b89_row = '| `DEV-send-stream-0.1.0-b89` | `DEV-send-stream` | `0.1.0 (89)` | exact interactivity-A/B product commit `f39bc9387575028d431b85409780a2f3670b3259`; exact product/config package source `fe45aeadf7ae03bf09aff66a8a05aa2542959676`; PR #29 | guarded staging `33722656297/100544857329`; Push `33725042383/100552047445`; PR `33725044367/100552051932`; canonical Artifact `9881665748`; IPA `sha256:c8ad5dcebbfde2131d3fc73c0309a47745f71527ad38b44c5fe3c5fbffe21a55`; package verified b89/source `fe45aeadf7ae`/iOS14/arm64 | **Runtime Rejected as sufficient:** interactivity=true + first-responder/document focus succeeded, but zero page-owned continuation while explicit later Sync showed same response timeline `5->28`, tools `4->25`, reasoning `1->3`; manual Detail projection remains positive | **Interactivity mechanism exercised; interactivity alone rejected as sufficient; automatic continuation/final convergence rejected; permanently reserved** |'
          out = []
          for line in lines:
              if line.startswith(old_prefix):
                  out.append(b90_row)
                  out.append(b89_row)
                  found = True
              else:
                  out.append(line)
          if not found:
              raise SystemExit('b89 candidate row not found')
          idx.write_text('\n'.join(out) + '\n')

          evidence = Path('docs/project/runtime-evidence/DEV-send-stream-b89-interactivity-sufficient-rejected-20260903.md')
          if evidence.exists():
              raise SystemExit('runtime evidence already exists')
          evidence.write_text('''# DEV-send-stream b89 — Interactivity Sufficient Rejected — 2026-09-03\n\n## Exact tested identity\n\n- Candidate: `DEV-send-stream-0.1.0-b89`\n- Version / Build: `0.1.0 (89)`\n- Product commit: `f39bc9387575028d431b85409780a2f3670b3259`\n- Exact product/config package source: `fe45aeadf7ae03bf09aff66a8a05aa2542959676`\n- Canonical Push Artifact: `9881665748`\n- IPA SHA-256: `c8ad5dcebbfde2131d3fc73c0309a47745f71527ad38b44c5fe3c5fbffe21a55`\n- Runtime: iPhone / iOS17.0 / Release.\n\n## User-visible result\n\nThe user reported that this same project conversation still did not continue automatically and required pressing `同步最新消息`.\n\n## Decisive diagnostic sequence\n\n- `07:08:04Z` initial authoritative Detail: timeline `4`, tools `3`, reasoning `1`.\n- First explicit Sync at `07:08:08Z` completed at `07:08:09Z`: timeline `5`, tools `4`, reasoning `1`; one Repository external response generation started from authoritative Detail.\n- Rearmed executor page completed with `isUserInteractionEnabled=true`, non-empty/intersecting bounds in the key window, while remaining at `subviewIndex=0` with `visibleSiblingCountAbove=1`.\n- First-responder activation succeeded: `nativeFirstResponder=true`, `documentHasFocus=true`.\n- Fresh target page reported `navigator.userActivation` available, with `isActive=false` / `hasBeenActive=false` at the focus sample.\n- No matching page-owned `stream_status`, `/resume`, external SSE or page-owned snapshot continuation appeared after the rearm/focus/interactivity state. Observed user WebSocket frames remained structural and `targetMatch=false`.\n- A second explicit Sync at `07:10:06Z` returned at `07:10:07Z` with the same response generation at timeline `28`, tools `25`, reasoning `3`, mapping `64`.\n\nTherefore the remote response advanced substantially (`5 -> 28` timeline, `4 -> 25` tools) while the covered executor produced no automatic continuation path; newer material appeared only through authoritative manual Detail Sync.\n\n## Qualification\n\n- Interactivity=true: Runtime exercised.\n- First-responder / document focus: Runtime Positive.\n- Manual authoritative Detail block projection: Runtime Positive.\n- Automatic page-owned continuation after interactivity+focus: Runtime Negative.\n- **Interactivity as a sufficient condition: Rejected.**\n- Stable/Frozen Send: No.\n\nThis does not prove user activation universally irrelevant or impossible. The known-positive visible-Web fresh-root control had already continued from unscoped full navigation with transient activation false, while a later manual Lab activation read was contaminated by its explicit Execute gesture.\n\n## Next evidence target\n\nThe remaining directly evidenced covered-vs-visible presentation differential is z-order/occlusion: production source inserts the executor at Root index 0, and b89 logged one visible sibling above it. Exact b90 therefore tests only frontmost presentation after explicit Sync/rearm. No Native status/resume/offset, polling, timer/retry/watchdog, duplicate Send, WebSocket-body authority or second response store is authorized.\n''')

          checkpoint = Path('docs/project/current/dev/DEV-send-stream.md')
          checkpoint.write_text('''# DEV-send-stream\n\n## Status\n\n**Active — exact b89 Runtime decisively rejects covered-Web interactivity as sufficient. Exact b90 frontmost-presentation A/B is now Code/guarded scope+Simulator/Push+PR CI/Artifact/package verified and ready for Human Runtime. Stable/Frozen Send remains No.**\n\n- Work ID: `DEV-send-stream`\n- Branch: `dev/send-stream-20260829`\n- PR: #29 — open / unmerged\n- Actual `main`: `94f0c5777dad262cd1fb22be49082dbd92c962f2`\n- b89 Candidate: `DEV-send-stream-0.1.0-b89` permanently reserved; Runtime interactivity-sufficient Rejected\n- b90 Candidate / Build: `DEV-send-stream-0.1.0-b90` / `0.1.0 (90)` permanently reserved\n- Exact b90 product commit: `5e9d735ddb2f7a2c46dbc43de2525980c86a1c1e`\n- Exact b90 product/config package source: `99f1aa15ce49b6abb0ff50e808bd889e381de917`\n- Corrected b90 staging: `33727956426 / 100561161422` — success\n- Push CI: `33728071476 / 100561518990` — success\n- PR CI: `33728075476 / 100561530874` — success\n- Canonical Push Artifact: `9882770072`\n- Canonical Artifact ZIP: `sha256:363c6fdbade5d476eacdee064eec26ed3480c0e7ba1da3b5dcf6b8537af46f6e`\n- IPA: `ChatGPTClient-0.1.0-b90-dev-send-stream.ipa`\n- IPA SHA-256: `e75fac1a0c935ddb577fe2361c3fc5add0164d2f555a4fe5e8d7975f5b9fe3ee`\n- Stable/Frozen Send: No\n\n## b89 Runtime conclusion\n\nExact b89 on iPhone/iOS17 proved `isUserInteractionEnabled=true` and first-responder/document focus, yet emitted zero page-owned continuation while the same remote response later advanced only after explicit Sync from timeline `5 -> 28`, tools `4 -> 25`, reasoning `1 -> 3`. Therefore interactivity is rejected as a sufficient continuation condition. Manual authoritative Detail projection remains Runtime Positive. Durable evidence: `docs/project/runtime-evidence/DEV-send-stream-b89-interactivity-sufficient-rejected-20260903.md`.\n\n## b90 exact single-variable A/B\n\nRelative to b89, only explicit manual-Sync rearm changes z-order: before loading the same target, the existing executor WKWebView is brought to the front of its current Root host and logs `stage=manual_sync_frontmost_ab`. Existing interactivity=true, first-responder focus, target load, page-owned status/resume/snapshot observation, protected Send path and Repository ownership are unchanged. This is a diagnostic causal A/B, not acceptance of full official-Web daily-chat rendering.\n\n## Validation / package identity\n\nThe first staging attempt `33727587238 / 100560009446` passed patch/scope/Simulator but failed before any remote product commit only because the Actions token lacked workflow-file modification permission. The corrected product-only staging `33727956426 / 100561161422` passed guard, exact patch, exact two-product-file scope audit, Xcode Simulator compile, commit and push, producing product commit `5e9d735...`.\n\nPermanent workflow identity commit `99f1aa15...` is the exact package source. Push and PR CI both passed. Canonical Push Artifact `9882770072` was independently downloaded and inspected: ZIP digest matches backend, IPA sidecar and recomputed SHA agree, built Info.plist is `0.1.0 (90)` / Candidate b90 / source `99f1aa15ce49` / minimum iOS14, and executable is arm64.\n\nEvidence ladder: **Code written / guarded scope+Simulator passed / Push CI passed / PR CI passed / Artifact produced / package identity independently verified / Runtime pending / Stable-Frozen No.**\n\n## Human Runtime gate — next exact action\n\nInstall exact b90 IPA and run one clean early/mid-generation production A/B:\n\n1. start a deliberately long response on another official client with multiple reasoning/tool steps still ahead;\n2. select the same target conversation in b90 while that remote generation is clearly still active;\n3. press `同步最新消息` exactly once;\n4. b90 intentionally brings the official executor WebView frontmost for this diagnostic A/B; keep ChatGPTClient foregrounded for 30–60 seconds without another Sync;\n5. independently confirm the other official client continues generating after frontmost activation;\n6. export diagnostics before doing a second manual Sync if possible.\n\nDecisive fields/events:\n\n- `coveredExecutor.webViewActivation` with `stage=manual_sync_frontmost_ab`, especially `visibleSiblingCountAbove=0`;\n- `coveredExecutor.focusActivationResult`;\n- any matching `coveredExecutor.externalStreamStatusRequest/Response`;\n- any matching `coveredExecutor.externalResumeRequest/Response`;\n- any `coveredExecutor.externalStreamingObserved` or page-owned snapshot;\n- Repository live-response progression without a second Sync.\n\nDecision:\n\n- frontmost established + genuine page-owned continuation while remote generation remains active -> frontmost/occlusion differential Runtime Positive; retain only the minimum necessary consequence and separately redesign the final covered form without making full Web the daily-chat UI;\n- frontmost established + remote generation demonstrably advances but still zero page-owned continuation -> reject z-order/occlusion as sufficient and continue to the next evidenced WKWebView browsing-context differential;\n- remote response terminal before frontmost activation -> Inconclusive; reuse exact b90, do not allocate b91.\n\n## Batch recovery state\n\n**Closed for b90 product/package/docs preparation. The next gate is human-only real-device Runtime.**\n\nNo product/config change is permitted before b90 Runtime evidence. b89 and b90 identities remain permanently reserved. Any later docs-only head advancement does not redefine exact b90 package source `99f1aa15...`.\n\n## Preserved boundaries\n\nOfficial page owns continuation transport; `ConversationRepository` owns Native response/content. No Native `stream_status`, `/resume`, guessed offset, polling/cadence reproduction, retry/watchdog, duplicate Send, WebSocket-body authority, hidden-thought presentation or second response store.\n\n## Session round counter\n\nThis user turn is **round 56**.\n''')
          PY

      - name: Audit docs-only scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            'docs/project/BUILD_TEST_INDEX.md' \
            'docs/project/DEVELOPMENT_PLAN.md' \
            'docs/project/MODULE_STATUS.md' \
            'docs/project/PROJECT_PROFILE.md' \
            'docs/project/PROJECT_SPECIFIC_RULES.md' \
            'docs/project/PROJECT_STATE.md' \
            'docs/project/TECHNICAL_DECISIONS.md' \
            'docs/project/WEB_SEND_ADAPTER.md' \
            'docs/project/current/dev/DEV-send-stream.md' \
            'docs/project/runtime-evidence/DEV-send-stream-b89-interactivity-sufficient-rejected-20260903.md' | sort)"
          test "$changed" = "$expected"
          test "$(grep -c 'DEV-send-stream-0.1.0-b90' docs/project/BUILD_TEST_INDEX.md)" -ge 1
          grep -q 'Interactivity Sufficient Rejected' docs/project/runtime-evidence/DEV-send-stream-b89-interactivity-sufficient-rejected-20260903.md

      - name: Commit and push docs evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/project
          git diff --cached --check
          git commit -m "docs: record b89 rejection and b90 package gate"
          git push origin HEAD:dev/send-stream-20260829
