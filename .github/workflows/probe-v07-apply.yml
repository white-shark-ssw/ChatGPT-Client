name: Apply Probe v0.7 dispatch-data observer

on:
  push:
    branches:
      - dev/send-stream-20260829
    paths:
      - ".github/workflows/probe-v07-apply.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/send-stream-20260829
          fetch-depth: 2
      - name: Guard source baseline
        run: |
          test "$(git hash-object scripts/research/official_ios_realtime_probe/ChatGPTRealtimeProbe.m)" = "9519309b52b1dde89391570542ca8f0fa65ed799"
          test "$(git hash-object docs/project/current/dev/DEV-send-stream.md)" != "4b825dc642cb6eb9a060e54bf8d69288fbee4904"
      - name: Apply v0.7 research delta and Runtime docs
        run: python3 .github/scripts/probe_v07_apply.py
      - name: Scope and static checks
        run: |
          git diff --check
          test "$(grep -c 'RPTProbeVersion = @\"0.7\"' scripts/research/official_ios_realtime_probe/ChatGPTRealtimeProbe.m)" = "1"
          grep -F '_task_onqueue_didReceiveDispatchData:completionHandler:' scripts/research/official_ios_realtime_probe/ChatGPTRealtimeProbe.m
          if git diff --name-only | grep -E '^(ChatGPTClient/|ChatGPTClient.xcodeproj/)'; then exit 1; fi
      - name: Commit research delta and remove temporary helpers
        run: |
          git rm .github/workflows/probe-v07-apply.yml .github/scripts/probe_v07_apply.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/research/official_ios_realtime_probe/ChatGPTRealtimeProbe.m scripts/research/official_ios_realtime_probe/README.md docs/project/PROJECT_STATE.md docs/project/current/dev/DEV-send-stream.md docs/project/runtime-evidence/DEV-send-stream-official-ios-probe-v06-runtime-v07-dispatch-data-20260904.md
          git commit -m 'research: observe Detail dispatch-data path v0.7'
          git push origin HEAD:dev/send-stream-20260829
