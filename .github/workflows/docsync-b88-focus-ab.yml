name: Sync b88 Focus A-B evidence

on:
  push:
    branches:
      - staging/send-stream-b88-docsync-20260902
    paths:
      - "scripts/docsync_b88_focus_ab.py"
      - ".github/workflows/docsync-b88-focus-ab.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tooling
        uses: actions/checkout@v4
        with:
          ref: staging/send-stream-b88-docsync-20260902
          path: tools

      - name: Checkout exact feature target
        uses: actions/checkout@v4
        with:
          ref: dev/send-stream-20260829
          fetch-depth: 0
          path: target

      - name: Guard exact feature head
        working-directory: target
        run: test "$(git rev-parse HEAD)" = "f8d536e71c72174e719d17693934997d88686c04"

      - name: Apply durable evidence updates
        working-directory: target
        run: |
          python3 ../tools/scripts/docsync_b88_focus_ab.py
          git diff --check
          test "$(git diff --name-only | sort)" = $'docs/project/BUILD_TEST_INDEX.md\ndocs/project/MODULE_STATUS.md\ndocs/project/TECHNICAL_DECISIONS.md\ndocs/project/WEB_SEND_ADAPTER.md\ndocs/project/runtime-evidence/DEV-send-stream-visible-web-focus-sse-ab-20260902.md'
          grep -F 'DEV-send-stream-0.1.0-b88' docs/project/BUILD_TEST_INDEX.md >/dev/null
          grep -F 'b88 visible-Web continuation activation qualification' docs/project/WEB_SEND_ADAPTER.md >/dev/null

      - name: Commit and push docs only
        working-directory: target
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/project/BUILD_TEST_INDEX.md docs/project/MODULE_STATUS.md docs/project/TECHNICAL_DECISIONS.md docs/project/WEB_SEND_ADAPTER.md docs/project/runtime-evidence/DEV-send-stream-visible-web-focus-sse-ab-20260902.md
          git diff --cached --check
          git commit -m 'docs(send): record visible Web focus continuation A-B'
          git push origin HEAD:dev/send-stream-20260829
