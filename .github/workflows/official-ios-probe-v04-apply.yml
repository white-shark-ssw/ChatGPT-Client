name: official iOS Probe v0.4 apply

on:
  push:
    branches:
      - dev/send-stream-20260829
    paths:
      - ".github/workflows/official-ios-probe-v04-apply.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/send-stream-20260829
          fetch-depth: 0
      - name: Guard exact v0.3 research baseline
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:scripts/research/official_ios_realtime_probe/ChatGPTRealtimeProbe.m)" = "f0707b54615b49ef08ad7f52519267027d3cd922"
          grep -q 'RPTProbeVersion = @"0.3"' scripts/research/official_ios_realtime_probe/ChatGPTRealtimeProbe.m
          grep -q 'Current research revision: \*\*Probe v0.3\*\*' scripts/research/official_ios_realtime_probe/README.md
          test ! -e ChatGPTClient/ProbeV04Marker
      - name: Apply deterministic v0.4 research delta
        run: |
          set -euo pipefail
          python3 .github/probe_v04_apply.py
          git diff --check
      - name: Audit exact research scope and invariants
        run: |
          set -euo pipefail
          grep -q 'RPTProbeVersion = @"0.4"' scripts/research/official_ios_realtime_probe/ChatGPTRealtimeProbe.m
          grep -q 'http.task.resume' scripts/research/official_ios_realtime_probe/ChatGPTRealtimeProbe.m
          grep -q 'RPTTaskResumeLoggedKey' scripts/research/official_ios_realtime_probe/ChatGPTRealtimeProbe.m
          grep -q 'RPTClassOwnsSelector(cls, @selector(resume))' scripts/research/official_ios_realtime_probe/ChatGPTRealtimeProbe.m
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' scripts/research/official_ios_realtime_probe/ChatGPTRealtimeProbe.m scripts/research/official_ios_realtime_probe/README.md | sort)"
          printf '%s\n' "$changed"
          test "$changed" = "$expected"
      - name: Commit research source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/research/official_ios_realtime_probe/ChatGPTRealtimeProbe.m scripts/research/official_ios_realtime_probe/README.md
          git commit -m "research: observe official iOS URLSession task resume v0.4"
          git push origin HEAD:dev/send-stream-20260829
