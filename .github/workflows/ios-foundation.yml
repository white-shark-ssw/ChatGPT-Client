# Candidate staging: DEV-send-stream-0.1.0-b86
name: Stage Send Continuation Diagnostics b86

on:
  push:
    branches:
      - dev/send-stream-20260829
    paths:
      - "ChatGPTClient/RootViewController.swift"
      - "ChatGPTClient.xcodeproj/project.pbxproj"
      - "scripts/research/stage_b86.py"
      - ".github/workflows/ios-foundation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage-b86:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact b86 diagnostics-only patch
        run: |
          python3 scripts/research/stage_b86.py
          git diff --check
          grep -q 'coveredExecutor.externalStreamStatusRequest' ChatGPTClient/RootViewController.swift
          grep -q 'coveredExecutor.externalStreamStatusResponse' ChatGPTClient/RootViewController.swift
          grep -q 'coveredExecutor.externalResumeRequest' ChatGPTClient/RootViewController.swift
          grep -q 'CURRENT_PROJECT_VERSION = 86;' ChatGPTClient.xcodeproj/project.pbxproj
          grep -q 'DEV-send-stream-0.1.0-b86' ChatGPTClient.xcodeproj/project.pbxproj

      - name: Commit exact b86 diagnostics patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ChatGPTClient/RootViewController.swift ChatGPTClient.xcodeproj/project.pbxproj
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag(send): expose page continuation request structure"
          git push origin HEAD:dev/send-stream-20260829
