# Candidate: DEV-send-stream-0.1.0-b102
# Diagnostic scope: deterministic covered-Web WebContent-process death after one client-owned submit
name: iOS Covered Web Process Kill Probe b102

on:
  push:
    branches:
      - dev/send-stream-20260829
    paths:
      - "ChatGPTClient/**"
      - "ChatGPTClient.xcodeproj/**"
      - "scripts/build_ipa.sh"
      - "scripts/reconstruct_app_icon.sh"
      - "scripts/assets/**"
      - ".github/workflows/ios-foundation.yml"
  pull_request:
    paths:
      - "ChatGPTClient/**"
      - "ChatGPTClient.xcodeproj/**"
      - "scripts/build_ipa.sh"
      - "scripts/reconstruct_app_icon.sh"
      - "scripts/assets/**"
      - ".github/workflows/ios-foundation.yml"
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard b102 identity and diagnostic boundary
        run: |
          grep -q 'CURRENT_PROJECT_VERSION = 102;' ChatGPTClient.xcodeproj/project.pbxproj
          grep -q 'DIAGNOSTICS_CANDIDATE = "DEV-send-stream-0.1.0-b102";' ChatGPTClient.xcodeproj/project.pbxproj
          grep -q 'CoveredWebProcessKillProbe.install()' ChatGPTClient/AppDelegate.swift
          grep -q 'delaySeconds: TimeInterval = 120' ChatGPTClient/Protocol/CoveredWebProcessKillProbe.swift
          grep -q '_killWebContentProcessAndResetState' ChatGPTClient/Protocol/CoveredWebProcessKillProbe.swift
          grep -q 'window.__coveredWebSendExecutor.submit(' ChatGPTClient/Protocol/CoveredWebProcessKillProbe.swift
          grep -q 'network_connection_lost_current_transient' ChatGPTClient/Conversation/ConversationFeature.swift
          grep -q 'foregroundConversationDiscovery.requested' ChatGPTClient/RootViewController.swift
          grep -q 'coveredExecutor.externalWebProcessRecovery' ChatGPTClient/RootViewController.swift
          ! grep -q 'sendExistingConversation' ChatGPTClient/Protocol/CoveredWebProcessKillProbe.swift

      - name: Toolchain
        run: xcodebuild -version

      - name: Build unsigned TrollStore IPA candidate
        run: bash scripts/build_ipa.sh

      - name: Inspect artifact
        run: |
          ls -lh build/artifacts
          unzip -l build/artifacts/*.ipa | head -n 40

      - name: Upload IPA candidate
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPTClient-DEV-send-stream-0.1.0-b102
          path: |
            build/artifacts/*.ipa
            build/artifacts/*.sha256
          if-no-files-found: error
          retention-days: 14
