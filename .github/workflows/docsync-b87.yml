name: Sync b87 package evidence

on:
  push:
    branches:
      - staging/send-stream-b87-docsync-20260902

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout docsync tools
        uses: actions/checkout@v4
        with:
          ref: staging/send-stream-b87-docsync-20260902
          path: tools
          fetch-depth: 1

      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: dev/send-stream-20260829
          path: work
          fetch-depth: 0

      - name: Patch evidence docs
        working-directory: work
        run: python3 ../tools/scripts/docsync_b87.py

      - name: Verify and push
        working-directory: work
        run: |
          git diff --check
          grep -F 'DEV-send-stream-0.1.0-b87' docs/project/BUILD_TEST_INDEX.md >/dev/null
          grep -F 'canonical Artifact: `9837745187`' docs/project/current/dev/DEV-send-stream.md >/dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/project/BUILD_TEST_INDEX.md docs/project/current/dev/DEV-send-stream.md
          git commit -m 'docs(send): record canonical b87 package evidence'
          git push origin HEAD:dev/send-stream-20260829
